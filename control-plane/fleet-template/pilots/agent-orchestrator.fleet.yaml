  worktree_prefix: ao-agent-orchestrator-
  lane_namespace: agent-orchestrator
  exclusive: true
definition:
  repo: agent-orchestrator
  roles:
  - id: agent-orchestrator:commander
    role: commander
    tier: brain
    model: claude-sonnet-5
    transport: api
    effort: medium
    description: routing, decomposition, dispatch decisions
    memory_file: .fleet/agent-orchestrator/memory/commander.md
    state: required
    parallelism: 1
  - id: agent-orchestrator:general
    role: general
    tier: brain
    model: claude-sonnet-5
    transport: api
    effort: medium
    description: CI triage, merge order, cross-cutting judgement
    memory_file: .fleet/agent-orchestrator/memory/general.md
    state: required
    parallelism: 1
  - id: agent-orchestrator:soldier
    role: soldier
    tier: volume
    model: deepseek-v4-pro
    transport: api
    effort: low
    description: bulk execution -- the volume tier
    memory_file: .fleet/agent-orchestrator/memory/soldier.md
    state: required
    parallelism: 12
  - id: agent-orchestrator:auditor
    role: auditor
    tier: verify
    model: deepseek-v4-pro
    transport: api
    effort: medium
    description: verdicts on soldier output; the seat the architecture rests on
    memory_file: .fleet/agent-orchestrator/memory/auditor.md
    state: required
    parallelism: 1
  - id: agent-orchestrator:advisor
    role: advisor
    tier: escalate
    model: claude-opus-4-8
    transport: cli
    effort: high
    description: escalation path when a soldier is stuck
    memory_file: .fleet/agent-orchestrator/memory/advisor.md
    state: parked
    parallelism: 1
  smes:
  - id: agent-orchestrator:sme:testing
    domain: testing
    sme: test-quality
    role: soldier
    tier: volume
    model: deepseek-v4-pro
    labels:
    - domain:testing
    - testing
    - test
    - coverage
    - vitest
    prompt: test-quality.txt
    state: required
  - id: agent-orchestrator:sme:security-scanning
    domain: security-scanning
    sme: security
    role: soldier
    tier: volume
    model: deepseek-v4-pro
    labels:
    - domain:security
    - security
    - auth
    - secret
    - injection
    prompt: security.txt
    state: required
  - id: agent-orchestrator:sme:debugging
    domain: debugging
    sme: sniper-generic
    role: soldier
    tier: volume
    model: deepseek-v4-pro
    labels:
    - domain:debugging
    - bug
    - debug
    - incident
    - crash
    prompt: sniper-generic.txt
    state: required
  - id: agent-orchestrator:sme:infra
    domain: infra
    sme: terraform
    role: soldier
    tier: volume
    model: deepseek-v4-pro
    labels:
    - domain:infra
    - infra
    - terraform
    - cloudbuild
    - deploy
    prompt: terraform.txt
    state: required
  - id: agent-orchestrator:sme:backend-server
    domain: backend-server
    sme: prisma-db
    role: soldier
    tier: volume
    model: deepseek-v4-pro
    labels:
    - domain:backend
    - backend
    - api
    - server
    - middleware
    prompt: prisma-db.txt
    state: required
  - id: agent-orchestrator:sme:docs
    domain: docs
    sme: sniper-generic
    role: soldier
    tier: volume
    model: deepseek-v4-pro
    labels:
    - domain:docs
    - docs
    - readme
    - knowledge
    prompt: sniper-generic.txt
    state: required
  routing:
    lenses:
    - lens: lens:testing
      platoon: qa
      parallelism: 3
      domains:
      - testing
    - lens: lens:security-scanning
      platoon: security
      parallelism: 2
      domains:
      - security-scanning
    - lens: lens:debugging
      platoon: debugging
      parallelism: 2
      domains:
      - debugging
    - lens: lens:infra
      platoon: infra
      parallelism: 2
      domains:
      - infra
    - lens: lens:backend-server
      platoon: backend
      parallelism: 2
      domains:
      - backend-server
    - lens: lens:docs
      platoon: docs
      parallelism: 1
      domains:
      - docs
    domain_to_role:
      testing: soldier
      security-scanning: soldier
      debugging: soldier
      infra: soldier
      backend-server: soldier
      docs: soldier
  finops:
    currency: USD
    fleet_total: 600
    per_role:
      commander: 60
      general: 40
      soldier: 160
      auditor: 70
      advisor: 30
    per_domain:
      testing: 30
      security-scanning: 20
      debugging: 15
      infra: 20
      backend-server: 20
      docs: 15
    max_parallelism: 12
  parallelism:
    total: 12
    per_lens:
      lens:testing: 3
      lens:security-scanning: 2
      lens:debugging: 2
      lens:infra: 2
      lens:backend-server: 2
      lens:docs: 1
