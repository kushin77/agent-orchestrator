apiVersion: ao.fleet-template/v1
kind: FleetInstance
metadata:
  repo: agent-orchestrator
  display_name: agent-orchestrator agent fleet
  template: per-repo-sme-fleet
  template_version: 1.0.0
  template_sha256: b22985e69b9a748456490800722e82a1eb407b3df8b77980d2f2698c86052a94
