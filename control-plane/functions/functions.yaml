# control-plane/functions/functions.yaml
#
# THE ONE DECLARATION OF EVERY COCKPIT FUNCTION (issue #565, RC-10 of EPIC #551).
#
# ADR-0026 D9 fixed the requirement: adding a domain -- FinOps, SLO, audit,
# tickets, paperclip -- must be a DECLARATION in a closed function registry,
# not a fork of the client. This file is that declaration. The cockpit (#566,
# RC-11) renders what is declared here and types what is declared here; it
# carries no catalogue of its own.
#
# WHAT A FUNCTION IS. A cockpit function is one thing an operator sees or
# types: a panel (a read projection), a view (a live stream) or a command (an
# RC-2 control verb reached over RC-3's route family). Each is declared once,
# with its mnemonic, its human title, the endpoint(s) it binds to, its
# parameters, the identity/rbac scope a caller needs, its effect class, the
# stream it subscribes to when it is live, and the roles it is designed for.
#
# WHAT THIS FILE DOES NOT DECIDE. Nothing here grants, denies or widens a
# permission. `roles` is a RECOMMENDATION -- additive filtering only, per
# ADR-0026 D8/D9: "a role can never make visible something the API would not
# already serve that caller", and "the cockpit adds no second permission
# vocabulary and no role table of its own". Permission stays with
# identity/rbac, rechecked per call by RC-3 (portal/server/control_api.py
# `_require_capability`, the two gates: scope, then permission).
#
# Validated by `control-plane/functions/cli.py validate` and gated by
# `scripts/check-control-functions.sh`.
#
# THE CLOSED SETS ARE CONSUMED, NOT RESTATED. The effect classes and every
# command's capability and audit action belong to RC-2's vocabulary; the
# surfaces and their routes belong to the feature-flag registry; the
# permissions belong to identity/rbac. This file cites them and the gate
# refuses a citation the owner does not declare -- a second copy of any of
# them would be a second authority.

schema: cmr.control-functions/v1

# ---------------------------------------------------------------------------
# The declared authorities this registry reads (never a copy of them).
# ---------------------------------------------------------------------------
consumes:
  vocabulary: control-plane/control/verbs.yaml
  surfaces: infra/feature-flags/registry.yaml
  permissions: identity/rbac/model.py

# ---------------------------------------------------------------------------
# The closed role set. A role is a lens, never a grant.
# ---------------------------------------------------------------------------
# ADR-0026 D8: CTO / VP-Eng / Manager / Analyst are named workspaces over ONE
# function set, scoped by identity/rbac plus entitlements. A role narrows what
# is shown; it never authorises a call. There is deliberately no `permission`,
# `allow` or `grant` field anywhere in this file -- adding one would be the
# second permission vocabulary ADR-0025 D2.3 forbids.
roles:
  CTO: "Owns the fleet: the whole function set, including the irreversible levers."
  VP-Eng: "Runs the fleet: the full lifecycle, the board, recover and closure."
  Manager: "Runs the work: the board, the channel, the closure trail, and the read planes."
  Analyst: "Reads everything and commands nothing: panels, views and read verbs."

kinds:
  panel: "A read projection of one surface (snapshot / report / catalogue)."
  view: "A live subscription to a surface's own push channel."
  command: "One RC-2 control verb, reached over RC-3's /api/control route family."

parameter_types:
  string: "A text value."
  integer: "A whole number."
  boolean: "true or false."
  string-list: "An ordered list of text values."

# ---------------------------------------------------------------------------
# Not a cockpit function, on the record.
# ---------------------------------------------------------------------------
# The same rule RC-2 applies to a withheld verb applies here to a surface: a
# surface is never silently dropped, because a dropped surface is one a later
# lane re-invents as a bespoke panel. The gate fails on any declared surface
# that is neither declared above nor named here.
undeclared:
  - kind: surface
    ref: remote_control
    reason: >-
      The transport the commands already travel over, not a thing an operator
      looks at. Every command function below binds to a route inside this
      family; declaring it again as a panel would be a second copy of RC-3's
      route family.
  - kind: surface
    ref: chat
    reason: >-
      The conversational surface is ADR-0023's own lane and its own client
      posture. RC-2 declares no chat verb, so there is no control effect class
      to reuse for a chat turn -- and declaring one here would invent the
      second vocabulary this registry exists to avoid.
  - kind: surface
    ref: fleet_health_export
    reason: >-
      A push exporter: its own declaration names no HTTP route for a client to
      read, so there is nothing for a panel to bind to. A function without an
      endpoint is not a function.
  - kind: surface
    ref: telemetry_exposition
    reason: >-
      A push exporter by decision: its declaration states it "ships no HTTP
      route, no /metrics and no bound port" (ADR-0022 fixes push as the
      transport). No client-reachable endpoint exists to declare.

