  - id: CFG
    title: Platform modules
    kind: panel
    endpoints:
      - {route: /api/portal/surfaces, surface: portal_surfaces}
    parameters: []
    scope:
      capability: null
      why_no_capability: >-
        The portal-surfaces feed is served to any authenticated principal
