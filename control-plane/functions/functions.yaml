# control-plane/functions/functions.yaml
#
# THE ONE DECLARATION OF EVERY COCKPIT FUNCTION (issue #565, RC-10 of #551).
#
# ADR-0026 D9 fixes the shape and decision 10 is the mandate: adding a domain --
# FinOps, SLO, audit, tickets, paperclip -- is a DECLARATION here, never a fork of
# the cockpit client. This file is the extensibility contract: the closed
# catalogue of the panels the cockpit renders, the views it offers and the
# commands the operator types, each declared exactly once.
#
# NOTHING HERE IS RE-DECLARED. This registry CONSUMES the authorities that
# already exist, and the gate proves each one is the live article:
#
#   * effect classes, capabilities, and every verb a function binds
#     -> control-plane/control/verbs.yaml            (RC-2, issue #553)
#   * the API endpoint set a function may bind
#     -> portal/server/control_api.py                (RC-3, issue #554)
#   * the live streams a function may subscribe to
#     -> portal/server/fleet.py, portal/server/live_feed.py
#   * the scope levels a function may require
#     -> identity/rbac/model.py; the control path's org -> fleet_authz.PLATFORM_ORG
#   * the feature flags a function names
#     -> infra/feature-flags/registry.yaml
#   * the panels the existing cockpit renders
#     -> fleet/console.py (rendered headlessly by the gate, section by section)
#
# A function carries: a stable id (the operator-typed mnemonic), a title, the
# endpoints it binds, its parameters, its scope requirement (capability + tenant
# scope), its effect class -- RC-2's vocabulary, not a second one -- the stream it
# subscribes to when it is live, and the roles it is designed for.
#
# ROLE SUITABILITY IS ADDITIVE FILTERING ONLY (ADR-0026 decision 9). `roles` says
# who a function is DESIGNED FOR; it never says who is PERMITTED. Permission stays
# where it already lives (`identity/rbac`, via the capability in `scope`), and the
# gate fails if role information ever appears inside a function's scope block.

schema: cmr.cockpit-functions/v1

# ---------------------------------------------------------------------------
# The closed kinds. What a function IS to the operator.
# ---------------------------------------------------------------------------
# panel    a section of the rendered frame, refreshed in place
# view     a read-only screen over a projection
# command  something the operator types that can change fleet state
kinds:
  panel: "a section of the rendered frame"
  view: "a read-only screen over a projection"
  command: "an operator-typed action; its effect class is RC-2's"

# ---------------------------------------------------------------------------
# The closed parameter types. A parameter with no type is a defect.
# ---------------------------------------------------------------------------
parameter_types:
  string: "free text"
  integer: "a whole number"
  number: "a number (integer or fractional)"
  boolean: "true/false (a flag)"
  enum: "one of the closed `values` list"

# ---------------------------------------------------------------------------
# The closed role set (ADR-0026 D8: role tiers are views, never products).
# ---------------------------------------------------------------------------
roles:
  CTO: "the whole fleet, and the irreversible verbs"
  VP-Eng: "rungs, dispatch, recovery, closure"
  Manager: "day-to-day rung and board state"
  Analyst: "ledgers, events and read-only evidence"

# ---------------------------------------------------------------------------
# What this registry consumes (verified by the gate against the live article).
# ---------------------------------------------------------------------------
consumes:
  verbs: control-plane/control/verbs.yaml
  transport: portal/server/control_api.py
  scopes: identity/rbac/model.py
  flags: infra/feature-flags/registry.yaml
  cockpit: fleet/console.py
  streams:
    fleet_projection: portal/server/fleet.py
    telemetry_live_feed: portal/server/live_feed.py

# ---------------------------------------------------------------------------
# The panels the existing cockpit renders, by function.
# ---------------------------------------------------------------------------
# The key is the section title `fleet/console.py` renders (the gate derives the
# set by rendering that module headlessly, so a new section there is a FAILURE
# naming the panel here until it is declared). The value is the function that
# owns it. Both directions are checked: a rendered panel with no function, and a
# function that no longer exists, are each a defect.
renders:
  HEADER: HEADER
  RUNGS: RUNGS
  ORDERS: ORDERS
  DISPATCHES: DISPATCHES
  LIVE CLAIMS: CLAIMS
  WAVES: WAVES
  RECENT EVENTS: EVENTS
  WATCHDOG: WATCHDOG

# ---------------------------------------------------------------------------
# The functions.
# ---------------------------------------------------------------------------
# id          the operator-typed mnemonic (Bloomberg-function style, upper case)
# endpoints   the API endpoints it binds, `<family>/<action>`, each of which
#             must resolve in RC-3's declared route set and be exposed there
# stream      the live surface it subscribes to, if it is live
# parameters  name, type, required, default (null = "the lever's own default")
# scope       capability (from RC-2) + level (from identity/rbac) + tenant
# effect_class read | hold | stop | irreversible -- RC-2's closed set
# audit       null for a read, the recorded action for anything else (RC-2 rule)
# flags       every feature flag the function's visibility depends on
# roles       DESIGNED FOR -- additive filtering only, never permission
functions:
  # -- the panels the cockpit already renders -------------------------------
  - id: HEADER
    title: "Fleet header — repo, session, HEAD and uptime"
    kind: panel
    endpoints: [fleet/status]
    parameters: []
    scope: {capability: fleet:read, level: org, tenant: platform}
    effect_class: read
    audit: null
    flags: [surfaces.remote_control]
    roles: [CTO, VP-Eng, Manager, Analyst]

  - id: RUNGS
    title: "Rungs — every resident rung, its beat and its state"
