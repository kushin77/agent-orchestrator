      - {name: out, type: string, required: false, default: null}
    scope: {capability: board:admin, level: org, tenant: platform}
    effect_class: hold
    audit: board.snapshot
    flags: [surfaces.remote_control]
    roles: [CTO, VP-Eng, Analyst]

  - id: REAP
    title: "Reap claims wedged by dead agents"
    kind: command
    endpoints: [board/reap]
    parameters:
      - {name: older-than-minutes, type: integer, required: false, default: null}
      - {name: issue, type: integer, required: false, default: null}
      - {name: reaper, type: string, required: false, default: brain}
    scope: {capability: board:admin, level: org, tenant: platform}
    effect_class: stop
    audit: board.reap
    flags: [surfaces.remote_control]
    roles: [CTO, VP-Eng]

  - id: TRIGGER
    title: "Trigger — on a stale snapshot: refresh once, else park the directive"
    kind: command
    endpoints: [board/trigger]
    parameters:
      - {name: directive, type: string, required: true, default: null}
      - {name: repo, type: string, required: false, default: kushin77/agent-orchestrator}
      - {name: stale-minutes, type: integer, required: false, default: null}
      - {name: fleet-dir, type: string, required: false, default: ""}
    scope: {capability: board:admin, level: org, tenant: platform}
    effect_class: hold
    audit: board.trigger
    flags: [surfaces.remote_control]
    roles: [CTO, VP-Eng]

  # -- orphan reconciliation ------------------------------------------------
  - id: SWEEP
    title: "One reconciliation pass over orphaned sessions"
    kind: command
    endpoints: [recover/sweep]
    parameters:
      - {name: ttl-minutes, type: number, required: false, default: null}
      - {name: apply, type: boolean, required: false, default: false}
    scope: {capability: fleet:recover, level: org, tenant: platform}
    effect_class: stop
    audit: recover.sweep
    flags: [surfaces.remote_control]
    roles: [CTO, VP-Eng]

  - id: STAMP
    title: "Stamp a session heartbeat"
    kind: command
    endpoints: [recover/stamp]
    parameters:
      - {name: session, type: string, required: true, default: null}
      - {name: issue, type: integer, required: true, default: null}
      - {name: agent, type: string, required: true, default: null}
      - {name: lane, type: string, required: false, default: ""}
      - {name: worktree, type: string, required: false, default: ""}
      - {name: branch, type: string, required: false, default: ""}
      - {name: pid, type: integer, required: false, default: null}
      - {name: note, type: string, required: false, default: ""}
    scope: {capability: fleet:recover, level: org, tenant: platform}
    effect_class: hold
    audit: recover.stamp
    flags: [surfaces.remote_control]
    roles: [VP-Eng]

  - id: CLEAR
    title: "Clear a session heartbeat"
    kind: command
    endpoints: [recover/clear]
    parameters:
      - {name: session, type: string, required: true, default: null}
    scope: {capability: fleet:recover, level: org, tenant: platform}
    effect_class: hold
    audit: recover.clear
    flags: [surfaces.remote_control]
    roles: [VP-Eng]

  # -- closure --------------------------------------------------------------
  - id: CLOSE
    title: "Drive one item to hygienic closure"
    kind: command
    endpoints: [closure/close]
    parameters:
      - {name: issue, type: integer, required: true, default: null}
      - {name: evidence, type: string, required: false, default: ""}
      - {name: apply, type: boolean, required: false, default: false}
    scope: {capability: board:close, level: org, tenant: platform}
    effect_class: irreversible
    audit: closure.close
    flags: [surfaces.remote_control]
    roles: [CTO, VP-Eng]

  - id: RETIRE
    title: "Retire a sent/ directive for a superseded issue (#861)"
    kind: command
    endpoints: [closure/retire]
    parameters:
      - {name: directive, type: string, required: true, default: null}
      - {name: reason, type: string, required: true, default: null}
      - {name: superseded-by, type: string, required: true, default: null}
      - {name: closed, type: boolean, required: false, default: false}
      - {name: root, type: string, required: false, default: ""}
    scope: {capability: board:admin, level: org, tenant: platform}
    effect_class: irreversible
    audit: closure.retire
    flags: [surfaces.remote_control]
    roles: [CTO, VP-Eng]
    note: >-
      The second terminal mode next to CLOSE's "landed" gate: retires a
      sent/ directive whose issue is closed WITHOUT a change of its own
      (superseded). superseded-by is the lever's own space-separated list of
      issue number(s) (`--superseded-by 723 727 754`); the cockpit passes it
      as one string token.
