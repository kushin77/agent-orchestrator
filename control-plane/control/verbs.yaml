    idempotent: true
    exposed: true
    refusals: [401, 403, 503]
    note: >-
      Reports/validates the owner's committed dispatch queue (#928): `--next`
      prints the next claimable issue(s) and `--check` validates the queue (no
      duplicates, all numbers known, no cycles, and with a fresh board every
      queued issue exists and is open). Read-only: it changes no dispatch
      decision; the write that moves an issue through the queue is the claim
      path (board.claim).

  - id: board.freshness
    source: governance/dispatch/cli.py
    local: freshness
    effect_class: read
    allowed_runtimes: [claude-session, claude-subagent, deepseek-sister, deepseek-executor, copilot-agent, hermes, paperclip]
    capability: board:read
    audit: null
    idempotent: true
    exposed: true
    refusals: [401, 403, 503]
    note: >-
      Answers whether the committed board snapshot's age is inside the
      tolerance this consumer declares (issue #1189): a tri-state,
      fail-closed assessment (OK inside the tolerance / FAIL outside it or
      unaged / CANNOT-ASSESS unreadable or absent), naming the file, the
      timestamp, the age and the ONE refresh verb (board.trigger) as the
      remedy. Read-only: it changes no dispatch decision and asserts nothing
      into any rail, so it declares no audit action, exactly like
      board.queue, the other freshness-adjacent read this file declares.

