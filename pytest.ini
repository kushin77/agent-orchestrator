[pytest]
# Rootdir pin for this checkout (issue #1212).
#
# With no config file at the repository root, pytest walks UP from whatever
# directory it is invoked in and adopts the first ancestor ini it finds. On the
# shared build box a stray `/tmp/pytest.ini` set `addopts = --import-mode=importlib`
# and any lane whose worktree sat under `/tmp` adopted it: importlib mode never
# prepends a test directory to `sys.path`, so the `from conftest import ...`
# idiom the suites here use died with `ModuleNotFoundError: No module named
# 'conftest'` and four composite checks reported a red the commit did not have.
# The file below is found first, so that ancestor can never win.
#
# It deliberately declares NO options and NO `addopts`: the defect was the
# ancestor's import mode, not the rootdir, so a bare `[pytest]` table pins where
# pytest resolves config while changing nothing about how a test is imported or
# collected. `scripts/check-pytest-rootdir.sh` refuses an `addopts` or an import
# mode here, by name.
