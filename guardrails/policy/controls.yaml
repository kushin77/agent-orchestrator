# guardrails/policy/controls.yaml — controls registry for the guardrail
# policy gates (issue #26 acceptance #3).
#
# Each control is the smallest rollout unit — "a thing a web toggle flips"
# (shape adapted from kushin77/CMR guardrails/policy/controls.yaml).  Every
# control ships enabled: false by default (AO-GR-6, flag-gated OFF doctrine);
# flipping one ON is the deliberate, reviewed act that activates the policies
# gated behind it.  The engine enforces a policy only when every control id
# it declares is registered AND enabled.
#
# Schema: schema/controls.schema.json  ·  Validator: policy/controls.py
# (fails on duplicate ids, mode/off inconsistency, and an enabled control
# that does not document on_since_rationale).

version: 1
controls:
  - id: model-call-budget
    name: Model call budget enforcement
    description: >-
      Activates the model-call-budget policy: model calls whose metered
      token utilization crosses the tenant budget are warned at 80% and
      blocked at 100%.
    enabled: false
    mode: block
    implemented_by:
      - guardrails/policy/bundles/platform/model-call-budget.yaml
    since: "issue #26"
    notes: >
      (informational) Default OFF; a tenant enables budget enforcement when
      its metering surface publishes budget.utilization_ratio.
  - id: tool-use-guard
    name: Tool-use restrictions
    description: >-
      Activates the tool-use-guard policy: shell and exfiltration-family
      tools are blocked unless the tenant granted them; risky probes warn.
    enabled: false
    mode: block
    implemented_by:
      - guardrails/policy/bundles/platform/tool-use.yaml
    since: "issue #26"
  - id: data-egress-guard
    name: Data egress guard
    description: >-
      Activates the data-egress-guard policy: outbound egress carrying
      pii/secret classifications or travelling over cleartext http is
      blocked; sensitive egress warns.
    enabled: false
    mode: block
    implemented_by:
      - guardrails/policy/bundles/platform/data-egress.yaml
    since: "issue #26"

  # ------------------------------------------------------------------------ #
  # Workbook mechanical-rule controls (issue #636).  One per mechanical
  # enforcement rule derived from the enterprise workbook's C-suite org chart
  # (issue #614 / gap analysis #631); each gates exactly one policy in
  # bundles/platform/workbook-mechanical-rules.yaml.  All ship OFF.
  # ------------------------------------------------------------------------ #
  - id: workbook-vector-memory-frontload
    name: Workbook rule — vector-memory frontload
    description: >-
      Activates the workbook-vector-memory-frontload policy: a goal/
      objective prefetch that frontloads a vector memory is refused
      (prefetch.frontloaded == true -> BLOCK).
    enabled: false
    mode: block
    implemented_by:
      - guardrails/policy/bundles/platform/workbook-mechanical-rules.yaml
    since: "issue #636"
  - id: workbook-drawio-mcp-diagramming
    name: Workbook rule — draw.io MCP diagramming
    description: >-
      Activates the workbook-drawio-mcp-diagramming policy: a draw.io
      diagram step is allowed only when the producer declares its MCP tool
      list cacheable; anything else refuses.
    enabled: false
    mode: block
    implemented_by:
      - guardrails/policy/bundles/platform/workbook-mechanical-rules.yaml
    since: "issue #636"
  - id: workbook-external-state-caching
    name: Workbook rule — external-state caching
    description: >-
      Activates the workbook-external-state-caching policy: an external-state
      sync is allowed only when the producer declares the state snapshot
      cacheable; anything else refuses.
    enabled: false
    mode: block
    implemented_by:
      - guardrails/policy/bundles/platform/workbook-mechanical-rules.yaml
    since: "issue #636"
  - id: workbook-zero-token-arithmetic
    name: Workbook rule — zero-token arithmetic
    description: >-
      Activates the workbook-zero-token-arithmetic policy: a cost/arithmetic
      step is allowed only when the producer declares the deterministic
      (zero-token) result cacheable; anything else refuses.
    enabled: false
    mode: block
    implemented_by:
      - guardrails/policy/bundles/platform/workbook-mechanical-rules.yaml
    since: "issue #636"
  - id: workbook-webhook-caching
    name: Workbook rule — webhook caching
    description: >-
      Activates the workbook-webhook-caching policy: an inbound webhook is
      allowed only when the producer declares the payload cacheable;
      anything else refuses.
    enabled: false
    mode: block
    implemented_by:
      - guardrails/policy/bundles/platform/workbook-mechanical-rules.yaml
    since: "issue #636"
