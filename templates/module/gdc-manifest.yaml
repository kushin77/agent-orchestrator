# Spoke-side declaration (EPIC-09 / CMR-901), born from templates/module/ in
# kushin77/CMR. The mandatory indexer-KB pin (GR-18), the diagrams.blueprint
# pin (GR-18, CMR:ONBOARD-0005, second mandatory module), the
# shared-frontend.tokens pin (GR-18, CMR:ONBOARD-0003, third mandatory
# module), and the shared-governance.gates pin (GR-18, CMR:ONBOARD-0008,
# fourth mandatory module) are pre-declared — none must be removed. Declare
# the module's own features/integrations alongside them.
# repo: {{REPO}}
schema: cmr.gdc-manifest/v1
name: "{{MODULE_ID}}"
features:
  - id: code-indexing.mcp
    default: "on"
    flags: ["codeidx.surface.mcp"]
integrations: []
modules:
  - module: code-indexing.mcp
    version: 0.1.0
    updates: pr
  - module: diagrams.blueprint
    version: 0.1.0
    updates: pr
  - module: shared-frontend.tokens
    version: "~0.1"
    updates: pr
  - module: shared-governance.gates
    version: "~0.1"
    updates: pr
updates: pr
