# Owner-committed dispatch queue (issue #928, seeded from the "Owner queue
# 2026-09-16" comment on #878).
#
# Schema:
#   waves: an ordered list of {name, issues}. Issues are the owner's forced
#   order WITHIN a wave (each issue is implicitly blocked_by every earlier
#   issue in the same wave's list); every issue in a LATER wave is implicitly
#   blocked_by every issue in an EARLIER wave. Only issue numbers that are
#   still OPEN act as blockers (governance/dispatch/queue.py filters closed
#   ones out against the live snapshot).
#
#   blocked_by (optional): explicit overrides/additions, {issue: [issue, ...]},
#   unioned in on top of the implied wave edges. Use sparingly — most ordering
#   should come from wave placement, not a hand-written override.
#
# PR-merge-only entries from the owner comment (items whose action is "merge
# PR #NNN", not a claimable issue) are excluded: they are not dispatch units.
#
# Wave 0 (owner comment: "merge what's already green") originally listed PR
# numbers, not claimable issue numbers ("#906 (issue-830, ...)" etc.) — each
# was translated to its underlying issue number, PR framing dropped, order
# preserved. #913 was informational only (a refusal-path proof, not a unit of
# work) and was excluded; the seed set was the other seven #706/#607 chain
# items (#830 plus the six pruned below).
#
# item 13 of the owner comment's original forced order ("#884 L5: IaC —
# depends on #900/#901/#902 (Wave 0) landing first") made #902 a WAVE-0-class
# blocker of #884 (wave 1) at seed time; #902 has since closed (see the
# `queue --fix` note below) so that placement rationale is now historical
# only — #884 carries no live #902 edge any more.
#
# `governance/dispatch/cli.py queue --fix` (issue #1113) has since dropped
# every issue below that closed on GitHub, one per wave line as noted; run it
# again after future closures instead of hand-editing the `issues:` lists.

waves:
  - name: wave-0-golive-chain-and-cron-path
    # Seeded from #706 chain to D7 + #900/#901/#902 cron container path
    # (owner queue comment, section B, items 1-7; #606, item 7, was already
    # closed at seed time and omitted). `queue --fix` (#1113) has since
    # pruned #714, #712, #900, #715, #713, #902 as closed on GitHub, leaving
    # only the still-open #830.
    issues: [830]

  - name: wave-1-epic-878-lanes
    # EPIC #878 lanes L1-L11, forced order by dependency shape (owner queue
    # comment, section B, items 9-19). `queue --fix` (#1113) has since
    # pruned #882, #883, #885, #887, #888, #889 as closed on GitHub.
    issues: [880, 881, 884, 886, 890]

  - name: wave-2-epic-706-residual-and-golive
    # Seeded from #706 residual + go-live #607 (owner queue comment,
    # section B, items 21-26; PR-merge entries #927/#926/#924 excluded;
    # #902 moved to wave 0, see note above). `queue --fix` (#1113) has since
    # pruned #619, #731, #732 as closed on GitHub, leaving this wave empty.
    issues: []

  - name: wave-3-active-governance-bugs
    # Seeded from active bugs/governance blocking the ratchet itself (owner
    # queue comment, section B, items 27-30). `queue --fix` (#1113) has
    # since pruned #865, #866, #786, #928 as closed on GitHub, leaving this
    # wave empty.
    issues: []

blocked_by: {}
