goal: "CRM + Asterisk voice fully operational and functioning, end to end"

paperclip:
  project_id: "purebliss-crm-voice"
  project_name: "Purebliss CRM + Voice — enterprise project plan"
  owner_persona: pmo
  sync_adapter_status: not-implemented  # tracked in issue #1649
  milestone_owners:
    M0: platform-sme
    M1: cto
    M2: cto
    M3: hermes
    M4: pmo

milestones:
  - id: M0
    name: "Infra stabilized"
    order: 0
    exit_criteria:
      - description: ".42 outage closed"
        command: "gh issue view 4264 --repo kushin77/shared-services --json state -q .state"
        expect: "CLOSED"
      - description: "shared-services apply sequence at steady state"
        command: "gh issue view 3867 --repo kushin77/shared-services --json state -q .state"
        expect: "CLOSED"

  - id: M1
    name: "CRM foundation reachable"
    order: 1
    exit_criteria:
      - description: "purebliss api/app backend deployed (not 404)"
        command: "gh issue view 120 --repo kushin77/purebliss --json state -q .state"
        expect: "CLOSED"
      - description: "no live CRM credentials committed to git"
        command: "gh issue view 121 --repo kushin77/purebliss --json state -q .state"
        expect: "CLOSED"

  - id: M2
    name: "Voice (Asterisk/dial) foundation reachable"
    order: 2
    exit_criteria:
      - description: "dial.purebliss.app landing runbook complete"
        command: "gh issue view 4094 --repo kushin77/shared-services --json state -q .state"
        expect: "CLOSED"
      - description: "dial-api + WebSocket origin gated behind shared tunnel"
        command: "gh issue view 4095 --repo kushin77/shared-services --json state -q .state"
        expect: "CLOSED"
      - description: "os-auth integration contract for Go engine + realtime"
        command: "gh issue view 4096 --repo kushin77/shared-services --json state -q .state"
        expect: "CLOSED"

  - id: M3
    name: "CRM + voice hardened (data plane, network, observability)"
    order: 3
    exit_criteria:
      - description: "DIAL-4 data-plane + secrets registration closed"
        command: "gh issue view 4097 --repo kushin77/shared-services --json state -q .state"
        expect: "CLOSED"
      - description: "DIAL-6 network + carrier egress posture closed"
        command: "gh issue view 4099 --repo kushin77/shared-services --json state -q .state"
        expect: "CLOSED"
      - description: "Dialplane → shared-services e2e integration review closed"
        command: "gh issue view 4093 --repo kushin77/shared-services --json state -q .state"
        expect: "CLOSED"

  - id: M4
    name: "CRM + Asterisk voice operational e2e"
    order: 4
    exit_criteria:
      - description: "shared-services-dial-api container health"
        command: "curl -s -o /dev/null -w '%{http_code}' https://dial.purebliss.app/healthz"
        expect: "200"
      - description: "purebliss app backend health"
        command: "curl -s -o /dev/null -w '%{http_code}' https://app.purebliss.app/healthz"
        expect: "200"

  - id: M5
    name: "Fleet hygiene backlog (clusters.json, issue #1575)"
    order: 5
    exit_criteria:
      - description: "no open docs/friction/lessons/offshore cluster issues remain in shared-services"
        command: "gh issue list --repo kushin77/shared-services --search 'label:pmo-cluster-docs,pmo-cluster-friction,pmo-cluster-lessons,pmo-cluster-offshore state:open' --json number -q 'length'"
        expect: "0"

