# governance/controls/spine-coverage.yaml — full spine → control map (#890,
# lane L11 of EPIC #878).
#
# THE DEFECT THIS EXISTS FOR
#   scripts/control-coverage.tsv (#874) maps only Part B (AO-GR-12..20) of
#   docs/GOLDEN-RULES.md. Part A (AO-GR-1..11), Part C (AO-GR-21..27), and the
#   hub rules this repo cites by number (CMR `GR-2`..`GR-10`, `GR-12`) had no
#   machine-readable row anywhere: a reviewer could not walk from ANY rule id
#   in the spine to the control that enforces it and the gate that runs it.
#   This file is that map, for every rule id in scope, not just Part B.
#
#   #803 (branch protection, required checks, CODEOWNERS as delivery controls)
#   is included explicitly (rows tagged `delivery: true`) so the coverage map
#   does not silently omit the controls #803 is about, even though #803 itself
#   is a separate open EPIC this lane does not close (see docs/GOVERNANCE.md
#   "Spine coverage map" residuals).
#
# SCOPE
#   * AO-GR-1..27  — this repo's own spine (docs/GOLDEN-RULES.md Parts A/B/C).
#   * GR-2/3/4/5/6/7/8/9/10/12 — hub (kushin77/CMR) rules this repo's spine
#     explicitly cites by number (docs/GOLDEN-RULES.md line ~690 table and the
#     per-rule "Why." citations). Each is recorded as `origin: hub-cited`,
#     mapped to the LOCAL control that operationalizes it in this repo (the
#     same control the citing AO-GR-x row uses, since the citation exists
#     precisely because the local rule implements the hub rule here).
#   * GR-1 and GR-24 appear in the docs only as the endpoints of the general
#     "hub golden rules bind (GR-1...GR-24)" range statement (AGENTS.md line
#     9) — not as a specific rule cited by number for a local decision — so
#     they are recorded `origin: hub-uncited` with `status: not-applicable`
#     (do not confuse hub GR-24 here with the local AO-GR-24 row above, which
#     IS a cited, enforced local rule). GR-11 is not textually cited anywhere
#     in this repo's spine and therefore has no row at all (a row for an
#     uncited id would itself be a row-for-unknown-rule finding).
#
# STATUS VOCABULARY (same three-state honesty as scripts/control-coverage.tsv)
#   ENFORCED          a gate control exists whose stated subject is this rule,
#                      the control file exists, and it is executable or is a
#                      suite scripts/pytest-suites.txt declares.
#   PARTIAL           a control exists and runs, but its own text says it
#                      checks less than the full rule (recorded verbatim).
#   GAP               no control enforces the rule today, OR the row names a
#                      control file that does not exist in the repository —
#                      the second case is recorded, never silently dropped.
#   not-applicable    hub rule this repo's spine does not cite; out of scope.
#
# `governance/controls/check_spine_coverage.py` validates every row below:
# every rule id parsed out of AGENTS.md/docs/GOLDEN-RULES.md has exactly one
# row; every `gate` path that is not literally "-" must exist AND be
# executable; a row claiming `covered: true` without an existing gate is
# refused BY NAME (its own negative control mutates a copy of this file).
#
# Format is YAML; each entry: rule id -> {status, covered, origin, modules,
# gate (comma-separated control files or suite:<dir>, "-" for none), note}.

