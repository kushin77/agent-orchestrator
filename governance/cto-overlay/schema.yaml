# JSON Schema (draft 2020-12, YAML representation) for the CTO overlay config.
#
# Validated by governance/cto-overlay/overlay.py on every load and by
# scripts/check-cto-overlay.sh. A config that does not validate is a hard
# failure (exit 2, CANNOT-ASSESS) — never a silent pass.
#
# The schema is deliberately strict about the two things the overlay cannot
# function without: all four layers must be declared (a missing layer would
# otherwise be a silent skip), and all four non-negotiable signals must be
# declared (a dropped signal is the classic false-green).
#
# The engine validates a keyword subset and REFUSES a schema that uses a
# keyword it does not implement, so this document can never quietly widen.
# Ported from kushin77/leaderboard/.cto/schema.yaml (see PROVENANCE in
# docs/CTO-OVERLAY.md); the upstream `pattern` values had lost their escapes
# (`^d+.d+.d+`), which is why the version pattern here is written in the
# YAML single-quoted form.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/kushin77/agent-orchestrator/governance/cto-overlay/schema.yaml"
title: "CTO Overlay Configuration"
description: "Schema for the four-layer per-repo governance overlay config."

type: object
required: [repo, overlay, layers, tiers, non_negotiable, signals]
additionalProperties: false

properties:
  repo:
    type: object
    required: [name, owner]
    additionalProperties: false
    properties:
      name:
        type: string
        minLength: 1
        description: "Repository name"
      owner:
        type: string
        minLength: 1
        description: "Repository owner (user or org)"

  overlay:
    type: object
    required: [version, source]
    additionalProperties: false
    properties:
      version:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        description: "Semver version of the overlay artifact"
      source:
        type: string
        minLength: 1
        description: "Where this overlay shape was harvested from"
      default_tier:
        type: string
        enum: [experimental, standard, critical]
        description: "Tier used when --tier is not given"

  layers:
    type: object
    required: [executive, engineering, devops, support]
    additionalProperties: false
    properties:
      executive:
        $ref: "#/$defs/layer"
      engineering:
        $ref: "#/$defs/layer"
      devops:
        $ref: "#/$defs/layer"
      support:
        $ref: "#/$defs/layer"

  tiers:
    type: object
    required: [experimental, standard, critical]
    additionalProperties: false
    properties:
      experimental:
        $ref: "#/$defs/tier"
      standard:
        $ref: "#/$defs/tier"
      critical:
        $ref: "#/$defs/tier"

  non_negotiable:
    type: array
    minItems: 4
    uniqueItems: true
    items:
      type: string
      enum: [shell_syntax, secret_scan, protected_files, path_integrity]
    allOf:
      - contains: {const: shell_syntax}
      - contains: {const: secret_scan}
      - contains: {const: protected_files}
      - contains: {const: path_integrity}
    description: "Signals that always run and must pass, whatever the tier"

  signals:
    type: object
    required: [protected_files]
    additionalProperties: false
    properties:
      shell_syntax:
        type: object
        additionalProperties: false
        properties:
          exclude_prefixes:
            type: array
            uniqueItems: true
            items:
              type: string
              minLength: 1
      secret_scan:
        type: object
        additionalProperties: false
        properties:
          max_file_bytes:
            type: integer
            minimum: 1
          file_suffixes:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              pattern: '^\.[A-Za-z0-9]+$'
          exempt_markers:
            type: array
            uniqueItems: true
            items:
              type: string
              minLength: 1
      protected_files:
        type: object
        required: [paths]
        additionalProperties: false
        properties:
          paths:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              minLength: 1
      path_integrity:
        type: object
        additionalProperties: false
        properties:
          max_path_length:
            type: integer
            minimum: 16

$defs:
  layer:
    type: object
    required: [enabled, blocking, checks]
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        description: "false = the layer does not run at all (reported as disabled)"
      blocking:
        type: boolean
        description: "true = a failure blocks; false = a failure warns"
      description:
        type: string
        minLength: 1
      checks:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/check"

  check:
    type: object
    required: [id]
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: '^[a-z][a-z0-9-]*$'
        description: "Check id the engine knows how to run"
      min_tier:
        type: string
        enum: [experimental, standard, critical]
        description: "Lowest tier at which this check runs"

  tier:
    type: object
    additionalProperties: false
    properties:
      executive:
        $ref: "#/$defs/severity"
      engineering:
        $ref: "#/$defs/severity"
      devops:
        $ref: "#/$defs/severity"
      support:
        $ref: "#/$defs/severity"

  severity:
    type: string
    enum: [blocking, warning, advisory]
