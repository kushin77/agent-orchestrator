# RCA + lessons enforcement policy (issue #141, scope re-cut by issue #766)
#
# Which board issues RECORD an incident (so the ledger must account for them),
# and how long an RCA may go without review.
#
# There are no exemptions, on purpose. This file used to carry an `exemptions:`
# list with one entry per issue that happened to hold the incident label — #141,
# then #494/#495/#497 — which made every holder exempt and the rule unable to
# fail. That is the failure this module exists to prevent, inverted.
#
# The scope declaration is the LABEL: an issue that records no incident simply
# does not carry it. The loader refuses two things by name, so the defect cannot
# come back as a YAML edit:
#   * an `area:` label as `incident_label` — an area says where the work lives,
#     not that the issue records an incident;
#   * any `board.exemptions` key at all.
# See governance/lessons/negative_control.py, which provokes both refusals.

schema: cmr.lessons/policy-v1

board:
  # The RECORD label: an issue that carries it *records* an incident, so an
  # `INC-*` line whose origin is that issue must exist in the ledger. It is
  # deliberately not an `area:` label: `area:incident-response` says where the
  # work lives, and keying this rule on it turned #141, #494, #495 and #497 —
  # all work items, none of them an incident — into findings.
  incident_label: incident

# An RCA that is never re-read is a document, not a practice.
review_cadence_days: 180
