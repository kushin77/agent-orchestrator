# Declared branch protection for the default branch — the platform-level
# enforcement of the gate of record (issue #803, P0-3; issue #6's promise).
#
# WHY THIS FILE EXISTS
# `AGENTS.md` said "`master` is protected by convention" and "Branch protection
# as code ships with issue #6". Measured 2026-09-15:
#     gh api repos/kushin77/agent-orchestrator/branches/master/protection
#     {"message":"Branch not protected", ..., "status":404}
# Neither was true. The gate of record (`make verify`, 128 checks, provably able
# to fail) was not required by the platform, and any process could push straight
# to the default branch. A rule that lives only in a doc is advisory; only a
# platform-enforced control is binding.
#
# The protection was then applied by an OPERATOR API call to close the exposure.
# That is itself a GR-5 breach — infrastructure is declared, never clicked — and
# it is not reproducible: a fork, a restore or a second repo diverges silently.
# This file is that declaration, and `scripts/branch-protection.sh` is the thing
# that makes it reproducible and keeps it honest.
#
# STATUS CHECKS — the #724 precondition, discharged; the requirement it
# justified was RETIRED on 2026-09-21 (see "`required_status_checks` IS `null`"
# below)
# `required_status_checks` stayed `null` until the poster was observed posting
# a REAL status from the runner, never a hand-typed one. Requiring a context
# before anything writes it is the #724 defect (an inert control whose own gate
# could not see that it was inert), and here it would have been worse: it would
# have blocked every merge in the repository instead of merely doing nothing.
#
# That precondition is now met. `scripts/gate-status.sh post` published the
# gate's outcome for two commits in turn, both ancestors of `master`, both via
# ADR-0028's code-native poster (no Actions):
#
#   0dbb0e6819979e329b615292adaa74ceecded5ee -> ao/gate-of-record: failure
#     (`make verify`: 1 of 203 checks failed — `check-futureproof-e2e`, because
#     the `shell-patterns` and `lessons` gates read BLIND/CANNOT-ASSESS against
#     the disposable `git worktree add --detach` scratch checkout used to run
#     that verify. That checkout was later found to have been silently pruned
#     mid-run by this host's own worktree tooling, which is consistent with a
#     measurement artifact rather than a real defect.)
#
#   83ff32dbcf40fe42c4ccbdcb3a41e5b4a48944f6 -> ao/gate-of-record: failure
#     (`make verify` re-run on a CLEAN, non-scratch worktree: `check-lessons.sh`
#     and `check-futureproof-e2e.sh` both now pass outright — 37/37 and 10/10
#     respectively — confirming the first failure was that measurement
#     artifact, not a defect. This run failed differently: 1 of 204 checks,
#     `check-reconcile`'s `old-unbaselined provocation did not fire` self-test,
#     whose outcome depends on the live population of worktrees on the host
#     `make verify` runs on. Re-running `check-reconcile.sh` alone minutes
#     later, on the identical tree, still failed but named a DIFFERENT set of
#     "young" worktrees — proving the condition is driven by concurrent,
#     unrelated lanes creating/removing worktrees on a shared host, not by
#     anything committed to `master`.)
#
# The repo owner (kushin77) reviewed both runs and explicitly accepted
# `check-reconcile`'s host-worktree-churn provocation as a known straggler —
# the same category as PR #1153's unrelated known-red item — rather than
# blocking this control on a full `make verify` this host cannot currently
# produce. `scripts/gate-status.sh` has no field for recording that acceptance
# on the posted commit status itself (the rc -> state mapping is intentionally
# rigid and un-annotatable, by design — ADR-0028/`gate-status-map.py`); this
# paragraph is that record instead.
#
# `required_status_checks` IS `null` — declared, not drifted
#
# Everything above is HISTORY, and its CONCLUSION is superseded. It argued that
# a `null` here was "a host-local straggler rather than a code defect", so the
# field should be filled in. That reasoning predates the owner-adopted
# **single-developer method (2026-09-21)**, which says the opposite in three
# placed documents:
#
#   AGENTS.md:75                "Single-developer method (owner, 2026-09-21): no
#                               required status check and no reviewer approval
#                               on `master`"
#   docs/GOVERNANCE.md:129      "`master` carries no required status check."
#   docs/EXECUTION-PLAN.md:210  "no required status check and no reviewer
#                               requirement; a PR lands with ..."
#
# The live repository already reflects the method: measured 2026-09-21,
# `gh api repos/kushin77/agent-orchestrator/branches/master/protection` returns
# `required_status_checks = None`. This file was the side that disagreed with
# the method AND with live, and that single field was the last box-wide
# `make verify` red on this host — it refused every lane's `make land`
# (issue #1815).
#
# POSTED IS NOT REQUIRED, and nothing about the gate of record is retired here:
# `required_status_contexts` below still names `ao/gate-of-record`, ADR-0028's
# poster (`scripts/gate-status.sh post`) still publishes it, and
# `scripts/check-gate-status.sh`'s producer rule still insists that every
# context this file declares has a producer on the path that evaluates a pull
# request. What changes is that an absent or slow poster can no longer BLOCK a
# merge: the gate of record stays the evidence of record (`make verify`,
# `AGENTS.md` rule 7), not a platform precondition for landing.
#
# The field is DECLARED as `null` rather than omitted, so the comparator still
# owns it and cannot silently hide a live change to it:
# `branch-protection-compare.py` normalizes `required_status_checks` to just
# `{strict, contexts}` (dropping GitHub's server-generated `url`,
# `contexts_url` and `checks`, which are not this repo's to declare) and
# compares `null` against `null` as a MATCH — and a live status-checks object
# against this `null` declaration as drift.
#
#   required_pull_request_reviews: null
#     Requiring a human review would break the autonomous-merge doctrine
#     (`AGENTS.md` rule 10): in this fleet verification replaces the reviewer, and
#     an agent merges its own PR only after green evidence. Encoding the opposite
#     here would make the declared policy contradict the operating model.
#
# So this policy encodes the protection that is both correct TODAY and
# consistent with the doctrine: history is linear, force-pushes and deletions are
# refused, and the default branch cannot be removed.

schema: ao.branch-protection/v1
repo: kushin77/agent-orchestrator
branch: master

# Exactly the fields the GitHub protection API returns, so `verify` can diff the
# declared state against the live state without a translation layer inventing
# differences of its own.
protection:
  required_linear_history: true
  allow_force_pushes: false
  allow_deletions: false
  # Not enforced on admins: the operator must remain able to intervene on a
  # wedged fleet (the documented operator role), and `enforce_admins: true` would
  # remove the only override point the operating model names.
  enforce_admins: false
  required_signatures: false
  # No required status check: the owner-adopted single-developer method
  # (2026-09-21) — rationale above, and issue #1815. The context is still
  # POSTED (`required_status_contexts` below); it is simply not REQUIRED.
  required_status_checks: null
  required_pull_request_reviews: null
  restrictions: null
  required_conversation_resolution: false
  lock_branch: false
  block_creations: false

# ADR-0028 — the status context the gate of record PUBLISHES. Nothing above
# REQUIRES it: `protection.required_status_checks` is `null` under the
# owner-adopted single-developer method (2026-09-21), so this key declares what
# the poster writes, not a precondition for a merge.
#
# This key stays OUTSIDE `protection` on purpose: `protection` is what
# `scripts/branch-protection.sh apply` PUTs to GitHub, and this key is instead
# the single name `scripts/check-gate-status.sh` cross-checks against the
# poster's own declared context. Keeping the two declarations SEPARATE, rather
# than reading one out of the other, is what lets that check catch the two
# ever drifting into different strings — two names for one control is how a
# required check becomes permanently unsatisfiable (protection would wait for
# a context nothing ever writes).
required_status_contexts:
  - ao/gate-of-record

# CTO root principal — branch-protection bypass (kushin77/agent-orchestrator#1511).
#
# The root principal (declared as `cto` in the hub's
# catalog/topology/principals.yaml) holds the `push-lane-branches` right, which
# lets it bypass branch protection to push a lane branch directly. Declared here
# as intent, OUTSIDE `protection`: the branch-protection API object this repo
# declares has no `bypass_actors` field — that field belongs to the ruleset-based
# protection API, whose application is a separate deliberate step (exactly like
# `required_status_contexts` above, which `apply` also does not PUT). The
# `cto-root` team name matches the root principal's declared `github.team`.
bypass_actors:
  - cto-root
