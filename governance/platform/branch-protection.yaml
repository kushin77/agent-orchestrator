# Declared branch protection for the default branch — the platform-level
# enforcement of the gate of record (issue #803, P0-3; issue #6's promise).
#
# WHY THIS FILE EXISTS
# `AGENTS.md` said "`master` is protected by convention" and "Branch protection
# as code ships with issue #6". Measured 2026-09-15:
#     gh api repos/kushin77/agent-orchestrator/branches/master/protection
#     {"message":"Branch not protected", ..., "status":404}
# Neither was true. The gate of record (`make verify`, 128 checks, provably able
# to fail) was not required by the platform, and any process could push straight
# to the default branch. A rule that lives only in a doc is advisory; only a
# platform-enforced control is binding.
#
# The protection was then applied by an OPERATOR API call to close the exposure.
# That is itself a GR-5 breach — infrastructure is declared, never clicked — and
# it is not reproducible: a fork, a restore or a second repo diverges silently.
# This file is that declaration, and `scripts/branch-protection.sh` is the thing
# that makes it reproducible and keeps it honest.
#
# STATUS CHECKS — the #724 precondition, now DISCHARGED
# `required_status_checks` stayed `null` until the poster was observed posting
# a REAL status from the runner, never a hand-typed one. Requiring a context
# before anything writes it is the #724 defect (an inert control whose own gate
# could not see that it was inert), and here it would have been worse: it would
# have blocked every merge in the repository instead of merely doing nothing.
#
# That precondition is now met. `scripts/gate-status.sh post` published the
# gate's outcome for two commits in turn, both ancestors of `master`, both via
# ADR-0028's code-native poster (no Actions):
#
#   0dbb0e6819979e329b615292adaa74ceecded5ee -> ao/gate-of-record: failure
#     (`make verify`: 1 of 203 checks failed — `check-futureproof-e2e`, because
#     the `shell-patterns` and `lessons` gates read BLIND/CANNOT-ASSESS against
#     the disposable `git worktree add --detach` scratch checkout used to run
#     that verify. That checkout was later found to have been silently pruned
#     mid-run by this host's own worktree tooling, which is consistent with a
#     measurement artifact rather than a real defect.)
#
#   83ff32dbcf40fe42c4ccbdcb3a41e5b4a48944f6 -> ao/gate-of-record: failure
#     (`make verify` re-run on a CLEAN, non-scratch worktree: `check-lessons.sh`
#     and `check-futureproof-e2e.sh` both now pass outright — 37/37 and 10/10
#     respectively — confirming the first failure was that measurement
#     artifact, not a defect. This run failed differently: 1 of 204 checks,
#     `check-reconcile`'s `old-unbaselined provocation did not fire` self-test,
#     whose outcome depends on the live population of worktrees on the host
#     `make verify` runs on. Re-running `check-reconcile.sh` alone minutes
#     later, on the identical tree, still failed but named a DIFFERENT set of
#     "young" worktrees — proving the condition is driven by concurrent,
#     unrelated lanes creating/removing worktrees on a shared host, not by
#     anything committed to `master`.)
#
# The repo owner (kushin77) reviewed both runs and explicitly accepted
# `check-reconcile`'s host-worktree-churn provocation as a known straggler —
# the same category as PR #1153's unrelated known-red item — rather than
# blocking this control on a full `make verify` this host cannot currently
# produce. `scripts/gate-status.sh` has no field for recording that acceptance
# on the posted commit status itself (the rc -> state mapping is intentionally
# rigid and un-annotatable, by design — ADR-0028/`gate-status-map.py`); this
# paragraph is that record instead.
#
# THIS DECLARATION is written with `required_status_checks` filled in because
# the precondition (a real status, correctly observed, twice) is met, the
# shape is provable end to end, and the one remaining red item is an accepted,
# host-local straggler rather than a code defect. `required_status_checks`
# applies to each PR's OWN head SHA once protection is applied (not
# retroactively to whatever is posted on `master`'s tip at apply time), so
# accepting today's straggler here does not exempt any future PR from posting
# its own green `ao/gate-of-record` before it can merge.
#
#   strict: false
#     No CI produces a required check on every push, so `strict: true` would
#     force every PR to rebase onto master's latest tip AND get a freshly
#     posted status each time master moves — with a human/agent poster instead
#     of Actions, that wedges the repo within a day. `strict: false` requires
#     the context to be green on the PR's own head SHA, which is the control
#     this epic exists to add, without inventing a rebase treadmill nothing here
#     can keep up with.
#
#   contexts: [ao/gate-of-record]
#     The one context ADR-0028 defines, and the one name `required_status_contexts`
#     below also names — `scripts/check-gate-status.sh` asserts those two
#     declarations never drift into two different strings. `branch-protection-
#     compare.py` normalizes this field to just {strict, contexts} before
#     comparing, since GitHub's live response also carries server-generated
#     fields (`url`, `contexts_url`, `checks`) that are not this repo's to
#     declare and must not manufacture false drift.
#
#   required_pull_request_reviews: null
#     Requiring a human review would break the autonomous-merge doctrine
#     (`AGENTS.md` rule 10): in this fleet verification replaces the reviewer, and
#     an agent merges its own PR only after green evidence. Encoding the opposite
#     here would make the declared policy contradict the operating model.
#
# So this policy encodes the protection that is both correct TODAY and
# consistent with the doctrine: history is linear, force-pushes and deletions are
# refused, and the default branch cannot be removed.

schema: ao.branch-protection/v1
repo: kushin77/agent-orchestrator
branch: master

# Exactly the fields the GitHub protection API returns, so `verify` can diff the
# declared state against the live state without a translation layer inventing
# differences of its own.
protection:
  required_linear_history: true
  allow_force_pushes: false
  allow_deletions: false
  # Not enforced on admins: the operator must remain able to intervene on a
  # wedged fleet (the documented operator role), and `enforce_admins: true` would
  # remove the only override point the operating model names.
  enforce_admins: false
  required_signatures: false
  required_status_checks:
    strict: false
    contexts:
      - ao/gate-of-record
  required_pull_request_reviews: null
  restrictions: null
  required_conversation_resolution: false
  lock_branch: false
  block_creations: false

# ADR-0028 — the status context the gate of record publishes, and which
# `protection.required_status_checks` above now requires.
#
# This key stays OUTSIDE `protection` on purpose: `protection` is what
# `scripts/branch-protection.sh apply` PUTs to GitHub, and this key is instead
# the single name `scripts/check-gate-status.sh` cross-checks against the
# poster's own declared context. Keeping the two declarations SEPARATE, rather
# than reading one out of the other, is what lets that check catch the two
# ever drifting into different strings — two names for one control is how a
# required check becomes permanently unsatisfiable (protection would wait for
# a context nothing ever writes).
required_status_contexts:
  - ao/gate-of-record

# CTO root principal — branch-protection bypass (kushin77/agent-orchestrator#1511).
#
# The root principal (declared as `cto` in the hub's
# catalog/topology/principals.yaml) holds the `push-lane-branches` right, which
# lets it bypass branch protection to push a lane branch directly. Declared here
# as intent, OUTSIDE `protection`: the branch-protection API object this repo
# declares has no `bypass_actors` field — that field belongs to the ruleset-based
# protection API, whose application is a separate deliberate step (exactly like
# `required_status_contexts` above, which `apply` also does not PUT). The
# `cto-root` team name matches the root principal's declared `github.team`.
bypass_actors:
  - cto-root
# ---- merge identity — the ONE principal that may put a commit on `master` ----
# (kushin77/agent-orchestrator#1276)
#
# THE DEFECT THIS DECLARES AWAY. Everything above is about what may happen to
# `master`'s HISTORY (no force-push, no deletion, a required status check). None
# of it says WHO may merge into it, and the measured answer on 2026-09-20 was:
# anybody with a token. Eleven DIRECT merges landed in 36 hours from Claude and
# DeepSeek sessions alike, each carrying the owner's own token, while the
# doctrine said "use the queue" and `scripts/merge-pr.sh`'s own header admitted
# it could not stop a deliberate bypass. A rule whose enforcement is who was
# told what is advice (GR-29).
#
# WHAT IS DECLARED. One principal — a GitHub App / machine user, `ao-merge-queue`
# — holds `merge-to-master`. Every other principal is refused: an agent runtime's
# token carries `contents: write` on BRANCHES and `pull_requests: write`, and
# never merge authority on `master`. The single exception is the named
# break-glass actor, and its use is time-boxed, logged and paged.
#
# WHAT IS NOT DECLARED HERE, AND WHY. `protection` above is what
# `scripts/branch-protection.sh apply` PUTs to GitHub's branch-protection API,
# and that API object has no field naming a merge principal — the restriction
# lives in the RULESET API (org-level `bypass_actors` + repo ruleset), whose
# application needs org admin and is a deliberate operator step, exactly like
# `required_status_contexts` and `bypass_actors` above. So this block is the
# DECLARATION (what the platform state must be), and the half that can be
# MEASURED offline — which code paths can invoke a merge, and whether every
# break-glass use left a record — is enforced by
# `scripts/check-merge-identity.sh` (auto-discovered by `scripts/verify.sh`).
# The platform half of that gate is CANNOT-ASSESS until a reading of the live
# ruleset is supplied; the operator step is printed by the gate and recorded in
# the landing PR's body. Never a pass for a read that did not happen (#739).
merge_identity:
  schema: ao.merge-identity/v1
  principal: ao-merge-queue
  principal_kind: github-app
  rights:
    - merge-to-master
    - push-to-master
  # The queue identity's CODE SURFACE: the paths that invoke a merge, and
  # therefore the only paths that may run as that principal. This list is not
  # documentation — `scripts/check-merge-identity.sh` asserts it EQUALS the set
  # of files its scanner detects invoking a merge, in BOTH directions:
  #   * an invocation in a file that is not listed => refused by name
  #     (`merge-invocation-outside-queue-identity:<file>:<line>`);
  #   * a listed path the scanner cannot find an invocation in => refused by
  #     name (`merge-path-declared-without-invocation:<file>`).
  # So the surface cannot quietly grow (a new merge path is red until it is
  # declared) and cannot quietly rot (a stale entry is red too).
  merge_paths:
    - scripts/pr-queue.sh
    - scripts/merge-pr.sh
    - governance/landing/ports.py
    - governance/lifecycle/cli.py
  # Files that CARRY a merge verb without being a merge path: the guards that
  # test the transports, the prose in code, the declarations that name the verb.
  # Listing them is the reviewed answer to "is this file a merge path?"; the
  # point of the list is that a NEW file carrying the verb is refused by name
  # (`merge-surface-undeclared:<file>`) until somebody answers that question in
  # a review, rather than landing invisibly.
  verb_only_paths:
    - Makefile
    - fleet/runner/model.py
    - fleet/runner/tests/test_plan.py
    - fleet/runner/tests/test_transports.py
    - fleet/tests/test_terminal.py
    - governance/isolation/landed-baseline.json
    - governance/isolation/tests/test_squash_message.py
    - governance/landing/cli.py
    - governance/landing/engine.py
    - governance/landing/tests/test_cli_write_master_attestation.py
    - governance/lane-record/tests/test_lane_record.py
    - governance/lifecycle/tests/test_squash_message_gate.py
    - governance/platform/repo-settings.yaml
    - governance/spawn/render.py
    - scripts/check-landing.sh
    - scripts/check-lane-record.sh
    - scripts/check-merge-guard.sh
    - scripts/check-pr-contract.sh
    - scripts/check-pr-queue-squash-guard.sh
    - scripts/check-pr-runner.sh
    - scripts/check-squash-message.sh
    - scripts/lib/gh-bounded.sh
    # The gate itself: it has to NAME the transports (its detector regexes, its
    # header, and the self-test's planted fixtures — a plant that did not contain
    # the real verb would provoke nothing, so the verb appears verbatim in this
    # file). The entry is NOT an exemption: arm 3 still refuses a real
    # INVOCATION found in this file, because it is not a merge path, so listing
    # it here cannot hide one.
    - scripts/check-merge-identity.sh
  # The only other principal, and the conditions on it: a time-box, a record,
  # and a page to the owner who acknowledges it.
  break_glass:
    actor: cto-root
    actor_kind: team
    rights:
      - merge-to-master
    max_window_minutes: 120
    audit_record:
      # The record's shape (JSON Schema), the validator that enforces it
      # (stdlib-only, and it refuses a schema keyword it cannot enforce rather
      # than under-enforcing it silently), the append-only journal of USES, and
      # the directory of records. A use with no record is refused by name
      # (`break-glass-use-without-audit-record:<id>`); so is a record that is
      # malformed, attributed to a principal this declaration does not name, or
      # outside `max_window_minutes`.
      schema: governance/platform/break-glass/schema/record.schema.json
      validator: governance/platform/break-glass/validate.py
      journal: governance/platform/break-glass/uses.json
      records_dir: governance/platform/break-glass/records
    paging:
      # What counts as "the owner was paged": the record must name the channel
      # the page went to and the owner who acknowledged it. The requirement is
      # declared here; the transport is the operator's, and the record is the
      # evidence that it happened.
      requires_channel: true
      requires_owner_ack: true