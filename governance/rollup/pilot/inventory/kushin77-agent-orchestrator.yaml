# Fleet inventory — kushin77/agent-orchestrator (pilot, issue #151).
#
# One repo's fleet facts for one window. Four SMEs are declared, three of them
# re-declared in sibling repos (security-sme also runs in kushin77/CMR, qa-sme
# in kushin77/shared-frontend and kushin77/leaderboard, platform-sme in
# kushin77/leaderboard): their rolled-up identity is `repo#id`, so one repo's
# spend can never hide inside another's total.
#
# `platform-sme` sits exactly ON its ceiling. That is deliberately the pilot's
# at-ceiling case: it is within budget, produces no over-ceiling finding, and is
# still surfaced as at-ceiling telemetry.
