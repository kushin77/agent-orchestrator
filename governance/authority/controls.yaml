  # --------------------------------------------------------------------- #
  # Cannot-assess: an unreadable matrix is never a pass                    #
  # --------------------------------------------------------------------- #
  - id: unparseable-yaml-cannot-assess
    kind: load
    expect: CANNOT-ASSESS
    raw: |
      version: 1
      principals: [
  - id: non-mapping-root-cannot-assess
    kind: load
    expect: CANNOT-ASSESS
    raw: |
      - version
      - principals
  - id: missing-matrix-file-cannot-assess
    kind: load
    expect: CANNOT-ASSESS
    missing: true
