# Declared behavioral controls for the authority model (issue #150).
#
# A guard that ships no negative control proves nothing, and a control that
# cannot fail is a formality (AO-GR-19, no-false-green). `cli.py selfcheck` runs
# every control below against the LIVE engine and compares the verdict it got
# with the verdict the control declares; one mismatch fails the gate. Weakening
# the scoping rule, the separation-of-duties rule or the closure rule therefore
# turns the authority gate red instead of silently passing.
#
# Kinds:
#   can-act    principal/repo/action      expect ALLOW | DENY | CANNOT-ASSESS
#   sod        work_item                  expect ALLOW | DENY | CANNOT-ASSESS
#   closure    work_item                  expect ALLOW | DENY | CANNOT-ASSESS
#   validate   (matrix + overlay)          expect OK | NOT-OK | CANNOT-ASSESS
#   load       (raw text / missing path)   expect OK | NOT-OK | CANNOT-ASSESS
#   isolation  (two-repo scenario)         expect OK | NOT-OK | CANNOT-ASSESS
#
# `overlay` mutates a DEEP COPY of the shipped matrix in memory only — nothing
# is ever written back, so a control can assert a verdict for a document the
# repo would never ship (a second cross-repo principal, a SoD collision, an
# evidence field that is present but empty). The two evidence records in the
# closure controls are SYNTHETIC fixtures: they exist to prove the closure rule
# fires in both directions, and the shipped matrix deliberately carries no
# evidence at all.
version: 1

controls:
  # --------------------------------------------------------------------- #
  # Scoping: a fleet acts on its own repo, and only its own repo           #
  # --------------------------------------------------------------------- #
  - id: ao-own-repo-files-allowed
    kind: can-act
    principal: ao-soldier-1
