  # --------------------------------------------------------------------- #
  # Document validity: a real defect is NOT-OK, never a silent pass        #
  # --------------------------------------------------------------------- #
  - id: second-cross-repo-principal-is-a-validation-failure
    kind: validate
    expect: NOT-OK
    overlay:
      principals:
        - id: cu-fleet
          cross_repo: true
  - id: cross-repo-principal-that-is-not-the-enterprise-controller-fails-validation
    kind: validate
    expect: NOT-OK
    overlay:
      principals:
        - id: enterprise-controller
          kind: repo-fleet
  - id: fleet-scoped-to-two-repos-fails-validation
    kind: validate
    expect: NOT-OK
    overlay:
      principals:
        - id: ao-fleet
          scope: [kushin77/agent-orchestrator, kushin77/capital-underwriting]
  - id: rollup-right-on-a-scoped-fleet-fails-validation
    kind: validate
    expect: NOT-OK
    overlay:
      principals:
        - id: ao-fleet
          admin_rights: [files, issues, state, merge, rollup]
  - id: merge-authority-outside-the-commander-fails-validation
    kind: validate
    expect: NOT-OK
    overlay:
      principals:
        - id: ao-fleet
          actors:
            - id: ao-soldier-1
              merge_authority: true
  - id: auditor-role-with-executor-posture-fails-validation
    kind: validate
    expect: NOT-OK
    overlay:
      principals:
