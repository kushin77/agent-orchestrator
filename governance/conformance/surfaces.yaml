# Per-surface target solution-class policy (issue #351).
#
# The issue-class gate (`policy.yaml`, issue #140) holds a piece of *work* to a
# rung of the CMR quality ladder (`kushin77/CMR docs/SOLUTION-CLASSES.md`,
# referenced by AO ADR-0010). This file is the surface counterpart: every
# product surface declares the rung it is held to, and the gate fails while the
# surface sits below that declaration.
#
#     template -> class -> pattern -> enterprise -> faang -> elite
#
# The ladder vocabulary is closed and identical to `governance/conformance/
# model.py` (the suites assert this, so the two gates cannot drift apart).
#
# Calibration (measured 2026-09-14 against this tree, issue #351): each
# surface's `declared_class` is the highest rung whose machine evidence the tree
# actually shows. A surface is never declared above its evidence — raising one
# fails the gate, which is the whole point. A class requirement that cannot be
# machine-checked carries `kind: manual` and is REPORTED on every run, never
# silently treated as met (honesty over false-green).

schema: cmr.surface-class/policy-v1

ladder:
  - template
  - class
  - pattern
  - enterprise
  - faang
  - elite

# What a rung can require. `machine` evidence is measured against the tree by
# `surfaces.py`; `manual` evidence cannot be machine-checked and is reported.
evidence:
  contract:
    kind: machine
    description: >-
      the surface declares its contract in a README.md under its path
  tests:
    kind: machine
    description: >-
      the surface ships a test suite: a conftest.py or a test_*.py under its path
  controls:
    kind: machine
    description: >-
      the surface ships a real control/policy artifact: a file whose name
      carries a control / controls / policy / policies / guard / limit / quota /
      killswitch / ratelimit / backpressure / parity token
  audit:
    kind: machine
    description: >-
      the surface ships an audit trail outside its tests: an audit / auditlog /
      audit_event / event_log / attestation / ledger / journal module or schema
  schema:
    kind: machine
    description: >-
      the surface declares a shared schema: a *.schema.json under its path
      (outside its tests)
  gate:
    kind: machine
    description: >-
      the surface has a dedicated gate in scripts/: a scripts/check-* whose file
      name carries the surface name
  live_sync:
    kind: machine
    description: >-
      the surface serves or consumes live state: a live / feed / sync module
      under its path (outside its tests)
  rollback:
    kind: manual
    description: >-
      a documented rollout + rollback procedure for the surface (CMR
      "enterprise": rollout and rollback). Not machine-checkable here, so it is
      reported on every run rather than assumed.

# Requirements per rung. Cumulative by construction: each rung repeats every
# lower rung's requirement and adds its own (a policy that breaks the superset
# chain is rejected as invalid).
requirements:
  template: []
  class:
    - tests
  pattern:
    - tests
    - contract
  enterprise:
    - tests
    - contract
    - controls
    - audit
    - schema
    - rollback
  faang:
    - tests
    - contract
    - controls
    - audit
    - schema
    - rollback
    - gate
  elite:
    - tests
    - contract
    - controls
    - audit
    - schema
    - rollback
    - gate
    - live_sync

# Top-level directories that are product surfaces. Each that exists must have at
# least one declared surface at or under it, or be waived here by name with a
# reason. No surface root goes unclassified by omission.
surface_roots:
  - portal
  - gateway
  - telemetry
  - registry
  # Widened by issue #590. These two roots were previously out of scope, so the
  # surfaces this program ships under them were held to NO class at all: the
  # class gate never looked at them and reported OK while they sat at `pattern`.
  # A root is covered by any declared surface path at or below it.
  - governance
  - integrations
waived_roots: []

# The declared surfaces. `declared_class` is measured, never aspirational.
surfaces:
  - surface: shell
    path: portal/static
    declared_class: template
    notes: >-
      The console *client* shell this repo hosts: the framed shell view, the
      console JS, the views and the design tokens it renders. Held at
      `template` because it is a static asset bundle with no README and no test
      suite of its own — its assets are exercised by portal/tests, which is
      outside this path. The full OS shell is kushin77/shared-frontend's
      `shell/` and is out of this repo's scope.
  - surface: portal
    path: portal
    declared_class: pattern
    notes: >-
      The admin/tenant control-plane console (server + static + catalog +
      tests). Contract, tests, real controls, an audit chain and a live feed are
      present; it declares no shared schema of its own (its controls are
      validated by the guardrails control schema), and that missing owned schema
      is what holds it at `pattern`.
  - surface: gateway
    path: gateway
    declared_class: faang
    notes: >-
      Model gateways: contract, per-package suites, real controls (health
      policy, limits, budgets), an MCP audit trail + schema, and the
      check-gateway-catalog-parity.sh gate. No live-sync module, so it stops
      short of `elite`.
  - surface: telemetry
    path: telemetry
    declared_class: enterprise
    notes: >-
      Observability / FinOps: contract, four suites, real controls (budget
      policies + kill-switch), an audit trail and the ledger's
      audit_event.schema.json. It has no dedicated scripts/check-*telemetry*
      gate, which is what stops it at `enterprise`.
  - surface: registry
    path: registry
    declared_class: faang
    notes: >-
      Agent registry: contract, six suites, owned schemas, an append-only event
      log + pack attestation (audit), the drift control (parity/parity.py) and
      the check-registry-parity.sh gate. No live-sync module, so it stops short
      of `elite`.
  - surface: module-registry
    path: governance/modules
    declared_class: faang
    notes: >-
      The ecosystem module registry (issue #445, hardened to its declared class
      by #591): one honest view of every module, assembled by reference from the
      hub catalog. Contract, a suite, an owned schema for the row shape
      (module-registry.schema.json), the declared acceptance policy
      (controls.yaml + policy.py, read by registry.py) and an append-only audit
      trail of every refusal and judged state. Its dedicated gate is
      scripts/check-module-registry.sh, which is what carries it past
      `enterprise` to `faang`; it has no live/sync module (its live pin probe is
      a CLI verb against a file, not a running sync surface), so `elite` — which
      requires `live_sync` — is not claimed. Declared at the rung its evidence
      measures, never above it.
  - surface: module-brief
    path: integrations/paperclip/reporting
    declared_class: faang
    notes: >-
      The paperclip reporting agent's module brief (issue #447, hardened to its
      declared class by #592): the per-module statement of what every repo must
      carry, at which pin, and whether it is current. Contract, a suite, an
      owned schema for the artifact (brief.schema.json), the declared
      claim-resolution policy (claim-policy.json + policy.py, read by
      composer.py so no literal rule remains on a refusal path) and an
      append-only audit trail of claim resolution. Its dedicated gate is
      scripts/check-module-brief.sh, which carries it past `enterprise` to
      `faang`; no live-sync module, so not `elite`. Live under
      integrations/paperclip/ deliberately — the canonical module (#448), never a
      second top-level module.
  # Widened by issue #620 (EPIC #616; measured 2026-09-14 against this tree).
  # #590 widened the *roots*; the git ecosystem itself still had no row, so the
  # gate never looked at `.github/**`, at `.gitmessage`, or at the four
  # `governance/` packages this repo's own rules are built on — held to NO class
  # at all while the table read green. Each declaration below is the rung that
  # surface's own evidence MEASURES (`make surface-class` re-derives it); none is
  # declared above its evidence, and a raise of one rung fails the gate by name.
  - surface: github
    path: .github
    declared_class: template
    notes: >-
      The repository's GitHub surface: the issue forms
      (.github/ISSUE_TEMPLATE/), the PR template
      (.github/PULL_REQUEST_TEMPLATE.md) and dependabot.yml. Its substantive
      gates are scripts/check-issue-template.sh and
      scripts/check-pr-contract.sh; the machine `gate` evidence matches on the
      surface NAME, so it also matches scripts/check-github-lifecycle.sh by
      substring — the measured rung does not depend on it. There is no test suite
      and no README.md under the path, and the ladder's `tests`/`contract`
      evidence is directory-shaped, so the measured rung is the base one.
  - surface: commit-contract
    path: .gitmessage
    declared_class: template
    notes: >-
      The commit-message contract (issue #5, content lane #623, bootstrap lane
      #624) parsed by scripts/check-pr-contract.sh. The path is a single file, so
      `tests` and `contract` — measured as artifacts *under* the path — cannot
      exist; the measured rung is the base one.
  - surface: dispatch
    path: governance/dispatch
    declared_class: pattern
    notes: >-
      Claim/order/dispatch governance (AGENTS.md rule 14, chronological
      dependency-gated selection): contract, a suite (governance/dispatch/tests)
      and its gate scripts/check-chronological-dispatch.sh. It owns no
      controls/audit/schema artifact, which is what holds it at `pattern`.
  - surface: isolation
    path: governance/isolation
    declared_class: pattern
    notes: >-
      Session identity and lane isolation (AGENTS.md rule 15, issue #263):
      contract, a suite, the gate scripts/check-session-isolation.sh and the
      audit module (audit.py) the instrumentation reads. It has `audit` but owns
      no `controls` or `schema` artifact, so it stops at `pattern`.
  - surface: lifecycle
    path: governance/lifecycle
    declared_class: pattern
    notes: >-
      End-to-end closure (AGENTS.md rule 16, issue #269): contract, a suite, the
      gate scripts/check-github-lifecycle.sh and audit.py. `controls` and a
      `*.schema.json` are absent, so the measured rung is `pattern`.
  - surface: reconcile
    path: governance/reconcile
    declared_class: pattern
    notes: >-
      Orphan reconciliation (AGENTS.md rule 17, issue #304): contract, a suite
      and the gate scripts/check-reconcile.sh. It owns no audit/control/schema
      artifact, so the measured rung is `pattern`.
  - surface: hermes-integration
    path: integrations/hermes
    declared_class: faang
    notes: >-
      The hermes peer-integration surface (issue #942): the thin, read-only
      projection of hermes's declared orchestration surface (the persona card,
      the profile seed, the FinOps tier table and the gateway catalog row) into
      one canonical document, bound to the hermes-agents routing service and
      naming the gateway's Ollama namesake (gateway/providers/hermes.py) as
      excluded (ADR-0012). Mirrors the paperclip/reporting `faang` evidence
      set: a contract (README.md), a test suite with a negative control, the
      mapped tiering policy (policy.py), the cross-source consistency audit
      (audit.py), the capability-registry schema (capabilities.schema.json) and
      the dedicated gate scripts/check-hermes-integration.sh. No live-sync
      module, so not `elite` — declared at the rung its evidence measures,
      never above it.
