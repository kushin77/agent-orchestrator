# Per-surface target solution-class policy (issue #351).
#
# The issue-class gate (`policy.yaml`, issue #140) holds a piece of *work* to a
# rung of the CMR quality ladder (`kushin77/CMR docs/SOLUTION-CLASSES.md`,
# referenced by AO ADR-0010). This file is the surface counterpart: every
# product surface declares the rung it is held to, and the gate fails while the
# surface sits below that declaration.
#
#     template -> class -> pattern -> enterprise -> faang -> elite
#
# The ladder vocabulary is closed and identical to `governance/conformance/
# model.py` (the suites assert this, so the two gates cannot drift apart).
#
# Calibration (measured 2026-09-14 against this tree, issue #351): each
# surface's `declared_class` is the highest rung whose machine evidence the tree
# actually shows. A surface is never declared above its evidence — raising one
# fails the gate, which is the whole point. A class requirement that cannot be
# machine-checked carries `kind: manual` and is REPORTED on every run, never
# silently treated as met (honesty over false-green).

schema: cmr.surface-class/policy-v1

ladder:
  - template
  - class
  - pattern
  - enterprise
  - faang
  - elite

# What a rung can require. `machine` evidence is measured against the tree by
# `surfaces.py`; `manual` evidence cannot be machine-checked and is reported.
evidence:
  contract:
    kind: machine
    description: >-
      the surface declares its contract in a README.md under its path
  tests:
    kind: machine
    description: >-
      the surface ships a test suite: a conftest.py or a test_*.py under its path
  controls:
    kind: machine
    description: >-
      the surface ships a real control/policy artifact: a file whose name
      carries a control / controls / policy / policies / guard / limit / quota /
      killswitch / ratelimit / backpressure / parity token
  audit:
    kind: machine
    description: >-
      the surface ships an audit trail outside its tests: an audit / auditlog /
      audit_event / event_log / attestation / ledger / journal module or schema
  schema:
    kind: machine
    description: >-
      the surface declares a shared schema: a *.schema.json under its path
      (outside its tests)
  gate:
    kind: machine
    description: >-
      the surface has a dedicated gate in scripts/: a scripts/check-* whose file
      name carries the surface name
  live_sync:
    kind: machine
    description: >-
      the surface serves or consumes live state: a live / feed / sync module
      under its path (outside its tests)
  rollback:
    kind: manual
    description: >-
      a documented rollout + rollback procedure for the surface (CMR
      "enterprise": rollout and rollback). Not machine-checkable here, so it is
      reported on every run rather than assumed.

# Requirements per rung. Cumulative by construction: each rung repeats every
# lower rung's requirement and adds its own (a policy that breaks the superset
# chain is rejected as invalid).
requirements:
  template: []
  class:
    - tests
  pattern:
    - tests
    - contract
  enterprise:
    - tests
    - contract
    - controls
    - audit
    - schema
    - rollback
  faang:
    - tests
    - contract
    - controls
    - audit
    - schema
    - rollback
    - gate
  elite:
    - tests
    - contract
    - controls
    - audit
    - schema
    - rollback
    - gate
    - live_sync

# Top-level directories that are product surfaces. Each that exists must have at
# least one declared surface at or under it, or be waived here by name with a
# reason. No surface root goes unclassified by omission.
#
# Since issue #1256 this list is no longer the gate's HORIZON. It was for #590,
# and it failed the same way twice: a root that is not ON the list is inspected
# by nothing, and `make surface-class` prints OK because it is not looking. That
# is how `engine`, `guardrails`, `identity`, `control-plane` and `fleet` — five
# roots carrying ~750 tracked files between them — came to be held to NO class
# at all. The checker now derives the root set from the tree (`observed_roots`:
# the roots the repository itself tracks) and refuses by name
# (`surface-root-unrecorded`) any top-level root that is neither declared at or
# under it nor waived below. Adding a top-level root to this repository is
# therefore a decision the gate makes you record, not something it tolerates in
# silence.
#
# The list is still load-bearing in the narrower direction: a root named here,
# that exists, and that no declared surface covers is `surface-undeclared`. Keep
# the two in step — declare the surface, then name its root here.
surface_roots:
  - portal
  - gateway
  - telemetry
  - registry
  # Widened by issue #590. These two roots were previously out of scope, so the
  # surfaces this program ships under them were held to NO class at all: the
  # class gate never looked at them and reported OK while they sat at `pattern`.
  # A root is covered by any declared surface path at or below it.
  - governance
  - integrations
  # Widened by issue #1256. The five module roots the rows below now declare.
  # Nothing here is aspirational: each is declared at the rung its own evidence
  # measures, and a declaration one rung above that fails the gate by name.
  - engine
  - guardrails
  - identity
  - control-plane
  - fleet

# Roots that are deliberately NOT product surfaces. A waiver is a RECORDED
# decision, never an omission: the value IS the reason, the checker refuses a
# waiver that carries none (a bare name would be another list with no way to
# fail), and each waiver is honoured only for the root it names — a new root
# still has to be declared or waived on its own.
waived_roots:
  config: >-
    Declarative job data for this repo's own tooling (config/fleet-jobs.json),
    read by the fleet cron and the runbook. It is INPUT to other surfaces'
    gates, not a product surface: it ships no contract, suite or control of its
    own.
  contrib: >-
    Contributor-supplied shared-service assets (contrib/shared-services). A
    drop-in asset, not a surface this repo builds, holds a contract for or
    gates.
  docs: >-
    The cross-cutting documentation tree. Docs are held to the doc gates
    (scripts/check-docs.sh and friends), which check that links, anchors and
    declarations resolve. The rungs of this ladder are measured from artifacts
    shipped UNDER a path (controls, audit, schema, a live-sync module); a prose
    tree carries none of them, so declaring it a product surface would make the
    ladder measure prose.
  e2e: >-
    The repository's end-to-end harness. Its artifacts ARE tests, and the
    ladder's `tests` evidence is measured under a product path with files under
    `tests/` deliberately excluded — so a root that is itself a test tree has no
    product artifact for the ladder to measure.
  infra: >-
    QUARANTINED BY NAME. This is the SAME defect as issue #1256, tracked
    separately by issue #944 ("infra/ is not a declared surface root"): it is
    the deploy surface (Terraform + Cloud Build declarations) and it should be
    DECLARED, not waived. The waiver is recorded here so the new sweep does not
    report a pre-existing, already-tracked gap as though this lane had found it.
    Remove this entry when #944 lands.
  scripts: >-
    This repository's own gate and tooling tree. Its `check-*` files are
    consumed as the `gate` evidence OF product surfaces (measure_gate reads
    scripts/check-*), and a root whose artifacts are other surfaces' evidence is
    not itself a product surface — the ladder would be measuring the ruler.
  vendor: >-
    The pinned CMR hub submodule (vendor/CMR; AGENTS.md forbids editing
    vendor/). Third-party, pinned by gitlink and verified by
    scripts/check-cmr-pin.sh, so it is neither this repo's product nor this
    repo's to assign a class to.
  catalog: >-
    Generated indexer output (catalog/indexer/index-graph.json,
    catalog/indexer/out/catalog.db), written by `scripts/*` running
    `--apply` (issue #1528). It ships no contract, suite or control of its
    own — it is a build artifact of the registry/indexer surface, not a
    product surface the ladder should measure.

# The declared surfaces. `declared_class` is measured, never aspirational.
#
# Class ceilings (issue #883, ADR-0031). A row whose *shape* cannot honestly
# reach the top rung — a static asset bundle, a single file — may carry
# `class_ceiling: <rung>` plus a mandatory `ceiling_reason`. The ceiling is
# REPORTED on every run (surface-class-ceiling), never silently waived; a
# declared class above it is refused (surface-above-class-ceiling), and a
# ceiling the evidence has already exceeded is refused as stale
# (surface-class-ceiling-stale). Rows with a ceiling are the NON-product rows:
# they are excluded from the product floor that module.json's `solution_class`
# is held to. The three ceilings below are proposed for the OWNER to confirm.
surfaces:
  - surface: shell
    path: portal/static
    declared_class: template
    class_ceiling: pattern
    ceiling_reason: >-
      A static asset bundle (HTML/JS/CSS/tokens): a README.md and a suite under
      the path are the most it can honestly carry. Controls, an audit trail, a
      schema and a live-sync .py module are server-side artifacts that belong
      to the `portal` row, not to its client assets. Owner to confirm.
    notes: >-
      The console *client* shell this repo hosts: the framed shell view, the
      console JS, the views and the design tokens it renders. Held at
      `template` because it is a static asset bundle with no README and no test
      suite of its own — its assets are exercised by portal/tests, which is
      outside this path. The full OS shell is kushin77/shared-frontend's
      `shell/` and is out of this repo's scope.
  - surface: portal
    path: portal
    declared_class: elite
    notes: >-
      The admin/tenant control-plane console (server + static + catalog +
      tests). Contract, tests, real controls, an audit chain and a shared
      schema (portal/schemas/fleet-board-row.schema.json) are present; the live
      feed module portal/server/livestore.py is the live_sync evidence that
      carries it past `pattern` to `elite`. Declared at the rung its evidence
      measures, never above it.
  - surface: gateway
    path: gateway
    declared_class: elite
    notes: >-
      Model gateways: contract, per-package suites, real controls (health
      policy, limits, budgets), an MCP audit trail + schema, and the
      check-gateway-catalog-parity.sh gate. gateway/sync/live.py is the
      live_sync module that carries it past `faang` to `elite`. Declared at the
      rung its evidence measures, never above it.
  - surface: telemetry
    path: telemetry
    declared_class: elite
    notes: >-
      Observability / FinOps: contract, four suites, real controls (budget
      policies + kill-switch), an audit trail and the ledger's
      audit_event.schema.json. scripts/check-telemetry.sh is the dedicated gate
      and telemetry/metering/feed.py is the live_sync module — together they
      carry it past `enterprise` to `elite`. Declared at the rung its evidence
      measures, never above it.
  - surface: registry
    path: registry
    declared_class: elite
    notes: >-
      Agent registry: contract, six suites, owned schemas, an append-only event
      log + pack attestation (audit), the drift control (parity/parity.py) and
      the check-registry-parity.sh gate. registry/sync/live.py is the
      live_sync module that carries it past `faang` to `elite`. Declared at the
      rung its evidence measures, never above it.
  - surface: module-registry
    path: governance/modules
    declared_class: elite
    notes: >-
      The ecosystem module registry (issue #445, hardened to its declared class
      by #591): one honest view of every module, assembled by reference from the
      hub catalog. Contract, a suite, an owned schema for the row shape
      (module-registry.schema.json), the declared acceptance policy
      (controls.yaml + policy.py, read by registry.py) and an append-only audit
      trail of every refusal and judged state. Its dedicated gate is
      scripts/check-module-registry.sh; governance/modules/sync/live.py is the
      live_sync module that carries it past `faang` to `elite`. Declared at the
      rung its evidence measures, never above it.
  - surface: module-brief
    path: integrations/paperclip/reporting
    declared_class: elite
    notes: >-
      The paperclip reporting agent's module brief (issue #447, hardened to its
      declared class by #592): the per-module statement of what every repo must
      carry, at which pin, and whether it is current. Contract, a suite, an
      owned schema for the artifact (brief.schema.json), the declared
      claim-resolution policy (claim-policy.json + policy.py, read by
      composer.py so no literal rule remains on a refusal path) and an
      append-only audit trail of claim resolution. Its dedicated gate is
      scripts/check-module-brief.sh;
      integrations/paperclip/reporting/sync/live.py is the live_sync module
      that carries it past `faang` to `elite`. Live under
      integrations/paperclip/ deliberately — the canonical module (#448), never a
      second top-level module. Declared at the rung its evidence measures,
      never above it.
  # Widened by issue #620 (EPIC #616; measured 2026-09-14 against this tree).
  # #590 widened the *roots*; the git ecosystem itself still had no row, so the
  # gate never looked at `.github/**`, at `.gitmessage`, or at the four
  # `governance/` packages this repo's own rules are built on — held to NO class
  # at all while the table read green. Each declaration below is the rung that
  # surface's own evidence MEASURES (`make surface-class` re-derives it); none is
  # declared above its evidence, and a raise of one rung fails the gate by name.
  - surface: github
    path: .github
    declared_class: template
    class_ceiling: pattern
    ceiling_reason: >-
      Repository metadata (issue forms, PR template, dependabot.yml): a
      README.md and a suite under the path are the most it can honestly carry.
      Its real gates live in scripts/ and the machine `gate` evidence already
      matches by name; controls, audit, schema and live-sync artifacts under
      .github would be decorative (no-false-green). Owner to confirm.
    notes: >-
      The repository's GitHub surface: the issue forms
      (.github/ISSUE_TEMPLATE/), the PR template
      (.github/PULL_REQUEST_TEMPLATE.md) and dependabot.yml. Its substantive
      gates are scripts/check-issue-template.sh and
      scripts/check-pr-contract.sh; the machine `gate` evidence matches on the
      surface NAME, so it also matches scripts/check-github-lifecycle.sh by
      substring — the measured rung does not depend on it. There is no test suite
      and no README.md under the path, and the ladder's `tests`/`contract`
      evidence is directory-shaped, so the measured rung is the base one.
  - surface: edge-cutover
    path: docs/EDGE-CUTOVER.md
    declared_class: template
    class_ceiling: template
    ceiling_reason: >-
      The path is a single file (issue #935/#731); every rung above `template`
      requires an artifact *under* the path, which a file cannot hold. The
      declaration is enforced by scripts/check-edge-cutover.sh instead. Owner
      to confirm.
    notes: >-
      The edge-fronting declaration for ai.purebliss.app: what fronts the
      hostname, the retired GCP edge route, and the residual boundary between
      this repo and the run half (docs/EDGE-CUTOVER.md). The path is a single
      file, so `tests` and `contract` — measured as artifacts *under* the
      path — cannot exist; the measured rung is the base one. Registered as a
      go-live surface by infra/feature-flags/registry.yaml
      surfaces.edge_cutover / infra/rollout/rollout-state.yaml /
      infra/rollout/go-live-plan.yaml (issue #935).
  - surface: commit-contract
    path: .gitmessage
    declared_class: template
    class_ceiling: template
    ceiling_reason: >-
      The path is a single file; every rung above `template` requires an
      artifact *under* the path, which a file cannot hold. The contract is
      enforced by scripts/check-pr-contract.sh instead. Owner to confirm.
    notes: >-
      The commit-message contract (issue #5, content lane #623, bootstrap lane
      #624) parsed by scripts/check-pr-contract.sh. The path is a single file, so
      `tests` and `contract` — measured as artifacts *under* the path — cannot
      exist; the measured rung is the base one.
  - surface: dispatch
    path: governance/dispatch
    declared_class: elite
    notes: >-
      Claim/order/dispatch governance (AGENTS.md rule 14, chronological
      dependency-gated selection, issue #885): contract, a suite
      (governance/dispatch/tests) and its gate
      scripts/check-chronological-dispatch.sh, plus the four artifacts landed
      by #1062 that carry it past `pattern` to `elite`: the declared
      acceptance policy `controls.yaml` + `policy.py` (read by
      `snapshot.py`'s `DEFAULT_STALENESS_MINUTES`), the append-only
      arbitration-outcome trail `audit.py` (written by `claims.arbitrate()`),
      the frozen record shapes `dispatch.schema.json` + `schema.py` (validated
      by `audit.append()` and `claims.py`'s `ClaimEvent.to_json()`), and the
      live projection `live.py` exposed through the existing verb as
      `status --live` (`cli.py:cmd_status`).
  - surface: isolation
    path: governance/isolation
    declared_class: elite
    notes: >-
      Session identity and lane isolation (AGENTS.md rule 15, issue #263,
      raised by #885): contract, a suite, the gate
      scripts/check-session-isolation.sh and the audit module (audit.py) the
      instrumentation reads, plus the four artifacts landed by #1066 that
      carry it past `pattern` to `elite`: the declared policy `controls.yaml`
      + `policy.py` (read at import time by `identity.py` and
      `speculative.py`, closing `violation.KNOWN_CODES`), the append-only
      audit-verdict trail `journal.py` (written by `cli.py cmd_audit`
      alongside `audit.py`'s in-memory verdict), the frozen record shapes
      `isolation.schema.json` + `schema.py` (validated with the stdlib-only
      subset validator `governance/modules/schema.py`), and the live
      projection `live.py` exposed through the existing `audit` verb's
      `--live` flag (`cli.py audit --live`).
  - surface: lifecycle
    path: governance/lifecycle
    declared_class: elite
    notes: >-
      End-to-end closure (AGENTS.md rule 16, issue #269, raised by #885):
      contract, a suite, the gate scripts/check-github-lifecycle.sh and
      audit.py, plus the four artifacts landed by #1065 that carry it past
      `pattern` to `elite`: the declared policy `controls.yaml` + `policy.py`
      (checked against `model.py`'s closed invariant vocabulary at import
      time, and read by `directive.py`'s `retire`), the decision ledger
      `ledger.py` (written to `.fleet/lifecycle/ledger.jsonl` by
      `directive.consume`/`directive.retire` and `cli.py cmd_close`), the
      frozen record shapes `lifecycle.schema.json` (validated by `ledger.py`
      via `governance/modules/schema.py`), and the live projection `live.py`
      exposed through the existing verb `cli.py status --live`.
  - surface: reconcile
    path: governance/reconcile
    declared_class: elite
    notes: >-
      Orphan reconciliation (AGENTS.md rule 17, issue #304, raised by #885):
      contract, a suite and the gate scripts/check-reconcile.sh, plus the four
      artifacts landed by #1064 that carry it past `pattern` to `elite`: the
      declared policy `controls.yaml` + `policy.py` (read by `sweep.py` for
      `sweep.max_actions_per_pass` and the closed `sweep.outcome_codes`
      vocabulary), the audit trail `ledger.py` (one record per sweep decision
      and per `real_tree_baseline.check_real_tree()` call, validated against
      `reconcile.schema.json` before it is written), the frozen record shapes
      `reconcile.schema.json` (also validated by `live.py`'s projected rows),
      and the live projection `live.py` exposed through the existing verb
      `status --live` (`cli.py cmd_status`).
  - surface: hermes-integration
    path: integrations/hermes
    declared_class: elite
    notes: >-
      The hermes peer-integration surface (issue #942): the thin, read-only
      projection of hermes's declared orchestration surface (the persona card,
      the profile seed, the FinOps tier table and the gateway catalog row) into
      one canonical document, bound to the hermes-agents routing service and
      naming the gateway's Ollama namesake (gateway/providers/hermes.py) as
      excluded (ADR-0012). Mirrors the paperclip/reporting `faang` evidence
      set: a contract (README.md), a test suite with a negative control, the
      mapped tiering policy (policy.py), the cross-source consistency audit
      (audit.py), the capability-registry schema (capabilities.schema.json) and
      the dedicated gate scripts/check-hermes-integration.sh;
      integrations/hermes/sync/live.py is the live_sync module that carries it
      past `faang` to `elite`. Declared at the rung its evidence measures,
      never above it.
  - surface: knowledge
    path: governance/knowledge
    declared_class: elite
    notes: >-
      The CMR knowledge base (governance/knowledge): contract (README.md), a
      test suite, the declared controls module
      (knowledge_controls.py), the audit trail (ledger.py), the shared schema
      (live-sync-event.schema.json), the dedicated gate
      scripts/check-cmr-knowledge.sh, and the live_sync module (live_sync.py)
      that together carry it to `elite`. Declared at the rung its evidence
      measures, never above it.
  - surface: tagging
    path: governance/tagging
    declared_class: elite
    notes: >-
      The tag authority (issue #1175): contract (README.md), a suite (tests/),
      the declared policy controls (controls.yaml + policy.py, read by cli.py's
      authority findings and held to the taxonomy, the rules and the declared
      limits), the append-only decision ledger (ledger.py, written to
      .fleet/tagging/ledger.jsonl and validated against tagging.schema.json
      BEFORE each write), the frozen record shapes (tagging.schema.json,
      validated through governance/modules/schema.py so no third-party
      validator is needed), the dedicated gate scripts/check-tagging.sh, and
      the live_sync module live.py (the read-only projection of the board's
      declared tags and the ledger, exposed through the existing
      `cli.py board --live` verb) that carries it past `faang` to `elite`.
      Declared at the rung its evidence measures, never above it.
  # Widened by issue #1256. Five module roots that `surface_roots` never named,
  # so the class gate never inspected them: each could regress a whole rung and
  # every gate stayed green. Every `declared_class` below is the rung its own
  # tree MEASURES today, read with the gate's own instrument — not a target, not
  # an aspiration. Three of the five are named architecture pillars in
  # docs/ARCHITECTURE.md (engine, guardrails, identity); the other two are the
  # declared cross-cutting modules. Raising any row by one rung fails
  # `make surface-class` by name, which is the point.
  - surface: engine
    path: engine
    declared_class: pattern
    notes: >-
      The state-machine execution pillar (EPIC-00 phase 3). Contract: a
      README.md at the root and one under each of conversation, core, loop,
      memory, multiagent and queue. Suite: engine/conversation/tests/. Real
      controls: engine/loop/policy.py and engine/queue/backpressure.py. It ships
      no audit trail, no owned schema, no dedicated scripts/check-* whose name
      carries "engine" and no live-sync module — so `pattern` is the rung the
      tree measures, and it is two rungs from the top.
  - surface: guardrails
    path: guardrails
    declared_class: faang
    notes: >-
      The security & guardrails pillar (EPIC-00 phase 4) and the strongest of
      the five. Contract: guardrails/README.md plus a README under each
      package. Suite: guardrails/chat/tests/. The declared controls:
      guardrails/policy/controls.yaml + controls.py, read by the policy package
      rather than carried decoratively. A real audit trail:
      guardrails/policy/audit.py, guardrails/controls/audit.py,
      guardrails/dlp/hmac_audit.py and guardrails/honesty/attestation.py. Owned
      schemas under guardrails/policy/schema/ and guardrails/sandbox/. A
      dedicated gate: scripts/check-chat-guardrails.sh. There is no live-sync
      module, so `faang` is the measured rung. This is one rung ABOVE the
      `enterprise` issue #1256's table estimated, and the delta is the issue's
      own: that table was read with `measure_path_evidence` alone, which does
      not include the `gate` evidence `measured_class` counts.
  - surface: identity
    path: identity
    declared_class: pattern
    notes: >-
      The tenant identity/RBAC pillar (EPIC-00 phase 6). Contract: a README.md
      at the root and one under each of chat, cpapi, edges, entitlements,
      onboarding, rbac and sso. Suite: identity/chat/tests/. The declared access
      control: identity/rbac/guard.py and identity/cpapi/control.py. A real
      audit trail: identity/cpapi/audit.py. It owns no schema, which is what
      holds it below `enterprise`; its name also matches
      scripts/check-agent-identity-parity.sh and scripts/check-chat-identity.sh,
      but the missing schema breaks the cumulative chain first, so the measured
      rung is `pattern`.
  - surface: control-plane
    path: control-plane
    declared_class: pattern
    notes: >-
      The control plane and its portal SDK (EPIC-00 phase 7). Contract: a
      README.md at the root and one under cli, cockpit, control, fleet-template,
      functions, instructions and sdk. Suite: control-plane/cli/tests/. Owned
      schemas: control-plane/control/schema/verbs.schema.json,
      control-plane/functions/schema/functions.schema.json and the four under
      control-plane/instructions/schema/. It ships no control artifact, no audit
      trail and no dedicated gate, so `pattern` is the measured rung.
  - surface: fleet
    path: fleet
    declared_class: pattern
    notes: >-
      The autonomous ops fleet (the declared cross-cutting module). Contract:
      fleet/README.md and fleet/CONTRACT.md. Suite: fleet/tests/. The declared
      controls: fleet/control.py, fleet/decompose_policy.py and
      fleet/profiles/routing.policy.json. Owned schemas:
      fleet/schema/health-signal.schema.json and fleet/schema/message.schema.json.
      A dedicated gate does exist — fourteen scripts/check-fleet-*.sh — but the
      ladder's `audit` evidence is absent, and the cumulative chain stops at
      `enterprise` before `gate` is ever reached, so the measured rung is
      `pattern`.
