# CMR class / pattern / template conformance policy (issue #140)
#
# The quality ladder every piece of repository work is classified against, and the
# metadata each class must declare for that claim to be credible.
#
# Calibration note: the `required` sets below were fixed against measured board
# state on 2026-09-13 (113 issues; 20 open + milestoned). All 20 milestoned issues
# already declare class/type/priority/area, so enforcing those is green today and
# binds new work. The `expectations` sets are partial in the existing board
# (pillar 10/20, gdc 15/20), so they are reported as deviations with remediation
# rather than failing the gate — enforcing a standard the current board violates
# would make the gate red for reasons no lane can fix by working its own issue.

schema: cmr.conformance/policy-v1

# The ladder, lowest rung first. A declared class must be one of these.
ladder:
  - template
  - class
  - pattern
  - enterprise
  - faang
  - elite

# Applies across every rung: infrastructure is declared, never clicked (GR-5);
# the flag it ships behind defaults ON since the policy-gr5-enabled-by-default
# reversal (#1789).
mandates:
  iac:
    id: iac
    description: >-
      Infrastructure is declared in Terraform or Cloud Build; new infrastructure
      ships behind a flag. A change that adds infrastructure without a flag or a
      declared posture does not conform at any class.
    infra_paths:
      - infra/
      - .github/workflows/
    required_marker: flag

# Classification metadata every in-scope issue must declare, at every rung.
required:
  - class
  - type
  - priority
  - area

# Per-rung additional expectations. Reported as deviations (warning) so they are
# visible and assignable without wedging the gate; escalated to errors by
# `--strict`, which is how a milestone that has caught up is meant to be checked.
expectations:
  enterprise:
    - gdc
  elite:
    - gdc
    - pillar

# Labels that carry a value in `name:value` form.
prefixed:
  - class
  - type
  - priority
  - area
  - pillar
  - gdc
  - phase
  - source
  # The tag authority's two dimensions (issue #1182). Declared here so the
  # filing seam recognises them as declaring labels and passes a filer's own
  # `posture:` / `lifecycle:` through rather than refusing them; the VALUES are
  # the tag authority's, never this file's (borrow, don't re-declare — AO-GR-28).
  - posture
  - lifecycle

# Filing (issue #320) — the declaring labels a NEWLY FILED issue derives from this
# policy, so the conformance gate stops being a repair queue. Every code path that
# files an issue derives its labels here (`governance/conformance/filing.py`) and
# passes them to `gh issue create`; a filing that cannot derive a required label is
# REFUSED before `gh` runs, rather than filed and rejected afterwards. #174 owns
# repairing the legacy issues that were filed unclassified (#253/#254/#255/#259);
# this block owns prevention.
#
# `default_class` is the rung an auto-filed micro-task is held to when its spec
# names none (the fleet's standard), and `defaults` are the companion labels a
# filing may leave unstated. Removing either turns the corresponding filing into a
# refusal instead of an unclassified issue — which is what `filing-check` exercises.
# Deriving a label is not the same as the repository HAVING it, so every label the
# defaults below derive is also resolved against the recorded inventory
# (`labels.json`): `gh issue create` refuses a label that does not exist, which
# makes a default naming one a broken production path that a derivation-only
# control cannot see (#1160).
filing:
  default_class: enterprise
  # The tag dimensions a filing must derive (issue #1182). `posture` and
  # `lifecycle` are the tag authority's delivery + SDLC dimensions (AO-GR-28,
  # governance/tagging/taxonomy.yaml); a filing is born with them so the board
  # stops accruing `required-missing` deviations the moment this lands. The
  # VALUES below are the authority's closed vocabularies, mirrored and proven
  # equal by scripts/check-tagging.sh's `filing-default-drift` refusal — a
  # default that names an illegal value fails the gate by name.
  #
  # `area` is the exception, and the reason this block carries a comment: the tag
  # authority declares it SLUG-SHAPED (`taxonomy.yaml`: kind `pattern`), so it has
  # no mintable vocabulary and its values can only come from the repository's live
  # label set. `governance` was never one of them (#1160), which made every
  # defaulted filing fail in production — `gh` refuses a label it does not have —
  # while the gate that owns this seam stayed green because it proved label
  # *derivation* and never label *existence*. `standards` is the area the policy's
  # own parenting issues carry (#140, which created this file, and #174), and it
  # is recorded in `labels.json` together with every other label these defaults
  # derive, so `filing-check` can refuse a default that names a label the
  # repository does not have.
  tags: [posture, lifecycle]
  defaults:
    type: feature
    priority: P2
    area: standards
    gdc: enterprise
    posture: overall
    lifecycle: build

# The rungs at which an issue must also cite the CMR standards it maps to. Kept
# informational: the offline board snapshot carries labels, not bodies.
standards_citation:
  - faang
  - elite
