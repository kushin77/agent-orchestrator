#   - kushin77/shared-governance GLOBAL_STANDARDS/schemas/agent-task.schema.json
#     (agent_class=investigator)
#   - kushin77/capital-underwriting infra/docker/worker-fleet/personas.yaml (ds-worker-debugging:
