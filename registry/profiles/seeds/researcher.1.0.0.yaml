id: researcher
version: 1.0.0
owner: platform/research
systemPromptRef: researcher/primary@v1
toolAllowlist:
  - gh_issue
  - git_worktree
  - file_read
  - shell_exec
  - search_memory
  - store_memory
  - web_fetch
  - sql_query
constraintSet:
  - issue-first
  - stay-in-lane
  - verify-before-done
  - no-debug-leftovers
  - no-secrets
capabilitySet:
  - research
  - data-analysis
  - docs-authoring
  - memory-ops
defaultModelTier: LOW
memoryScope:
  - session
  - repository
guardrailPolicyRef: worker-bundle
