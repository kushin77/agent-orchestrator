# registry/profiles/versions/manifest.yaml — AgentProfile published-version ledger
#
# Immutable-published version registry (issue #9, deliverable 3). Every seed
# file under registry/profiles/seeds/ that carries a published profile MUST be
# listed here with its (id, version, file, sha256). The validator refuses:
#   - any seed file whose on-disk sha256 differs from the recorded sha256
#     (a published version is IMMUTABLE: editing it without bumping the version
#     is a violation, caught by the gate — no-false-green),
#   - any duplicate (id, version) pair,
#   - any seed file missing from the ledger (nothing ships unpublished),
#   - any ledger entry whose file is missing or whose basename does not match
#     <id>.<version>.yaml.
#
# To publish a NEW version of a profile: add registry/profiles/seeds/<id>.<ver>.yaml
# (content), append one entry below with `sha256sum seeds/<id>.<ver>.yaml`, and
# re-run `python3 registry/profiles/validate.py`. Never edit a published file.

