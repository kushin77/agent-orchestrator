# registry/packs/pack-catalog.yaml — closed AgentPack vocabulary
#
# The canonical closed vocabulary for the agent-pack registry + catalog
# (issue #40): the pack categories a pack may declare and the artifact types a
# pack's contents manifest may bundle. registry/packs/agent-pack.schema.json
# embeds the same ids in its definitions enums; registry/packs/validate.py
# runs a schema<->catalog parity gate so the two can never drift.
#
# Vocabulary consumption (GR-10, provenance in releases/PROVENANCE.md):
#   - shared-frontend modules/schema.json  -> the id/category/status/upstream
#     module-registry field pattern; status lifecycle planned/live/paused/
#     retired
#   - CMR catalog/schemas/module.schema.json -> namespaced module identity,
#     versions, dependencies/consumers (catalog crossref model)
#   - CMR registry/attestation.sh -> signed, auditable bundle per version
#   - CMR catalog/events (events.schema.json) -> closed registry event kinds
#     (publish/consume/upgrade/drift)
#
# The pack category set is agent-pack-domain specific (the registry's own
# catalog of tenant-consumable capability bundles); it is NOT the portal
# launcher grouping from shared-frontend (landing/portal/mobile/shared/system)
# and deliberately does not redefine the pillar catalogs (profiles/catalog.yaml
# tools/capabilities/constraints, personas, prompts, guardrails/policy,
# identity/rbac) — packs reference those artifacts by id; they never re-declare
# them here.

categories:
  coding:
    summary: "Code-authoring worker bundles (profiles, personas, prompts, tools)."
  data:
    summary: "Data and analytics agent bundles."
  orchestration:
    summary: "Orchestrator / planner bundles."
  review:
    summary: "Review and audit SME bundles."
  research:
    summary: "Investigation / research agent bundles."
  security:
    summary: "Security-guardrail-centric bundles."
  integration:
    summary: "Integration / connector agent bundles."
  team:
    summary: "Cross-provider agent teams (heterogeneous profile/persona bundles)."

artifactTypes:
  profile:
    summary: "Registry profile (AgentProfile seed) bundled by id@version."
    refSource: "registry/profiles/seeds (issue #9; immutable published snapshots)"
  persona:
    summary: "Persona card bundled by id."
    refSource: "registry/personas/cards (issue #11)"
  prompt:
    summary: "Prompt module bundled by module/name@vN ref."
    refSource: "registry/prompts modules (issue #13)"
  policy:
    summary: "Guardrail policy (atomic or bundle) manifest."
    refSource: "guardrails/policy (issue #26)"
  tool:
    summary: "Tool manifest (allowlisted tool id)."
    refSource: "identity/rbac tool manifests (issue #37/#38) + profile tool catalog"
  skill:
    summary: >-
      Skill artifact: a first-class, independently-versioned capability a pack
      bundles and a tenant installs/upgrades/rolls back on its own. A skill
      carries an `evalEvidence` block (workbook-8 harness, registry/prompts/
      evals.py) and cannot be published without it.
    refSource: >-
      registry/packs skills.py (issue #640, workbook-9 Skill Studio); eval
      evidence shape consumed from registry/prompts/evals.py (issue #639)

# Closed Skill Studio category vocabulary (issue #640, workbook-9). A skill
# declares exactly one category, which is what makes the catalog searchable by
# skill. This is a pack-level closed vocabulary; it does NOT redefine the pack
# `categories` above (those group whole packs).
skillCategories:
  code-authoring:
    summary: "Skills that write or modify source code."
  code-review:
    summary: "Skills that read code and emit a review verdict."
  testing:
    summary: "Skills that author or run tests / evals."
  analysis:
    summary: "Skills that analyze artifacts and produce findings."
  data:
    summary: "Skills that transform or summarize data."
  operations:
    summary: "Skills that drive operational / fleet workflows."
  security:
    summary: "Skills that enforce a security or DLP guardrail."
  communication:
    summary: "Skills that produce human-facing artifacts (docs, reports)."

# Skill Studio lifecycle (issue #640): author -> test -> publish.
# `draft`      — authored, no eval evidence yet (never installable)
# `tested`      — eval evidence attached and green (publish prerequisites met)
# `published`   — frozen immutable snapshot; installable by tenants
# `deprecated`  — was published, no longer offered to new installs (terminal)
skillLifecycleStates:
  - draft
  - tested
  - published
  - deprecated

lifecycleStates:
  - planned
  - live
  - paused
  - retired
