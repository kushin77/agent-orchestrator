# Outcome feedback events for the prompt library (issue #13, deliverable 3).
#
# Each event pairs the labels a published prompt version actually produced
# (predicted) with the ground-truth labels (truth) for one evaluated call.
# A label is a false positive when predicted but not true; a false negative
# when true but not predicted. The feedback.py report aggregates these into
# per-prompt-version FP/FN metrics. The classify-route v2 events show the
# disambiguation edit reducing the FP/FN volume observed on v1.
#
# The C-suite block at the end carries the same treatment for the five workbook
# Master AI Prompt Templates published by issue #639 (source workbook #614 Tab
# 3): every C-suite module is labeled with the mechanical rule it enforces, so
# its FP/FN volume is visible in the same report as the phase-1 task types.
events:
