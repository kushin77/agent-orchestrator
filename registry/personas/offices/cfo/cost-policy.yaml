# registry/personas/offices/cfo/cost-policy.yaml — CFO office cost policy.
#
# This file does NOT restate model prices: it REFERENCES the existing single
# source, telemetry/metering/rate_cards/*.yaml, per the advisor guidance this
# office followed ("if prices are already declared there, cost-policy.yaml
# must reference them, not fork a second copy"). It declares budget-policy
# defaults (also referencing gateway/finops/budgets.yaml's vocabulary rather
# than redefining it) and the one number this office DOES own: the
# injected-prompt byte ceiling the KPI gate enforces.

schemaVersion: 1
office: cfo

tierPrices:
  source: telemetry/metering/rate_cards
  note: "Single source of truth. This file does not carry its own price table."

budgetPolicyDefaults:
  source: gateway/finops/budgets.yaml
  vocabulary: [stop, warn, fallback]
  note: "Policy names and semantics are consumed from gateway/finops/budgets.yaml, not redefined here."

kpi:
  id: repo_tracked_injected_prompt_bytes
  description: >-
    Sum of wc -c over the repo-tracked instruction files loaded every turn
    (AGENTS.md, CLAUDE.md, .cursorrules). Ratchet metric: must not grow.
    Explicitly NOT a measurement of harness-injected skill/MCP/tool-schema
    surfaces — see docs/cfo/PROMPT-REDUCTION-PLAN.md "Headline finding" for
    why those are out of this gate's reachable scope.
  files:
    - AGENTS.md
    - CLAUDE.md
    - .cursorrules
  baselineBytes: 33558
  measuredOn: "2026-09-22"
  measuredBy: "wc -c AGENTS.md CLAUDE.md .cursorrules"
  ceilingBytes: 33558
  ceilingReason: >-
    Raised from 32883 to 33244 (2026-09-21): CLAUDE.md grew by 361 bytes
    (2335 -> 2696) in exactly one commit, 6dfa54b7 ("docs: point Claude Code at
    front_load(), the 4th MCP tool, now that the pin carries it", #1532/#1881)
    — a legitimate doc pointer another lane landed, not prompt bloat to trim.
    AGENTS.md (28576) and .cursorrules (1972) are unchanged. Shrinking CLAUDE.md
    to fit the old ceiling would revert that merged change, so the ceiling is
    raised to the measured total rather than silently, per this gate's own
    documented remedy. Raised again from 33244 to 33505 (2026-09-22): two
    commits grew the measured set by 261 bytes, each a legitimate doctrine
    landing rather than prompt bloat. AGENTS.md grew 28576 -> 28775 (+199) in
    897e1803 ("docs(module): write down the new-module scaffold convention",
    #1943) — the standing instruction file itself, not an injected surface.
    .cursorrules grew 1972 -> 2034 (+62) in 92866917 ("docs: reconcile stale
    flag-gated-OFF doctrine with AO-GR-6", #1930). CLAUDE.md (2696) is
    unchanged, so 28576+2696+1972 = 33244 was the previous total and
    28775+2696+2034 = 33505 is the new one. Reverting either merged change to
    fit the old ceiling would undo doctrine another lane landed, so the ceiling
    is raised to the measured total, dated and named, exactly as this gate's own
    remedy requires. Raised again from 33505 to 33558 (2026-09-22) — the
    re-fire of #1973, a single +53 byte commit. AGENTS.md grew 28775 -> 28828
    (+53) in c6520545 ("vendor: add AgenticAutomationFramework as pinned
    Playwright E2E submodule", #2011), which generalized the vendor/ Hard
    DON'T to name both pinned submodules (vendor/CMR and
    vendor/AgenticAutomationFramework — the pair declared in .gitmodules)
    instead of only vendor/CMR, so the standing instruction file no longer
    understates which trees are off-limits. CLAUDE.md (2696) and .cursorrules
    (2034) are unchanged, so 28775+2696+2034 = 33505 was the previous total and
    28828+2696+2034 = 33558 is the new one. The added text is not duplicated
    (the "No editing vendor/" line appears exactly once in AGENTS.md), so there
    is nothing to revert as accidental prose; shrinking AGENTS.md to fit the
    old ceiling would restore a factually incomplete instruction, so the ceiling
    is raised to the measured total, dated and named, exactly as this gate's own
    remedy requires.
  zeroHeadroomNote: >-
    Zero headroom is deliberate and accepted (#1885). #1876 set the ceiling
    equal to the measurement because "a ceiling above the measurement is how
    this signal stops binding"; that choice is kept here by setting the ceiling
    to the measured total exactly, so the ratchet still binds. The accepted
    consequence: any growth in the three measured files reds the gate of record
    until a new raise carries its own attributable reason. That churn is a
    stated decision, not a surprise — no padding, no headroomBytes field, and no
    change to scripts/check-finops-kpi.sh.
  target90PctNote: >-
    The owner's 90%+ prompt-reduction objective is tracked in
    docs/cfo/PROMPT-REDUCTION-PLAN.md against total inbound bytes, most of
    which this repo cannot measure (harness-injected, not file-backed). This
    KPI is the ratchet on the fraction this repo CAN measure and enforce;
    it deliberately does not claim the 90% figure for itself.
