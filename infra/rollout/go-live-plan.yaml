# Per-phase go-live plan - maps every Phase 0-8 control-plane surface to the
# flag that gates it and the rollout stage that marks the surface live
# (issue #45 / work item 41). EPIC-00 phases 0-8:
#
#   phase 0 foundations (IaC + CI/CD), phase 1 registry, phase 2 gateway,
#   phase 3 engine, phase 4 guardrails, phase 5 telemetry, phase 6 identity,
#   phase 7 control-plane + portal, phase 8 autonomous operations.
#
# This file declares INTENT (what go-live looks like). CURRENT state lives in
# rollout-state.yaml and is always OFF until a promotion runs; promotion of
# every flag still travels OFF -> CANARY -> GRADUAL -> FULL through the
# automated pipeline. infra/rollout/checks/check_rollout.py asserts the plan
# covers every phase 0-8, that each flag resolves, and that every declared
# stage is part of the closed stage vocabulary - and, since #966, that the
# pairing holds BOTH ways: a flag `rollout-state.yaml` declares but no phase
# here names is a finding too, because the ordered driver takes its path from
# THIS file and could otherwise never reach it.

schema_version: 1
default_stage: "off"

phase_order: ["0", "1", "2", "3", "4", "5", "6", "7", "8"]

phases:
  "0":
    name: foundations (IaC + CI/CD)
    note: The verify and apply triggers open the only apply route.
    surfaces:
      - flag: ci_cd.verify_trigger
        go_live_stage: full
      - flag: ci_cd.apply_trigger
        go_live_stage: full
  "1":
    name: agent registry and profiling
    note: Agent profiles, personas, prompts, packs, service.
    surfaces:
      - flag: services.registry
        go_live_stage: full
  "2":
    name: model gateways
    note: Multi-provider proxy, routing, limits, finops metering.
    surfaces:
      - flag: services.gateway
        go_live_stage: full
      - flag: services.mcp_outbound
        go_live_stage: full
  "3":
    name: state-machine execution engine
    note: Durable orchestration engine, agent loop, memory, queue.
    surfaces:
      - flag: services.engine
        go_live_stage: full
  "4":
    name: security and guardrails
    note: DLP, isolation, policy gates, sandboxing.
    surfaces:
      - flag: services.guardrails
        go_live_stage: full
      - flag: services.sandbox_runtime
        go_live_stage: full
  "5":
    name: observability
    note: Full-trace telemetry, audit, budgets.
    surfaces:
      - flag: services.telemetry
        go_live_stage: full
  "6":
    name: tenant identity and RBAC
    note: Tenants, orgs, roles, entitlements, SSO.
    surfaces:
      - flag: services.identity
        go_live_stage: full
  "7":
    name: control plane and portal
    note: Management API + admin portal surface + public web UI.
    surfaces:
      - flag: services.portal
        go_live_stage: full
      - flag: services.web
        go_live_stage: full
      - flag: services.org_chart
        go_live_stage: full
      - flag: services.skill_studio
        go_live_stage: full
      - flag: services.task_board
        go_live_stage: full
      # The two halves the AgentConsole composes (issue #954, child of EPIC
      # #607), planned here because the rollout state carries them and this plan
      # must resolve every flag it names. They are listed ahead of the console
      # because that is the dependency the registry declares - the console's read
      # half is `GET /api/fleet/*` (`fleet_projection`) and its write half is
      # `POST /api/control/*` (`remote_control`), each gated on its own flag, so
      # promoting the console before its two halves would open a console that
      # answers 404 on both panels.
      - flag: surfaces.fleet_projection
        go_live_stage: full
      - flag: surfaces.remote_control
        go_live_stage: full
      # The AgentConsole (issue #802) is a `surfaces.*` flag rather than a
      # `services.*` one: it gates a route family inside the portal deployable
      # and has no terraform variable of its own. It is planned here because the
      # rollout state carries it, and the plan must resolve every flag it names.
      - flag: surfaces.operator_terminal
        go_live_stage: full
      # The ERP module's three promotion units - ERP-07 (issue #652), the #671
      # CRM->ERPNext webhook bridge, and the module's own portal switch - are
      # planned here by #966. They were declared drivable in `rollout-state.yaml`
      # and named by NO phase, so the ordered ladder, which computes its path
      # from THIS file, could never reach them: a completed, owner-approved
      # go-live run left the module dark with nothing red. The registry already
      # files all three under `phase: 7` (`services.erp_module`,
      # `services.erp_webhooks_bridge`, and `surfaces.erp_module`, a
      # `service: portal` switch), so phase 7 is the phase they belong to - and
      # the gate now refuses the omission in BOTH directions, so the next row
      # added to the state without a phase fails at the gate instead of being
      # noticed by an operator. Listing them is a declaration, not a promotion:
      # every row stays `stage: "off"` until the owner's run walks the ladder.
      - flag: services.erp_module
        go_live_stage: full
      - flag: services.erp_webhooks_bridge
        go_live_stage: full
      - flag: surfaces.erp_module
        go_live_stage: full
      # Edge fronting for ai.purebliss.app (issue #935, child of #731). Planned
      # in phase 7 because the registry files it under `service: portal`, same
      # as the other portal surfaces above.
      - flag: surfaces.edge_cutover
        go_live_stage: full
  "8":
    name: autonomous operations and governance
    note: This rollout pipeline (dogfooded first) and merge governance.
    surfaces:
      - flag: rollout.pipeline
        go_live_stage: canary
      - flag: rollout.governance
        go_live_stage: canary

# Phase sequencing rule enforced by check_rollout.py: a phase may only reach
# go-live after every earlier phase has reached its go-live stage.
promotion_order: strict-by-phase
