# Declarative current rollout state - agent-orchestrator rollout pipeline
# (issue #45). This is the CURRENT promotion state of every gated flag; it is
# separate from infra/feature-flags/registry.yaml (issue #6, the read-only
# flag registry this state mirrors) and from go-live-plan.yaml (the declared
# INTENT). infra/rollout/checks/check_rollout.py rejects any flag whose
# current stage is not "off", so a new surface can never ship on by accident.
#
# The rollout engine (infra/rollout/engine.py) and CLI transition this state;
# a real promotion flips a flag here through the automated pipeline and the
# apply path deploys the now-enabled surface. Every transition is appended to
# an audit log.

schema_version: 1
default_policy: "off"

flags:
  ci_cd.verify_trigger:
    stage: "off"
    rollout_pct: 0
    targeted: []
  ci_cd.apply_trigger:
    stage: "off"
    rollout_pct: 0
    targeted: []
  services.registry:
    stage: "off"
    rollout_pct: 0
    targeted: []
  services.gateway:
    stage: "off"
    rollout_pct: 0
    targeted: []
  services.engine:
    stage: "off"
    rollout_pct: 0
    targeted: []
  services.guardrails:
    stage: "off"
    rollout_pct: 0
    targeted: []
  services.telemetry:
    stage: "off"
    rollout_pct: 0
    targeted: []
  services.identity:
    stage: "off"
    rollout_pct: 0
    targeted: []
  services.portal:
    stage: "off"
    rollout_pct: 0
    targeted: []
  services.web:
    stage: "off"
    rollout_pct: 0
    targeted: []
  # Workbook surfaces (issue #644, workbook-13): one promotable flag per new
  # surface, all OFF. Without these rows the flags would be declared in the
  # registry but unpromotable here — measured: the engine refuses an unknown
  # flag with `unknown flag '<name>' (not declared in rollout state)`, so the
  # registry row alone would be a declaration the pipeline could not act on.
  # scripts/check-feature-flags.py keeps each of these in lock-step with
  # infra/terraform/variables.tf, and check_rollout.py requires each to have a
  # registry row.
  services.org_chart:
    stage: "off"
    rollout_pct: 0
    targeted: []
  services.skill_studio:
    stage: "off"
    rollout_pct: 0
    targeted: []
  services.task_board:
    stage: "off"
    rollout_pct: 0
    targeted: []
  services.mcp_outbound:
    stage: "off"
    rollout_pct: 0
    targeted: []
  services.sandbox_runtime:
    stage: "off"
    rollout_pct: 0
    targeted: []
  # The AgentConsole (issue #802, child of EPIC #800). The registry row declares
  # WHAT is gated; this row is what makes the surface **withdrawable**. Measured:
  # the engine refuses a flag this file does not carry (`unknown flag
  # 'surfaces.operator_terminal' (not declared in rollout state)`), so without it
  # a promoted console could be taken dark only by hand — the health-failure
  # rollback anchor (infra/rollout/surface_guard.py) would have nothing to drive,
  # and `check_rollout.py`'s parity keeps this row lock-stepped with the
  # registry's own `surfaces` section so the two declarations cannot drift.
  surfaces.operator_terminal:
    stage: "off"
    rollout_pct: 0
    targeted: []
  rollout.pipeline:
    stage: "off"
    rollout_pct: 0
    targeted: []
  rollout.governance:
    stage: "off"
    rollout_pct: 0
    targeted: []
