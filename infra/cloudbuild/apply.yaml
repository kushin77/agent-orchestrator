# Build config for the flag-gated control-plane apply pipeline.
#
# This is the ONLY apply route for infrastructure changes (no console path).
# The pipeline runs as the deployer service account and is fail-closed: if it
# is ever invoked with the apply flag OFF, it fails loudly instead of applying
# or silently skipping. `_ENABLE_APPLY` mirrors `ci_cd.apply_trigger` in
# infra/feature-flags/registry.yaml and defaults to "false".
#
# Never run by hand. Never applied from a console. Ships OFF.

# The FULL service ladder is rendered from substitutions here, never from
# terraform's committed defaults: the core services (registry → gateway →
# engine → guardrails → telemetry → identity → portal → web, EPIC-00 issue #4),
# the independently-promotable surfaces (paperclip #411, chat #503), the
# workbook/ERP switches (issue #644 workbook-13, ERP-07 issue #652), the
# promoted web image tag (issue #606) and the project id. Each flag is its own
# declared pair — services.<name> in infra/feature-flags/registry.yaml and its
# enable_<name> variable in infra/terraform/variables.tf — and this is where the
# pair reaches the only apply route: the plan below renders each one from its
# substitution instead of letting terraform fall back to the committed default.
# A promotion can therefore be applied by flipping one substitution, and the
# apply log records the posture it rendered, so "promoted but never rendered"
# is visible rather than silent. The substitutions are declared in
# apply-trigger.yaml (all "false"/sentinel), exactly as _ENABLE_APPLY is: the
# trigger is the only entry point, so there is one place to read the route's
# posture and one place to flip it. Nothing turns on by default.

# Run as the deployer SA (created by modules/deployer-sa at promotion).
# Populated via substitution at go-live; never hard-coded (GR-6).
# `serviceAccount` is a top-level Build field, not a BuildOptions field —
# nesting it under `options:` fails at trigger-run time with "unknown field
# serviceAccount in google.devtools.cloudbuild.v1.BuildOptions". A non-default
# service account also requires options.logging set away from the legacy
# default (GCS+Stackdriver dual logging is refused for a custom SA).
serviceAccount: $_DEPLOYER_SA

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Fail-closed gate: only proceed when the apply flag is deliberately on.
  - id: gate-flag
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    entrypoint: 'bash'
    args:
      - '-lc'
      - |
        if [ "$_ENABLE_APPLY" != "true" ]; then
          echo "apply is flag-gated OFF (_ENABLE_APPLY=$_ENABLE_APPLY); refusing to apply" >&2
          exit 1
        fi
        echo "apply flag ON; proceeding"

  - id: terraform-init
    name: 'hashicorp/terraform:1.6'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd infra/terraform
        terraform init -input=false

  - id: terraform-plan
    name: 'hashicorp/terraform:1.6'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd infra/terraform
        terraform plan -input=false \
          -var="project_id=$_PROJECT_ID" \
          -var="enable_registry=$_ENABLE_REGISTRY" \
          -var="enable_gateway=$_ENABLE_GATEWAY" \
          -var="enable_engine=$_ENABLE_ENGINE" \
          -var="enable_guardrails=$_ENABLE_GUARDRAILS" \
          -var="enable_telemetry=$_ENABLE_TELEMETRY" \
          -var="enable_identity=$_ENABLE_IDENTITY" \
          -var="enable_portal=$_ENABLE_PORTAL" \
          -var="enable_web=$_ENABLE_WEB" \
          -var="web_image_tag=$_WEB_IMAGE_TAG" \
          -var="enable_paperclip=$_ENABLE_PAPERCLIP" \
          -var="enable_chat=$_ENABLE_CHAT" \
          -var="enable_org_chart=$_ENABLE_ORG_CHART" \
          -var="enable_skill_studio=$_ENABLE_SKILL_STUDIO" \
          -var="enable_task_board=$_ENABLE_TASK_BOARD" \
          -var="enable_mcp_outbound=$_ENABLE_MCP_OUTBOUND" \
          -var="enable_sandbox_runtime=$_ENABLE_SANDBOX_RUNTIME" \
          -var="enable_erp_module=$_ENABLE_ERP_MODULE" \
          -var="deployer_enabled=$_ENABLE_DEPLOYER" \
          -var="deployer_role_class=$_DEPLOYER_ROLE_CLASS" \
          -out=/workspace/tfplan

  - id: terraform-apply
    name: 'hashicorp/terraform:1.6'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd infra/terraform
        terraform apply -auto-approve /workspace/tfplan
