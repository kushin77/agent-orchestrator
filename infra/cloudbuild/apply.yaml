# Build config for the flag-gated control-plane apply pipeline.
#
# This is the ONLY apply route for infrastructure changes (no console path).
# The pipeline runs as the deployer service account and is fail-closed: if it
# is ever invoked with the apply flag OFF, it fails loudly instead of applying
# or silently skipping. `_ENABLE_APPLY` mirrors `ci_cd.apply_trigger` in
# infra/feature-flags/registry.yaml and defaults to "false".
#
# Never run by hand. Never applied from a console. Ships OFF.

# The workbook-surface switches (issue #644, workbook-13). Each is a declared
# pair — services.<name> in infra/feature-flags/registry.yaml and its own
# enable_<name> variable in infra/terraform/variables.tf — and this is where the
# pair reaches the only apply route: the plan below renders each one from its
# substitution instead of letting terraform fall back to the committed default.
# A promotion can therefore be applied by flipping one substitution, and the
# apply log records the posture it rendered (the `workbook_surface_flags`
# output), so "promoted but never rendered" is visible rather than silent.
# The substitutions are declared in apply-trigger.yaml (all "false"), exactly as
# _ENABLE_APPLY is: the trigger is the only entry point, so there is one place
# to read the route's posture and one place to flip it.

options:
  # Run as the deployer SA (created by modules/deployer-sa at promotion).
  # Populated via substitution at go-live; never hard-coded (GR-6).
  serviceAccount: $_DEPLOYER_SA

steps:
  # Fail-closed gate: only proceed when the apply flag is deliberately on.
  - id: gate-flag
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    entrypoint: 'bash'
    args:
      - '-lc'
      - |
        if [ "$_ENABLE_APPLY" != "true" ]; then
          echo "apply is flag-gated OFF (_ENABLE_APPLY=$_ENABLE_APPLY); refusing to apply" >&2
          exit 1
        fi
        echo "apply flag ON; proceeding"

  - id: terraform-init
    name: 'hashicorp/terraform:1.6'
    entrypoint: 'bash'
    args:
      - '-lc'
      - |
        cd infra/terraform
        terraform init -input=false

  - id: terraform-plan
    name: 'hashicorp/terraform:1.6'
    entrypoint: 'bash'
    args:
      - '-lc'
      - |
        cd infra/terraform
        terraform plan -input=false \
          -var="enable_org_chart=$_ENABLE_ORG_CHART" \
          -var="enable_skill_studio=$_ENABLE_SKILL_STUDIO" \
          -var="enable_task_board=$_ENABLE_TASK_BOARD" \
          -var="enable_mcp_outbound=$_ENABLE_MCP_OUTBOUND" \
          -var="enable_sandbox_runtime=$_ENABLE_SANDBOX_RUNTIME" \
          -var="enable_erp_module=$_ENABLE_ERP_MODULE" \
          -out=/workspace/tfplan

  - id: terraform-apply
    name: 'hashicorp/terraform:1.6'
    entrypoint: 'bash'
    args:
      - '-lc'
      - |
        cd infra/terraform
        terraform apply -auto-approve /workspace/tfplan
