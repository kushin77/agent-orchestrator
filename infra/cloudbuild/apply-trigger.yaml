# Importable Cloud Build push trigger for the flag-gated control-plane apply
# pipeline — the ONLY apply route (no console path).
#
# Ships DISABLED (GR-5 / flag-gated OFF): nothing applies until a reviewed
# go-live imports this trigger with `disabled: false` and flips
# ci_cd.apply_trigger on in infra/feature-flags/registry.yaml. The pipeline is
# fail-closed (refuses to apply while _ENABLE_APPLY != "true").
name: control-plane-apply
disabled: true
description: Flag-gated terraform apply as the deployer SA (only apply route).
github:
  owner: kushin77
  name: agent-orchestrator
  push:
    branch: ^master$
filename: infra/cloudbuild/apply.yaml
# The FULL service ladder (core services + paperclip/chat surfaces +
# workbook/ERP switches), the promoted web image tag and the project id are
# declared here and consumed by apply.yaml's plan step, so the posture of the
# only apply route is readable in one place: every flag is "false" (and the web
# image tag the all-zero sentinel) until a reviewed promotion flips it.
substitutions:
  _ENABLE_APPLY: "false"
  _ENABLE_REGISTRY: "false"
  _ENABLE_GATEWAY: "false"
  _ENABLE_ENGINE: "false"
  _ENABLE_GUARDRAILS: "false"
  _ENABLE_TELEMETRY: "false"
  _ENABLE_IDENTITY: "false"
  _ENABLE_PORTAL: "false"
  _ENABLE_WEB: "false"
  _ENABLE_PAPERCLIP: "false"
  _ENABLE_CHAT: "false"
  _ENABLE_ORG_CHART: "false"
  _ENABLE_SKILL_STUDIO: "false"
  _ENABLE_TASK_BOARD: "false"
  _ENABLE_MCP_OUTBOUND: "false"
  _ENABLE_SANDBOX_RUNTIME: "false"
  _ENABLE_ERP_MODULE: "false"
  _WEB_IMAGE_TAG: "0000000000000000000000000000000000000000"
  _PROJECT_ID: "false"
