# Build config for the control-plane verify trigger (code-native CI status).
#
# Runs the repo gate of record (`make verify`) when a pull_request trigger
# fires. The runner image must provide bash, make, and python3 + PyYAML (the
# same toolchain `make verify` requires locally); terraform/shellcheck/
# gitleaks/pre-commit are SKIP-if-absent per scripts/check-terraform.sh and
# friends, so the runner need not provide them. This file is declarative
# scaffolding — the trigger that executes it ships disabled until a reviewed
# go-live (see README.md and the feature-flag registry).

# The verify trigger runs as an explicit service account, and Cloud Build
# refuses such builds unless logging is CLOUD_LOGGING_ONLY, NONE, or a logs
# bucket is declared (see apply.yaml for the same constraint).
options:
  logging: CLOUD_LOGGING_ONLY

# THIS VENUE POSTS NOTHING (issue #1415). Until this change the box-side runner
# rung posted `ao/gate-of-record` for every verified head while this build posted
# a SECOND status for the SAME commit (issue #1354 added the step). Two producers
# of one required context is the drift class #1342/#1382 exists for -- and the
# second one describes the same `make verify` invocation the first one does:
# `scripts/verify.sh` already publishes its own verdict through the ONE poster,
# `scripts/gate-status.sh`. So the poster step is gone, that script is still the
# one poster, and the runner is the single producer.
#
# KEPT FROM #1350, because the lesson still binds: this build's job is to run the
# gate and report ITS OWN rc on the code under review. A build that dies before
# the gate has said nothing about that code, and a build that fails because it
# could not publish (an absent token, an image without `gh`) is the same mistake
# wearing a producer's clothes -- so nothing here reads a secret, and nothing
# here can fail for a reason other than the gate's verdict.
#
# The historical refusal is kept on the record because it is why the shape is
# what it is: declaring the PAT through `availableSecrets` made an absent secret
# hard-fail the build at step 0 (measured: build
# 27b692b8-0da5-483b-89d9-8f4e348dd806, `Secret [ao-gate-status-token] not found
# or has no versions`), so the gate never ran and the red said nothing about the
# code. Nothing is fetched through `availableSecrets` and no secret is required
# for this build to run.

steps:
  # Toolchain attestation + the gate itself, in one step: Cloud Build steps
  # each run in a fresh container and do not share installed packages, so
  # installing PyYAML/pytest in a separate "toolchain" step would not persist
  # into a later "verify" step. `gcr.io/google.com/cloudsdktool/cloud-sdk` has
  # no `make`, so this runs on `python:3.14` (Debian full image; has make and
  # git) instead, matching the dev box's Python: knowledge-index's
  # `Path.glob("x/**")` only started matching files (not just directories)
  # in 3.13+, so 3.12 silently starved it of sources. History is deepened
  # (the default Cloud Build checkout is shallow) because lessons-sync and
  # capability-drift walk commit ancestry and need cited ancestor commits to
  # resolve; a git identity is configured because check-reconcile's
  # old-unbaselined provocation makes a real backdated commit.
  #
  # WHAT THIS VENUE MUST SUPPLY (issue #1424), and why each half is load-bearing.
  #
  # 1. A MULTI-BYTE LOCALE. `scripts/check-gate-status.sh` asserts a status
  #    description against the API's 140-CHARACTER cap using bash's `${#var}`,
  #    which counts BYTES in the C locale and CHARACTERS in a UTF-8 one. The
  #    production code is correct -- `scripts/gate-status-map.py` yields exactly
  #    140 characters / 142 bytes for a 500-character detail -- so in a
  #    byte-counting shell the check reds on its OWN self-test arm, verbatim
  #    from build 0030a1ed (PR #1475) and identically on 5f0778f4 and baa834ec:
  #
  #      check-gate-status: FAIL -- the detail arm 'a 500-character detail
  #        still fits the API's 140-character description cap' did not hold
  #        expect: <=140   actual: >140 (142)
  #
  #    That arm sets the check's `fail=1`, so the check exits 1 instead of the
  #    rc 2 CANNOT-ASSESS it reaches with a multi-byte locale -- and rc 2 is the
  #    shape `scripts/skip-budget.json` ALREADY declares for it, through its
  #    `live-dependent` entry naming the mechanism and issue #1382. Supplying
  #    the locale therefore widens no budget: it lets a check that was right all
  #    along reach its own verdict. The step ASSERTS the declaration took, so an
  #    image that drops the locale is NAMED in the log rather than surfacing as
  #    a mystery check red. The assert is a WARNING and not fatal, because the
  #    gate's own verdict must stay this step's outcome.
  #
  # 2. THE REFERENCE SCOPE. History DEPTH is not history's only axis, which the
  #    deepen line below assumed. The checkout carries ONE branch's refs, so an
  #    object the REPOSITORY holds but no fetched ref reaches is simply absent
  #    -- and `check-lessons` then answers "not in this repository's history"
  #    about a commit the repository does hold, verbatim from the same builds:
  #
  #      ERROR evidence-unresolvable  LESSON-0015 names commit 52fe84d6..., which
  #        is not in this repository's history [LESSON-0015]
  #      ERROR evidence-unresolvable  SUGGEST-0018 names commit 9724c0c9..., which
  #        is not in this repository's history [SUGGEST-0018]
  #
  #    Both commits are served by `gh api .../commits/<sha>` and are reachable
  #    from a CLOSED pull request's head ref (refs/pull/1356/head,
  #    refs/pull/1408/head); neither is on the default branch. The check's own
  #    shallow-clone carve-out -- which would make this a WARNING rather than an
  #    error -- never fires, because `git rev-parse --is-shallow-repository` is
  #    FALSE in this venue. `check-board-gate` reds in those builds only because
  #    it folds `check-lessons`. Reproduced in a single-branch clone of this
  #    tree and cleared by the fetch below. That fetch is best-effort and NAMED:
  #    a fetch that cannot reach the origin must not become the step's outcome,
  #    and the log must say which half landed.
  #
  # The API CAPS a step argument at 10000 characters, so the prose lives here and
  # the script below carries only what it must.
  - id: verify
    name: 'python:3.14'
    entrypoint: 'bash'
    # Supplies precondition 1 above for every command the step runs; the script
    # asserts it took. C.UTF-8 is glibc's own locale, so a Debian-based image
    # needs no locale-gen.
    env:
      - 'LANG=C.UTF-8'
      - 'LC_ALL=C.UTF-8'
    args:
      - '-lc'
      - |
        set -euo pipefail
        export AO_PR_NUMBER=$_PR_NUMBER  # hands the runner's PR context to the pr-contract gate (#1341)
        python3 -m pip install --quiet --disable-pip-version-check -r infra/cloudbuild/requirements-verify.txt
        # gates that pin PATH=/usr/bin:/bin must still reach the interpreter the deps went into
        ln -sf /usr/local/bin/python3 /usr/bin/python3
        git config --global --add safe.directory /workspace
        git fetch --unshallow --quiet origin 2>/dev/null || git fetch --deepen=100000 --quiet origin || true
        git config --global user.email ci@cloudbuild.local
        git config --global user.name "cloudbuild-verify"
        command -v make >/dev/null || { echo "make missing"; exit 1; }
        python3 -c 'import yaml' || { echo "PyYAML missing"; exit 1; }
        PATH=/usr/bin:/bin python3 -c 'import yaml' || { echo "PyYAML missing on /usr/bin/python3"; exit 1; }
        echo "toolchain OK"

        # precondition 1, ASSERTED (issue #1424) -- rationale in the step comment
        ven_mark="$(python3 -c 'print(chr(0x2026), end="")')"
        if [ "${#ven_mark}" -ne 1 ]; then
          echo "verify-venue: WARN -- LANG=${LANG:-<unset>} LC_ALL=${LC_ALL:-<unset>} leaves a BYTE-counting shell, so a 140-character status description measures 142 and check-gate-status.sh's cap assertion fails"
        else
          echo "verify-venue: locale OK (LANG=${LANG:-<unset>} LC_ALL=${LC_ALL:-<unset>})"
        fi

        # precondition 2 (issue #1424) -- rationale in the step comment
        for refset in '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*/head:refs/remotes/origin/pr/*'; do
          if git fetch --quiet origin "$refset" 2>&1; then
            echo "verify-venue: fetched $refset"
          else
            echo "verify-venue: WARN -- could not fetch $refset; evidence reachable only from it stays unresolvable"
          fi
        done

        # `make verify` is the gate of record, run through the same entrypoint
        # the Makefile uses. Its rc is CAPTURED (the `|| rc=$?` guard keeps
        # `set -e` from ending the step here) so the step ends with the GATE's
        # own verdict, never with the shell's first failure -- and with no poster
        # below, that rc IS this build's outcome (issue #1415).
        rc=0
        bash scripts/verify.sh verify || rc=$?

        exit "$rc"
