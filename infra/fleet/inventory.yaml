# infra/fleet/inventory.yaml — the fleet-cron image's DEPENDENCY INVENTORY.
#
# This file is the porting contract for `infra/fleet/Dockerfile` (issue #709,
# EPIC #706 D1). "Package the scheduled automation into one image so it can run
# off this box" is only honest if the list of things the image needs is written
# down, complete in both directions, and checked against the thing it describes
# — so this is not documentation, it is the file
# `scripts/check-fleet-cron-image.sh` compares the image to:
#
#   * a package the Dockerfile installs that is NOT listed here is a refusal
#     (the image grew a dependency nobody recorded);
#   * a package listed here that the Dockerfile does NOT install is a refusal
#     (the contract claims something the image does not do);
#   * `schedule`, `rungs` and `state_roots` are re-MEASURED from the modules
#     they describe at gate time (`fleet/cron.py`, `fleet/watchdog.py`,
#     `fleet/runtime.py`) and compared with what is declared here, so this file
#     cannot drift from the code it inventories.
#
# `derived` records the entries that the issue's own prose did not name and
# explains why each one cannot be dropped. Each is proved load-bearing by a
# provoked control in the gate — a one-line mutant image that removes it and
# must be reported broken — rather than by an argument in this comment.
schema: fleet-cron-inventory-v1
issue: 709
parent: 706

image:
  name: agent-fleet-cron
  base: python:3.12-slim
  workdir: /repo
  entrypoint: /repo/infra/fleet/entrypoint.sh
  build: docker build -f infra/fleet/Dockerfile -t agent-fleet-cron:dev .
  verify: docker run --rm agent-fleet-cron:dev python3 fleet/cron.py status

# 1. THE SCHEDULE — one crontab line per enabled job, and one owner for all of
# them.
#
# `fleet/cron.py` is the only writer: it owns the markers (which is how a
# foreign crontab line is never touched), the interval, the log paths and the
# interpreter path. The image holds NO second copy of any of that; the
# entrypoint asks the module to install. Measured at gate time against
# `fleet/cron.MARKERS`, so adding a line to the module without recording
# it here fails the gate.
schedule:
  owner: fleet/cron.py
  install: python3 fleet/cron.py install
  lines: 4
  markers:
    - ao-fleet-watchdog
    - ao-fleet-prune
    - ao-fleet-reconcile
    - ao-fleet-reap

# 2. THE RUNGS the watchdog owns (fleet/watchdog.py) — respawned when missing or
# drifted, never restarted merely to update code. Measured against
# `fleet/watchdog.RUNGS` + `MONITOR_PATTERN`.
rungs:
  owner: fleet/watchdog.py
  scripts:
    - fleet/brain.py
    - fleet/terminal.py
    - fleet/monitor.py

# 3. THE STATE ROOTS. `fleet/runtime.py` namespaces the fleet's runtime
# directory behind `AO_FLEET_DIR` (default `<repo>/.fleet`, and byte-identical
# when unset). The claim ledger is deliberately NOT namespaced — `.board/` stays
# at the repo root, shared, so two fleets can never claim the same issue.
state_roots:
  - path: /repo/.fleet
    env: AO_FLEET_DIR
    namespaced: true
  - path: /repo/.board
    env: null
    namespaced: false

# The build context deliberately EXCLUDES the state roots (see `.dockerignore`):
# they are runtime state, and an image that baked one host's claim ledger would
# hand every container the same stale board. The image therefore depends on the
# exclusion and creates the paths empty. Checked as a SUBSET — another image may
# exclude more, never less.
context_exclusions:
  - .board
  - .fleet

# 4. THE BINARY DEPENDENCIES, as the issue names them, plus `/usr/bin/python3`:
# the crontab lines are written with that literal path by `fleet/cron.py`, which
# the image does not get to change, so the image must provide it.
binaries:
  - python3
  - /usr/bin/python3
  - git
  - gh
  - claude
  # `ao-fleet-reap`'s crontab line (fleet/cron.py:reap_line) runs
  # `bash scripts/prune-worktrees.sh`, the same literal `bash` invocation the
  # dev-run role dispatches — same argument as `/usr/bin/python3` above: the
  # image does not get to change what the schedule's owner writes.
  - bash

# 5. PACKAGES. Every package the image installs, with the reason it is there and
# a marker of whether it is installed at build time only. Compared BOTH ways
# against the Dockerfile's own install lines.
packages:
  - install: tini
    via: apt
    stage: runtime
    gives: tini
    why: "PID 1 — reaps the rungs' orphans and forwards SIGTERM/SIGINT, so `docker stop` is a clean stop of a loop that holds a claim."
  - install: git
    via: apt
    stage: runtime
    gives: git
    why: "every rung's branch and worktree operation."
  - install: openssh-client
    via: apt
    stage: runtime
    gives: ssh
    why: "`git push` over ssh."
  - install: cron
    via: apt
    stage: runtime
    gives: crontab
    why: "the `crontab` binary `fleet/cron.py` reads and writes, and the daemon the entrypoint runs in the foreground."
  - install: ca-certificates
    via: apt
    stage: runtime
    gives: null
    why: "TLS for gh and for the pinned claude download."
  - install: curl
    via: apt
    stage: build
    gives: curl
    why: "fetching the pinned claude release, and the GitHub CLI's apt keyring."
  - install: gh
    via: apt
    stage: runtime
    gives: gh
    why: "the fleet's issue and PR surface — the GitHub CLI, from GitHub's own apt repository."
  - install: PyYAML
    via: pip
    stage: runtime
    gives: yaml
    why: "the reconcile rung imports governance.lifecycle, which reads governance/lifecycle/controls.yaml at import time (#885/#1065) and needs PyYAML to parse it (issue #1034)."
    version: "6.0.2"
  - install: claude
    via: release
    stage: runtime
    gives: claude
    why: "the subagent runner every rung dispatches to."
    version: "2.1.270"
    platform: linux-x64
    url: https://downloads.claude.ai/claude-code-releases
    integrity: sha256 from the release manifest, verified at build time

# 6. THE DEV-FIRST RUN — D2 (issue #710). The image boots HERE, on the box the
# schedule was written on, and dispatches its roles with every job in dry-run.
#
# `roles` is the DRY-RUN FORM of each job, keyed by the schedule's own marker:
# the markers belong to `fleet/cron.py` (section 1) and the dry-run discipline of
# each one is declared here, so the two are checkable against each other rather
# than against a reader's memory. A job with no dry-run form is declared
# `not-dispatched` WITH its reason — the watchdog's pass spawns the rungs, so a
# dry-run of it is a contradiction rather than a flag, and saying so is what
# keeps that job present in the evidence instead of quietly absent.
#
# The state mounts are read-only, and that is a MEASUREMENT in the decision
# document: each root's flags are read from /proc/self/mountinfo, and the
# attribution rule follows from them (a read-only root cannot have been written
# by the container; a writable one can, so a permitted path that moved is ours).
dev_run:
  issue: 710
  parent_issue: 709
  compose: infra/fleet/docker-compose.agent-cron.yml
  harness: infra/fleet/dev_run.py
  env_contract: infra/fleet/env_contract.py
  health_surface: infra/fleet/healthz.py
  decision_document: .verify/dev-run/decision.json
  port: 8790
  state_mounts: read-only
  roles:
    - marker: ao-fleet-watchdog
      role: watchdog
      discipline: not-dispatched
      why: "fleet/watchdog.py's pass SPAWNS the rungs; it has no planning mode."
    - marker: ao-fleet-prune
      role: prune
      discipline: dry-run
      command: "fleet/prune.py run"
      why: "the retention planner is dry-run by default; --apply is what acts."
    - marker: ao-fleet-reconcile
      role: reconcile
      discipline: dry-run
      command: "governance/reconcile/cli.py watch --once"
      why: "one reconciliation pass without --apply: it names the orphans it would act on."
    - marker: ao-fleet-reap
      role: reap
      discipline: dry-run
      command: "scripts/prune-worktrees.sh"
      why: "the worktree reaper (#207/#516, scheduled by #830/#901) is a report by default; --apply is what removes anything."
    # ao-fleet-promote-portal is deliberately NOT added here: `roles` is
    # cross-checked against infra/fleet/dev_run.py's own role table
    # (scripts/check-fleet-cron-dev-run.sh, inventory-role-drift), and that
    # harness declares no entry for this marker yet — it dispatches only what
    # config/fleet-jobs.json enables, and this rung stays `enabled: false`
    # pending the AR credential (docs/AGENTCONSOLE-HOSTING.md §5c). Adding a
    # role here the harness cannot match would trade one honest gap for a
    # gate failure; see the PR's "## Wiring needed".

# 7. THE state-rw SERVICE'S EXTRA SURFACE (issue #1329/#1341, EPIC #706 D3).
#
# `docker-compose.agent-cron.yml`'s `agent-cron-rw` service (flag-gated by the
# `state-rw` compose profile, never started by a bare `up`) is where the
# promote-portal rung will eventually run `--apply`: recreating the
# `shared-services-agentconsole` container means talking to the HOST's Docker
# daemon, which the shared image (section 5's `packages`/`binaries`, built once
# for every service from the one Dockerfile) does not provide today.
#
# This is declared SEPARATELY from `packages`/`binaries` above on purpose:
# those two lists are cross-checked against `infra/fleet/Dockerfile` in BOTH
# directions by `scripts/check-fleet-cron-image.sh` (a package/binary listed
# there that the Dockerfile does not install is `package-uninstalled` /
# `interpreter-missing`), and `infra/fleet/Dockerfile` is out of this lane's
# file scope (see the PR's "## Wiring needed"). Recording the requirement here
# — read by nobody's cross-check yet — is honest about what is NOT yet true,
# rather than claiming a package the image does not have.
state_rw:
  service: agent-cron-rw
  compose_profile: state-rw
  needs:
    - package: docker-ce-cli
      via: apt
      alternative: docker.io
      why: "promote_portal.py's --apply path recreates the host's agentconsole container over the Docker CLI; the shared image installs no Docker client today."
  docker_socket:
    mount: /var/run/docker.sock
    target: /var/run/docker.sock
    read_only: true
    scope: agent-cron-rw only — never the sibling agent-cron (dev-run) service
    why: "least privilege: only the flag-gated, credentialed rung that ever needs to act on a container gets a path to the daemon; the dry-run-only sibling never does."
  wiring_needed: "infra/fleet/Dockerfile installing docker-ce-cli (or docker.io) for the shared image — out of this lane's file scope."
