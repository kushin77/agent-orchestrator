# Feature-flag registry — agent-orchestrator control plane
#
# The declarative record that every control-plane surface (service, endpoint,
# CI/CD trigger) ships **OFF** until a reviewed go-live promotes it (IaC
# mandate / flag-gated OFF default). Nothing in this repo is tenant-visible or
# applied while its flag is off.
#
# scripts/check-feature-flags.py enforces this file mechanically and keeps it
# in lock-step with infra/terraform/variables.tf (every `enable_*` flag must
# default to `false`). A new surface cannot ship on by accident.
#
# Every `default: off` entry that is not yet `promoted` carries exactly one of
# two promotion-ownership fields (issue #1618), enforced by the same check:
#   `promotion_issue:` — the open issue whose lane owns the reviewed go-live
#                       that promotes this surface; or
#   `posture: hold`    — declared off with no promotion owner yet assigned, so
#                       the surface is invisible debt until someone files the
#                       promotion issue and replaces `hold` with the number.
# An entry with neither is refused by name, so a drifting declared-off surface
# can no longer hide behind "the answer is in the prose" (issue #1540's gap).

schema_version: 1

# New entries MUST default to "off". A check fails if any entry defaults on.
default_policy: off

description: >
  Each control-plane service and CI/CD trigger is declared here with its
  promotion state. Promotion = a reviewed go-live that flips the flag, runs
  `make verify` + `terraform plan`, then applies via the deployer SA through
  the flag-gated Cloud Build apply pipeline — never the console.

# The ONLY apply route. No console path is acceptable.
apply_path:
  only: flag-gated automated apply (deployer SA via Cloud Build)
  trigger: infra/cloudbuild/apply-trigger.yaml
  deployer_module: infra/terraform/modules/deployer-sa
  build_config: infra/cloudbuild/apply.yaml

# CI/CD trigger flags (all OFF until promoted).
ci_cd:
  verify_trigger:
    default: off
    promoted: true
    description: PR verify trigger runs `make verify` as a code-native CI status.
  apply_trigger:
    default: off
    promoted: true
    description: >
      Flag-gated terraform apply trigger; the only apply route. Promotion
      here records the reviewed go-live decision; arming the live trigger
      (`gcloud builds triggers update --no-disabled`, out-of-band, never a
      commit) is a separate operational step, and apply.yaml's flag-gate
      still refuses every run while `_ENABLE_APPLY` stays "false"
      (infra/cloudbuild/apply-trigger.yaml).

# Per-service promotion state. `tf_flag` maps to the matching variable in
# infra/terraform/variables.tf (all default false).
services:
  registry:
    default: off
    promoted: false
    posture: hold
    phase: 1
    tf_flag: enable_registry
    description: Agent Registry & Profiling.
  gateway:
    default: off
    promoted: false
    posture: hold
    phase: 2
    tf_flag: enable_gateway
    description: Model Gateways (multi-provider proxy/router).
  engine:
    default: off
    promoted: false
    posture: hold
    phase: 3
    tf_flag: enable_engine
    description: State-machine execution engine.
  guardrails:
    default: off
    promoted: false
    posture: hold
    phase: 4
    tf_flag: enable_guardrails
    description: Security & guardrails (DLP, prompt-injection defense, budgets).
  telemetry:
    default: off
    promoted: false
    posture: hold
    phase: 5
    tf_flag: enable_telemetry
    description: Observability, audit, FinOps metering.
  identity:
    default: off
    promoted: false
    posture: hold
    phase: 6
    tf_flag: enable_identity
    description: Tenant identity / RBAC.
  portal:
    default: off
    promoted: false
    posture: hold
    phase: 7
    tf_flag: enable_portal
    description: Admin control-plane portal.
  web:
    default: off
    promoted: false
    posture: hold
    phase: 7
    tf_flag: enable_web
    description: Public web surface (portal + shared-frontend) served at ai.purebliss.app.
  paperclip:
    default: off
    promoted: false
    posture: hold
    phase: 7
    tf_flag: enable_paperclip
    description: >
      Self-hosted upstream paperclip runtime beside the control plane (issue
      #411, ADR-0013): a process boundary, not a control-plane service. Pinned
      OCI image (infra/paperclip/release.yaml), health-probed at GET /api/health,
      nothing vendored. Inert until a reviewed go-live promotes this flag.
  hermes:
    default: off
    promoted: false
    promotion_issue: "#1518"
    phase: 2
    tf_flag: enable_hermes
    description: >
      Local hermes agent-service provider (issue #255, module-catalog issue
      #349): the keyless, Ollama-compatible /api/chat adapter
      (gateway/providers/hermes.py, gateway/catalog/modules/hermes/module.json)
      that serves the local hermes3 endpoint at http://localhost:8080/api/chat
      and is the frozen hermes -> hermes/ollama fallback target (EPIC #253).
      Unlike paperclip it is not a separate deployable process — no OCI image,
      no terraform module (module.json distribution.terraform is null) — so
      this row declares the independent rollout/kill-switch only; nothing in
      infra/terraform creates or gates a resource for it, and (like paperclip)
      it carries no infra/rollout/rollout-state.yaml entry. The declared
      `enable_hermes` variable is the switch itself, and it is a LIVE gate:
      the provider registry reads it (gateway/providers/flags.py, issue #1518)
      and, while it is off, drops hermes from the active provider set — hermes
      is retired by default (gateway/catalog/modules/hermes/module.json status
      is `retired`) and only a reviewed go-live that flips this flag
      re-activates it. The dead local endpoint at http://localhost:8080/api/chat
      is not re-created here: the namesake `~/hermes-agent` Flask product (port
      9501,
      ADR-0012) is a separate deployable, out of scope for this row. It
      declares no dedicated health-probe path (unlike paperclip's GET
      /api/health): the health layer
      (gateway/health/fallback.py) tracks hermes as a provider rung whose
      outcomes are recorded by the caller, and its only declared endpoint is
      the Ollama-compatible POST /api/chat chat surface above.
  chat:
    default: off
    promoted: false
    posture: hold
    phase: 7
    tf_flag: enable_chat
    description: >
      Conversational serving surface (issue #503, ADR-0023): the
      OpenAI-/Ollama-compatible endpoints of `gateway/chat`
      (POST /v1/chat/completions, POST /api/chat, GET /v1/models) that dispatch
      every turn through the existing `gateway/proxy` funnel. Declared as its own
      promotion unit, with its own `enable_chat`, so promoting (or killing) chat
      neither implies nor requires promoting the gateway or the portal it is
      embedded in — ADR-0023 §5. It is not a separate deployable process: the
      endpoints are served by the gateway service, and this entry exists so the
      surface has an independent switch and so the feature-flag gate's
      services—terraform parity holds for `enable_chat`. Ships invisible: while
      `surfaces.chat` is off the routes answer 404 before AuthN.

  # --- Workbook surfaces (issue #644, workbook-13) ------------------------
  #
  # The five surfaces workbook-11/12/5 added to the repo (issue #642's three
  # portal views, issue #641's outbound MCP servers, issue #636's sandbox
  # runtime) each own an in-module switch *and* a row here. The row is the
  # cross-cutting promotion unit: it carries its OWN `enable_*` variable so the
  # flag the rollout pipeline promotes, the flag the apply pipeline renders and
  # the flag the code reads are one and the same name (the `services.chat`
  # precedent). None of the five is a separate deployable process and none
  # creates a terraform resource: the code ships inside the portal, the gateway
  # or the guardrails service, and the variable is the switch, not a resource
  # count. What the row buys is that the switch is *declared* — promotable
  # through the rollout pipeline (infra/rollout/rollout-state.yaml carries the
  # matching flag), passed explicitly to terraform by the only apply route
  # (infra/cloudbuild/apply.yaml), reported by the `workbook_surface_flags`
  # output, and required by the feature-flag gate's services—terraform parity.
  # All five default OFF: an unpromoted workbook surface is dark.
  org_chart:
    default: off
    promoted: false
    promotion_issue: "#1521"
    phase: 7
    tf_flag: enable_org_chart
    description: >
      Org-chart portal view (issue #644, workbook-13; surface code added by
      issue #642): the read-only rendering of the workbook-1 org declaration
      (registry/personas/org-chart.yaml + the bound cards/*.yaml) joined to the
      workbook-6 role-health feed, served at GET /api/orgchart/chart and
      GET /api/orgchart/health by `portal/server/org_chart.py` inside the
      existing portal deployable. The in-module switch is `surfaces.org_chart`
      in `portal/config/feature-flags.yaml`, read fail-closed by
      `portal/server/config_flags.py`; this row is what promotes it.
  skill_studio:
    default: off
    promoted: false
    promotion_issue: "#1521"
    phase: 7
    tf_flag: enable_skill_studio
    description: >
      Skill-studio portal view (issue #644, workbook-13; surface code added by
      issue #642): the author -> test -> publish workflow of the workbook-9 API
      over the console's HTTP surface (GET /api/skillstudio/skills,
      GET /api/skillstudio/skills/<id>,
      POST /api/skillstudio/author|test|publish), served by
      `portal/server/skill_studio.py` inside the existing portal deployable. The
      studio refuses a publish without green eval evidence; this flag only
      decides whether the workflow is reachable. The in-module switch is
      `surfaces.skill_studio` in `portal/config/feature-flags.yaml`.
  task_board:
    default: off
    promoted: false
    promotion_issue: "#1522"
    phase: 7
    tf_flag: enable_task_board
    description: >
      Tenant task board (issue #644, workbook-13; surface code added by issue
      #642): the workbook-3 ticket lifecycle (engine/core/tickets.TicketRuntime)
      projected per tenant as a replay of the durable event log, served
      read-only at GET /api/taskboard/tickets and
      GET /api/taskboard/tickets/<id> by `portal/server/task_board.py` inside the
      existing portal deployable. The in-module switch is `surfaces.task_board`
      in `portal/config/feature-flags.yaml`.
  mcp_outbound:
    default: off
    promoted: false
    posture: hold
    phase: 2
    tf_flag: enable_mcp_outbound
    description: >
      Outbound MCP servers (issue #644, workbook-13; surface code added by issue
      #641): the calls `gateway/mcp/outbound.py` may make to declared remote MCP
      servers, reached only when the deployment flag AND a server entry's own
      `enabled` are both on (two decisions, so one flag cannot widen reach
      alone). The in-module switch is the `AO_MCP_OUTBOUND_ENABLED` environment
      flag (compiled OFF: an absent or empty value leaves the whole family
      unreachable), and every seeded registry entry ships OFF as well. No
      separate process: the client runs inside the gateway deployable.
  sandbox_runtime:
    default: off
    promoted: false
    posture: hold
    phase: 4
    tf_flag: enable_sandbox_runtime
    description: >
      Sandbox runtime enablement (issue #644, workbook-13; surface code added by
      issue #636): the single declared switch that decides whether
      `guardrails/sandbox/` may run a real runtime (docker / firecracker) rather
      than the offline seam. The in-module switch is the ``SandboxEnablement``
      flag in `guardrails/sandbox/enablement.py` — structurally OFF (a
      construction with ``enabled=True`` is refused; only ``enable()``, the act a
      reviewer can see, flips it), reversible via ``disable()``, and it never
      turns "flag on" into a fabricated execution. Portal-independent by
      construction: no portal route and no portal flag participates in it.

  # The ERP module's portal surface (ERP-07, issue #652, EPIC #645). Its own
  # promotion unit, for the reason the module's manifest
  # (integrations/erp/module.yaml) records: that file deliberately ships no
  # central row with the foundation, because infra/terraform/variables.tf is kept
  # in lock-step with `services` by scripts/check-feature-flags.py and a row here
  # therefore gates a *reachable* surface. This is that surface, so the row lands
  # here — and with its own `enable_erp_module` rather than `enable_portal`, so
  # promoting (or killing) the module neither implies nor requires promoting the
  # portal around it (the `services.chat` precedent).
  erp_module:
    default: off
    promoted: false
    posture: hold
    phase: 7
    tf_flag: enable_erp_module
    description: >
      ERP module portal surface (ERP-07, issue #652; EPIC #645): the module's
      dashboards, document lists/forms and reports, mounted into the console
      behind the switch the module's own manifest declares
      (`features[].id: erp-module`). Served by `portal/server/erp.py` at
      GET /api/erp/module|dashboard|reports[<id>], by the verbatim proxy of
      ERP-06's own routes (/api/erp/documents/... and
      /api/erp/openapi.json|health), and by the module's frame at
      /erp/module.html. The in-module switch is `surfaces.erp_module` in
      `portal/config/feature-flags.yaml`, read fail-closed by
      `portal/server/config_flags.py`. It adds no service, no terraform resource
      and no deploy target: the code ships inside the existing portal. Nothing
      the views render is re-derived — the family vocabulary, each family's
      states and legal moves and the fields a form offers are read from ERP-06's
      served contract, documents are ERP-06's own answers, and the
      authorization decision stays ERP-08's.

  erp_webhooks_bridge:
    default: off
    promoted: false
    posture: hold
    phase: 7
    tf_flag: enable_erp_webhooks_bridge
    description: >
      CRM→ERPNext webhook bridge (issue #671, EPIC #665): the conversion-event
      bridges in integrations/erp/webhooks/ (bridge.py, hooks.py) that post CRM
      conversion events directly to ERPNext accounting modules. The in-module
      switch is FLAG_ID "erp-webhooks-bridge" in
      integrations/erp/webhooks/flags.py, read fail-closed by flags.is_enabled().
      No separate process and no terraform resource: the code ships inside the
      existing ERP module, and the variable is the switch, not a resource count.
      OFF until a reviewed go-live promotes it.

  # The fleet-cron container pair on the shared-services on-prem HA cluster
  # (issue #900, EPIC #706, lane L5 #884): 2 replicas, active-active, on
  # nodes 192.168.168.31 / .42. Own `tf_flag` (not any of the seven
  # canonical control-plane services) since it deploys to shared-services'
  # cluster, not a control-plane Cloud Run surface.
  fleet_cron:
    default: off
    promoted: false
    promotion_issue: "#706"
    phase: 7
    tf_flag: enable_fleet_cron
    description: >
      Fleet-cron container pair on the shared-services on-prem HA cluster
      (issue #900; parent EPIC #706 "port the fleet's cron automation into a
      shared-services container"; lane L5 #884). 2 replicas, active-active,
      arbitrated by the same KeyDB `scheduler:lock:<job-id>` SETNX scheme
      documented in shared-services/docker/cronrunner/README.md. Terraform
      module: infra/terraform/modules/fleet-cron. OFF until #706's dual-run
      and cutover phases promote it.

# Endpoint-level surfaces: a single endpoint family inside a service that is
# promoted independently of the service flag around it (the service flag alone
# is not enough — GR-5: a new surface ships OFF until a reviewed go-live).
# `portal/server/fleet.py` reads this section and refuses every route while the
# surface's `default` is `off`, so the gate is code-enforced, not advisory.
surfaces:
  fleet_projection:
    default: off
    promoted: false
    posture: hold
    service: portal
    tf_flag: enable_portal
    description: >
      Web single-pane-of-glass (issue #331): read-only projection of
      fleet/console.py snapshot() served at GET /api/fleet/snapshot, the
      push channel GET /api/fleet/stream (SSE), and the history endpoint
      GET /api/fleet/events. Offline (no tmux, no TTY, no network egress).
  edge_cutover:
    default: off
    promoted: false
    posture: hold
    service: portal
    tf_flag: enable_portal
    description: >
      Edge fronting for ai.purebliss.app (issue #731, deferred by PR #926 to
      this lane per docs/EDGE-CUTOVER.md §8): the retirement of the GCP edge
      route as code (create_gcp_edge_route defaults false) in favor of the
      Cloudflare tunnel to the shared-services run half. Registered here so
      the surface is promotable through the ordered go-live ladder; the
      run-half tunnel/DNS/ingress itself stays outside this repo
      (docs/EDGE-CUTOVER.md §7). scripts/check-edge-cutover.sh is the
      dedicated gate.
  portal_surfaces:
    default: off
    promoted: false
    posture: hold
    service: portal
    tf_flag: enable_portal
    description: >
      Settings→Modules surface feed (issue #350): the serving layer's read-only
      projection of the CMR fleet-surface catalog (kushin77/CMR
      catalog/portal-surfaces.json; the pinned revision and the upstream blob's
      sha256 are recorded in registry/portal-surfaces.pinned.json) served at
      GET /api/portal/surfaces. Offline: the pinned document is on disk, so the
      route needs no network egress. Unblocks the shell's Settings→Modules page,
      which had nothing to render while kushin77/CMR#708 was open.
  finops_reports:
    default: off
    promoted: false
    posture: hold
    service: portal
    tf_flag: enable_portal
    description: >
      FinOps single-pane reports (issue #341): live per-tenant and per-agent
      cost/budget/usage from telemetry/metering + telemetry/budgets, with
      pricing-tier cost_details, soft vs hard cap semantics, spend alerts on
      warning/alert thresholds and an honest NO_DATA path. Served read-only at
      GET /api/finops/overview, GET /api/finops/report?tenant=<id> and
      GET /api/finops/alerts. Offline (no network egress).
  telemetry_live_feed:
    default: off
    promoted: false
    posture: hold
    service: portal
    tf_flag: enable_portal
    description: >
      Live telemetry event feed (issue #345): SSE push of the platform's own
      per-dispatch call records (model, provider, latency, tokens, status,
      estimated cost) and guardrail verdicts as they land in the live
      telemetry stores, plus GET /api/telemetry/recent for hydration. Honest
      NO_DATA handling (an absent or empty store is never reported as "no
      traffic"); verdicts are attached to a call only on an exact identifier
      match. Offline (reads local JSONL only; no network egress).
  ops_health:
    default: off
    promoted: false
    posture: hold
    service: portal
    tf_flag: enable_portal
    description: >
      Ops/health/SLO surface (issue #342): live per-tenant and per-agent
      health from the telemetry/observability span feed — SLO verdicts from
      slo_templates/*, breach alerts and the alert severity state machine
      (OK / WARNING / ALERT / NO_DATA / PAUSED, with breach and recovery
      transitions), latency/error-rate/token figures and the observability
      dashboard projection. Served read-only at GET /api/ops/overview,
      GET /api/ops/agents?tenant=<id>, GET /api/ops/slos?tenant=<id>,
      GET /api/ops/alerts and GET /api/ops/dashboard. Offline (no network
      egress).
  live_bridge:
    default: off
    promoted: false
    promotion_issue: "#1523"
    service: portal
    tf_flag: enable_portal
    description: >
      Versioned live-data bridge (issue #339): the platform's four state
      families — registry (the live AgentProfile seeds), gateway (the proxy
      routing contract + provider catalog), telemetry (the live telemetry tail
      plus the delegated /api/finops and /api/ops surfaces) and guardrails (the
      policy controls catalog) — under one versioned, authenticated read
      contract `ao.bridge/v1` at GET /api/v1/bridge (manifest),
      GET /api/v1/bridge/<family> (read) and GET /api/v1/bridge/stream (SSE
      change signal). Delegates to the existing family surfaces; adds no second
      projection. Offline (reads local artifacts/stores only; no network
      egress).
  telemetry_exposition:
    default: off
    promoted: false
    posture: hold
    service: telemetry
    tf_flag: enable_telemetry
    description: >
      Telemetry exposition (issue #497, ADR-0022): the flag-gated-OFF OTLP/HTTP
      **push** exporter that renders the telemetry pillar's own facts — the
      per-tenant SLO verdicts from slo_templates/* (imported verbatim from
      telemetry/observability/slos.py), the BudgetStateExporter budget/quota/
      audit state and the metering usage aggregate — and pushes them to the
      endpoint the fleet monitoring plane names. Not a scrape endpoint: ADR-0022
      fixes push as the transport because this control plane is a Cloud Run v2
      service (ephemeral, scales to zero, no pod, no ServiceMonitor), so this
      surface ships no HTTP route, no /metrics and no bound port. The endpoint,
      credentials and interval come from the environment only (GR-6) and default
      to nothing, so the exporter is inert — no render, no push, no fabricated
      healthy signal — until both this flag and an endpoint are configured. The
      label set is closed and bounded to
      {service, slo_kind, slo_id, verdict, tenant}.
  fleet_health_export:
    default: off
    promoted: false
    posture: hold
    service: control-plane
    description: >
      Fleet-health push exporter (issue #498, ADR-0022): rung state + beat age,
      reconciliation outcomes (reclaimed/parked/shelved/suspect), watchdog
      capability verdicts. Closed label set only. Inert when unconfigured.
  chat:
    default: off
    promoted: false
    posture: hold
    service: portal
    tf_flag: enable_chat
    description: >
      Conversational surface (issue #503, ADR-0023): the
      OpenAI-/Ollama-compatible endpoints `gateway/chat` serves —
      POST /v1/chat/completions (JSON + SSE), POST /api/chat (JSON + NDJSON) and
      GET /v1/models — for the chat experience in the single pane of glass. The
      flag is checked BEFORE AuthN, so while it is off the whole family (and the
      model list) answers 404 feature_disabled: an unpromoted surface is absent,
      not merely unauthorised (the live_bridge precedent). The surface has its
      OWN tf_flag (`enable_chat`) rather than the portal's or the gateway's, so
      promotion and the kill switch are independent of both; `service: portal`
      records whose experience it belongs to. Every turn is one dispatch through
      gateway/proxy, so routing, caps, budgets, DLP, metering and the ledger are
      inherited rather than re-implemented. Offline in tests: provider traffic
      goes through the proxy's scriptable transport rig.
  remote_control:
    default: off
    promoted: false
    posture: hold
    service: portal
    tf_flag: enable_portal
    description: >
      Remote control API (issue #554, RC-3 of EPIC #551; ADR-0025 D1.1): the
      operator→fleet command channel, `POST /api/control/<family>/<action>` on
      the existing console app — one route family, no second listener and no
      second service. Every verb is consumed from RC-2's closed declaration
      (`control-plane/control/verbs.yaml`), and each command is delivered by
      running the local lever that declaration names (`fleet/control.py`,
      `fleet/channel.py`, and the governance dispatch/reconcile/lifecycle CLIs);
      the API re-implements no control action and holds no verb list of its own.
      The caller is the existing console session (`os-session-token`) and the
      capability is RC-2's declared `capability` evaluated through the
      `identity/rbac` two gates (scope, then permission) at the fleet's own org,
      so the path adds no second identity and no second policy engine. The flag
      is checked BEFORE AuthN: while it is off the whole family answers 404
      `feature_disabled`, because an unpromoted surface is absent rather than
      merely unauthorised (the `live_bridge` and `chat` precedent).
  cockpit:
    default: off
    promoted: false
    posture: hold
    service: portal
    tf_flag: enable_portal
    description: >
      The terminal cockpit (AgentConsole, issue #566, RC-11 of EPIC #551; ADR-0026): the
      operator client of the RC-3 control API and the
      two authenticated SSE streams (fleet_projection, telemetry_live_feed).
      A keyboard-first, role-tiered terminal client that renders only what the
      declared cockpit function registry (control-plane/functions/
      functions.yaml, RC-10) declares, commands through the RC-5 client half,
      holds no credential of its own and writes no fleet state. Ships OFF: while
      the flag is off the client refuses to start with the named FLAG_OFF
      condition, and every panel whose own surface flag is off renders the
      disabled condition naming that flag.
  remote_ssh_access:
    default: off
    promoted: false
    posture: hold
    service: control-plane
    description: >
      Remote operator SSH route (issues #771, #785): provision a Cloudflare
      Tunnel (find-or-create, fail-closed), publish one hostname that reaches
      the host's sshd through it, and deploy the cloudflared connector — with a
      Cloudflare Access self-hosted application and allow-policy in front of the
      hostname, so an operator with no shell on the box reaches it without
      opening port 22 to the internet. The declaration covers the ROUTE, not a
      listener in this repo: `infra/cloudflare/ao-ssh-access.sh` drives the whole
      flow (provision, publish, connector), is dry-run by default, and refuses
      `--apply` while this flag is off, so nothing is applied before a reviewed
      go-live (GR-5). Account, zone, tunnel, connector hosts and the email
      allowlist come from the environment (a missing one is refused by name
      rather than defaulted) and the API token from the environment or GCP
      Secret Manager only, with the connector's tunnel token from the
      environment sourced by the operator from Vault or Secret Manager (GR-6).
      This is the transport half of the operator-access gap: reaching the fleet
      console still needs the auth-gate JWKS mirror (#763 / #730).

  # --- Workbook surfaces (issue #644, workbook-13) ------------------------
  #
  # Each of the five workbook surfaces is declared here as well as under
  # `services`, because both statements are true and neither is redundant:
  # `services` says *who owns the promotion* (its own `enable_*`, the flag the
  # rollout pipeline and the apply pipeline carry) while `surfaces` says *what
  # is gated* (the endpoint family, route set or switch a reader will meet in
  # the code). `service:` records the deployable the code ships inside — the
  # same shape `surfaces.chat` uses. Every entry defaults OFF (GR-5), and each
  # names the in-module reader that actually refuses the surface, so the flag is
  # code-enforced rather than advisory.
  org_chart:
    default: off
    promoted: false
    promotion_issue: "#1521"
    service: portal
    tf_flag: enable_org_chart
    description: >
      Org-chart view (issue #644, workbook-13; surface code added by issue
      #642). Routes GET /api/orgchart/chart and GET /api/orgchart/health,
      served by `portal/server/org_chart.py`. Fail-closed reader:
      `portal/server/config_flags.py` over
      `portal/config/feature-flags.yaml` — a missing or unreadable file reads as
      OFF, so an unpromoted view is absent, never a half-rendered page. Own
      `tf_flag`, so promoting the org chart neither implies nor requires
      promoting the other two views or the portal service around them.
  skill_studio:
    default: off
    promoted: false
    promotion_issue: "#1521"
    service: portal
    tf_flag: enable_skill_studio
    description: >
      Skill-studio view (issue #644, workbook-13; surface code added by issue
      #642). Routes GET /api/skillstudio/skills,
      GET /api/skillstudio/skills/<id> and
      POST /api/skillstudio/author|test|publish, served by
      `portal/server/skill_studio.py`. Fail-closed reader:
      `portal/server/config_flags.py`. While off, the author/test/publish
      workflow is unreachable — and the studio's own gate (no publish without
      green eval evidence) is what refuses a bad publish once it is on.
  task_board:
    default: off
    promoted: false
    promotion_issue: "#1522"
    service: portal
    tf_flag: enable_task_board
    description: >
      Tenant task board (issue #644, workbook-13; surface code added by issue
      #642). Routes GET /api/taskboard/tickets and
      GET /api/taskboard/tickets/<id>, served by `portal/server/task_board.py`
      as a read-only projection of the durable ticket event log (a ticket the
      log does not contain is absent, never invented). Fail-closed reader:
      `portal/server/config_flags.py`.
  mcp_outbound:
    default: off
    promoted: false
    posture: hold
    service: gateway
    tf_flag: enable_mcp_outbound
    description: >
      Outbound MCP server calls (issue #644, workbook-13; surface code added by
      issue #641). Not an HTTP route: the egress family of
      `gateway/mcp/outbound.py`, whose three conditions must all hold before a
      remote server is dialled (this deployment flag, the server entry's own
      `enabled`, and the caller's declared capability). Fail-closed reader:
      `env_outbound_enabled()` in `gateway/mcp/outbound.py`, which treats an
      absent, empty or unrecognised `AO_MCP_OUTBOUND_ENABLED` as OFF. While off,
      every server reports `disabled` and nothing is dialled.
  sandbox_runtime:
    default: off
    promoted: false
    posture: hold
    service: guardrails
    tf_flag: enable_sandbox_runtime
    description: >
      Sandbox runtime enablement (issue #644, workbook-13; surface code added by
      issue #636). Not an endpoint: the declared switch over
      `guardrails/sandbox/enablement.py`, gating whether a real runtime (docker
      / firecracker) may run instead of the offline seam. Fail-closed reader:
      ``SandboxEnablement`` itself — OFF is structural (constructing the flag
      with ``enabled=True`` is refused) and only ``enable()`` flips it, so a
      deployment cannot accidentally start with a live sandbox. Own `tf_flag`
      rather than `enable_guardrails`: the kill switch for tool execution is
      independent of the guardrails service flag.
  operator_terminal:
    default: off
    promoted: false
    posture: hold
    service: portal
    tf_flag: enable_portal
    description: >
      The AgentConsole (issue #774): the browser IT-terminal behind the
      existing SSO session — one link, `GET /console`, that opens the live fleet
      projection (rungs, heartbeat health, board/focus/pool/claims, directives in
      flight) and a steer panel of the closed control-verb vocabulary. It invents
      no login, no second projection and no second control path: the read half is
      the existing `GET /api/fleet/*` projection (surfaces.fleet_projection) and
      the write half is the existing `POST /api/control/*` control family
      (surfaces.remote_control), each consumed over the caller's own
      `os-session-token` with the effect-class/capability check the registry
      declares. The flag is checked BEFORE AuthN, so while it is off `/console`
      and its view answer 404 `feature_disabled` — an unpromoted surface is
      absent, not merely unauthorised (the `chat` / `live_bridge` precedent). A
      steer action is refused without the required capability and every allowed
      action lands on the existing audit rail. Promotion = a reviewed go-live
      that flips this flag (and independently promotes `fleet_projection` and
      `remote_control` for the two halves it composes), runs `make verify` +
      `terraform plan`, then applies via the deployer SA.
  erp_module:
    default: off
    promoted: false
    posture: hold
    service: portal
    tf_flag: enable_erp_module
    description: >
      ERP module portal surface (ERP-07, issue #652). Routes
      GET /api/erp/module, GET /api/erp/dashboard, GET /api/erp/reports[<id>],
      the proxy of ERP-06's own routes under /api/erp/, and the module's frame
      and script at /erp/module.html and /erp/module.js — all served by
      `portal/server/erp.py`. Fail-closed reader:
      `portal/server/config_flags.py` over `portal/config/feature-flags.yaml`,
      so a missing, unreadable or malformed declaration reads as OFF rather than
      serving a half-rendered module. The gate is checked BEFORE AuthN for the
      API family and for the module's documents alike, so while it is off the
      whole surface is *absent* — 404 `feature_disabled` rather than 401 — which
      is what stops a probe enumerating a module that does not exist yet. Own
      `tf_flag` rather than `enable_portal`: the module is independently
      promotable and independently killable.

