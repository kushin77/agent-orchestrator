# Feature-flag registry — agent-orchestrator control plane
#
# The declarative record that every control-plane surface (service, endpoint,
# CI/CD trigger) ships **OFF** until a reviewed go-live promotes it (IaC
# mandate / flag-gated OFF default). Nothing in this repo is tenant-visible or
# applied while its flag is off.
#
# scripts/check-feature-flags.py enforces this file mechanically and keeps it
# in lock-step with infra/terraform/variables.tf (every `enable_*` flag must
# default to `false`). A new surface cannot ship on by accident.

schema_version: 1

# New entries MUST default to "off". A check fails if any entry defaults on.
default_policy: off

description: >
  Each control-plane service and CI/CD trigger is declared here with its
  promotion state. Promotion = a reviewed go-live that flips the flag, runs
  `make verify` + `terraform plan`, then applies via the deployer SA through
  the flag-gated Cloud Build apply pipeline — never the console.

# The ONLY apply route. No console path is acceptable.
apply_path:
  only: flag-gated automated apply (deployer SA via Cloud Build)
  trigger: infra/cloudbuild/apply-trigger.yaml
  deployer_module: infra/terraform/modules/deployer-sa
  build_config: infra/cloudbuild/apply.yaml

# CI/CD trigger flags (all OFF until promoted).
ci_cd:
  verify_trigger:
    default: off
    description: PR verify trigger runs `make verify` as a code-native CI status.
  apply_trigger:
    default: off
    description: Flag-gated terraform apply trigger; the only apply route.

# Per-service promotion state. `tf_flag` maps to the matching variable in
# infra/terraform/variables.tf (all default false).
services:
  registry:
    default: off
    promoted: false
    phase: 1
    tf_flag: enable_registry
    description: Agent Registry & Profiling.
  gateway:
    default: off
    promoted: false
    phase: 2
    tf_flag: enable_gateway
    description: Model Gateways (multi-provider proxy/router).
  engine:
    default: off
    promoted: false
    phase: 3
    tf_flag: enable_engine
    description: State-machine execution engine.
  guardrails:
    default: off
    promoted: false
    phase: 4
    tf_flag: enable_guardrails
    description: Security & guardrails (DLP, prompt-injection defense, budgets).
  telemetry:
    default: off
    promoted: false
    phase: 5
    tf_flag: enable_telemetry
    description: Observability, audit, FinOps metering.
  identity:
    default: off
    promoted: false
    phase: 6
    tf_flag: enable_identity
    description: Tenant identity / RBAC.
  portal:
    default: off
    promoted: false
    phase: 7
    tf_flag: enable_portal
    description: Admin control-plane portal.
  web:
    default: off
    promoted: false
    phase: 7
    tf_flag: enable_web
    description: Public web surface (portal + shared-frontend) served at ai.purebliss.app.

# Endpoint-level surfaces: a single endpoint family inside a service that is
# promoted independently of the service flag around it (the service flag alone
# is not enough — GR-5: a new surface ships OFF until a reviewed go-live).
# `portal/server/fleet.py` reads this section and refuses every route while the
# surface's `default` is `off`, so the gate is code-enforced, not advisory.
surfaces:
  fleet_projection:
    default: off
    promoted: false
    service: portal
    tf_flag: enable_portal
    description: >
      Web single-pane-of-glass (issue #331): read-only projection of
      fleet/console.py snapshot() served at GET /api/fleet/snapshot, the
      push channel GET /api/fleet/stream (SSE), and the history endpoint
      GET /api/fleet/events. Offline (no tmux, no TTY, no network egress).
  portal_surfaces:
    default: off
    promoted: false
    service: portal
    tf_flag: enable_portal
    description: >
      Settings→Modules surface feed (issue #350): the serving layer's read-only
      projection of the CMR fleet-surface catalog (kushin77/CMR
      catalog/portal-surfaces.json; the pinned revision and the upstream blob's
      sha256 are recorded in registry/portal-surfaces.pinned.json) served at
      GET /api/portal/surfaces. Offline: the pinned document is on disk, so the
      route needs no network egress. Unblocks the shell's Settings→Modules page,
      which had nothing to render while kushin77/CMR#708 was open.
  finops_reports:
    default: off
    promoted: false
    service: portal
    tf_flag: enable_portal
    description: >
      FinOps single-pane reports (issue #341): live per-tenant and per-agent
      cost/budget/usage from telemetry/metering + telemetry/budgets, with
      pricing-tier cost_details, soft vs hard cap semantics, spend alerts on
      warning/alert thresholds and an honest NO_DATA path. Served read-only at
      GET /api/finops/overview, GET /api/finops/report?tenant=<id> and
      GET /api/finops/alerts. Offline (no network egress).
  telemetry_live_feed:
    default: off
    promoted: false
    service: portal
    tf_flag: enable_portal
    description: >
      Live telemetry event feed (issue #345): SSE push of the platform's own
      per-dispatch call records (model, provider, latency, tokens, status,
      estimated cost) and guardrail verdicts as they land in the live
      telemetry stores, plus GET /api/telemetry/recent for hydration. Honest
      NO_DATA handling (an absent or empty store is never reported as "no
      traffic"); verdicts are attached to a call only on an exact identifier
      match. Offline (reads local JSONL only; no network egress).
  ops_health:
    default: off
    promoted: false
    service: portal
    tf_flag: enable_portal
    description: >
      Ops/health/SLO surface (issue #342): live per-tenant and per-agent
      health from the telemetry/observability span feed — SLO verdicts from
      slo_templates/*, breach alerts and the alert severity state machine
      (OK / WARNING / ALERT / NO_DATA / PAUSED, with breach and recovery
      transitions), latency/error-rate/token figures and the observability
      dashboard projection. Served read-only at GET /api/ops/overview,
      GET /api/ops/agents?tenant=<id>, GET /api/ops/slos?tenant=<id>,
      GET /api/ops/alerts and GET /api/ops/dashboard. Offline (no network
      egress).
  live_bridge:
    default: off
    promoted: false
    service: portal
    tf_flag: enable_portal
    description: >
      Versioned live-data bridge (issue #339): the platform's four state
      families — registry (the live AgentProfile seeds), gateway (the proxy
      routing contract + provider catalog), telemetry (the live telemetry tail
      plus the delegated /api/finops and /api/ops surfaces) and guardrails (the
      policy controls catalog) — under one versioned, authenticated read
      contract `ao.bridge/v1` at GET /api/v1/bridge (manifest),
      GET /api/v1/bridge/<family> (read) and GET /api/v1/bridge/stream (SSE
      change signal). Delegates to the existing family surfaces; adds no second
      projection. Offline (reads local artifacts/stores only; no network
      egress).

