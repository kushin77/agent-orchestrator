# telemetry/metering rate card — Anthropic (Claude)
#
# POINT-IN-TIME USD list prices per 1,000,000 tokens (input/output split),
# for COST ESTIMATION ONLY — not live pricing, not customer billing.
# Providers change prices without notice; re-verify before relying on this.
#
# Provenance (issue #894 review): the PR's first pass cited the bundled
# claude-api skill's cached pricing table, but that table lives in the
# harness's skill cache, NOT in this git checkout — there is no
# claude-api skill reference file under this repo to cite a path for, so
# per review it is NOT used as a source here. Reverted to this rate card's
# PREVIOUS price figures (unchanged since before issue #894), carried over
# onto the new model ids (config.py / issue #894 renamed
# claude-haiku-4-5 -> claude-haiku-4-5-20251001,
# claude-sonnet-4-5 -> claude-sonnet-5, claude-opus-4-5 -> claude-opus-5):
# - claude-haiku-4-5-20251001 and claude-sonnet-5 rates are the values this
#   file already carried for claude-haiku-4-5 / claude-sonnet-4-5, adapted
#   verbatim from capital-underwriting apps/server/src/lib/aiCostRates.ts
#   (point-in-time sourced 2026-08-27).
# - claude-opus-5 is the same Opus-class point-in-time ESTIMATE this file
#   already carried for claude-opus-4-5 ($15/$75 per 1M, the Opus 4/4.1
#   list shape); verify against platform.claude.com pricing.
# claude-fable-5-1 is NOT listed: it is a new model id (issue #894 added it
# to config.py as a supported, opt-in tenant-pin model) with no prior rate
# in this file and no in-checkout source to price it from — add a row once
# one is sourced, rather than invent a number.
schemaVersion: 1
provider: anthropic
note: "Anthropic Claude, USD per 1M tokens. Point-in-time 2026-09 (unchanged from pre-#894; re-verify)."
models:
  claude-haiku-4-5-20251001:
    standard:
      inputUsdPerMillion: 1.00
      outputUsdPerMillion: 5.00
  claude-sonnet-5:
    standard:
      inputUsdPerMillion: 3.00
      outputUsdPerMillion: 15.00
  claude-opus-5:
    standard:
      inputUsdPerMillion: 15.00
      outputUsdPerMillion: 75.00
