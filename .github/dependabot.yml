# Dependabot configuration — agent-orchestrator
#
# Governed-repo dependency automation (hub GR-9/GR-13, conformance `dependabot`
# signal). Kept simple: weekly grouped updates for the Python dependency
# surface. GR-15 bans GitHub Actions workflows in this repo (enforced by
# `scripts/check-no-actions.sh`, issue #812) and there is no GitHub Actions
# surface to update — the `github-actions` ecosystem block was a stale
# holdover from before that doctrine was ratified and named no real workflow
# file, so it is retired here (issue #1073). The repo's automation is
# code-native (`make verify`); dependabot PRs land via the normal PR gate on
# `master` and are never auto-merged.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
