# Dependabot configuration for CMR (CMR-1103: GHAS deep — Dependabot version
# updates; CMR-105 already keeps security updates on).
#
# harvested_from: kushin77/github-workflow@.github/dependabot.yml (convention)
#                 kushin77/ERP-CRM@.github/dependabot.yml (version-updates +
#                 grouped-PR convention), per the CMR-1103 epic "Canibalize".
#
# Dependabot version updates are NOT GitHub Actions — they run natively in
# GitHub, so GR-15 (code-native automation only) and ADR-0011 (Actions stays
# disabled) do not apply. Nothing here auto-merges: every Dependabot PR is
# reviewable and merged by a human (NG2). Security updates always arrive as
# separate, reviewable PRs — `groups` below applies to version updates only.
#
# CMR ships no application code (NG4), so `updates` is empty by design — the
# version-updates blocks stay commented/harmless here. They are the canonical
# polyglot template for governed repos: uncomment the ecosystems that match
# the repo and set `directory`. The ACTIVE template for code-hosting governed
# repos is infra/terraform/github/modules/ghas/files/dependabot.yml
# (distributed by the ghas Terraform submodule, flag-gated OFF — see its
# README); templates/module/.github/dependabot.yml keeps the scaffolder
# variant.
version: 2
updates: []

