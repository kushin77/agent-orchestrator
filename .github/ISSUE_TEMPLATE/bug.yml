# ---knowledge---
# module_id: github.issue-template.bug
# system: governance
# app: board
# solution_class: pattern
# patterns: [issue-first, structured-defect-report]
# derives_from: scripts/check-issue-template.sh
# owner_sme: pmo-sme
# tier: L0
# interfaces: [the bug issue body fields]
# invariants: "required fields capture reproduction, severity, root cause, lifecycle ownership and escalation"
# gotchas: "YAML comments are ignored by GitHub's issue-form renderer"
# related: ["#622", "#1533"]
# do_not_duplicate: null
# ---knowledge---
name: Bug
description: Something behaved incorrectly. Per GR-2, file it even if already fixed — the failure mode becomes searchable.
title: "Bug: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        <!-- cmr-refs: {"id":"...","module":"...","links":[{"type":"...","target":"owner/repo#n"}]} -->
        _Fill the `cmr-refs` marker above with this entity's typed links (see `docs/CROSS-REFERENCE-LAYER.md`). It is machine-readable, not prose._

  - type: markdown
    attributes:
      value: |
        File this **even when the fix landed in the same change** (GR-2). The value
        is not the fix — it is that the failure mode becomes searchable. Anchor the
        report to mechanism, not prose. Labels follow `board/LABELS.md`.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction command
      description: Minimal runnable steps that reproduce the defect and capture its real output.
      placeholder: |
        1. Run: ...
        2. Observe: ...
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Triage severity from the canonical defect vocabulary.
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true
  - type: input
    id: rca
    attributes:
      label: RCA ledger reference
      description: Link or identifier for the root-cause record under governance/lessons/.
      placeholder: governance/lessons/<record>.md
    validations:
      required: true
  - type: input
    id: parent_epic
    attributes:
      label: Parent epic
      description: Owning epic issue number, or N/A when this defect is standalone.
    validations:
      required: true
  - type: dropdown
    id: model_tier
    attributes:
      label: Execution tier
      description: Lowest suitable execution tier from the lifecycle contract.
      options:
        - L0
        - L1
        - L2
    validations:
      required: true
  - type: textarea
    id: root_cause
    attributes:
      label: Root cause
      description: Mechanism that produced the observed failure.
    validations:
      required: true
  - type: checkboxes
    id: lifecycle_contract
    attributes:
      label: Lifecycle contract
      description: Acknowledge the evidence and verify requirements before closure.
      options:
        - label: I will verify the fix and record evidence before closing this issue.
    validations:
      required: true
  - type: textarea
    id: escalation
    attributes:
      label: Escalation
      description: Owner, approval, or blocker requiring escalation if the contract cannot be met.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: The wrong behaviour, with the actual output.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, minimal, runnable. Include the repo/path and commands.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, with the real output/exit code.
    validations:
      required: true
  - type: textarea
    id: mechanism
    attributes:
      label: Why it was wrong
      description: The mechanism, not the symptom. What in the code produced this?
    validations:
      required: false
  - type: textarea
    id: blast
    attributes:
      label: Blast radius
      description: What would have happened had it not been caught. Be concrete.
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority (priority:*)
      description: Board priority.
      options:
        - priority:P0
        - priority:P1
        - priority:P2
        - priority:P3
      default: 2
    validations:
      required: true
  - type: checkboxes
    id: area
    attributes:
      label: Areas affected (area:*)
      description: Select all that apply.
      options:
        - label: area:governance
        - label: area:template
        - label: area:registry
        - label: area:sync
        - label: area:guardrails
        - label: area:harvest
        - label: area:catalog
        - label: area:observability
        - label: area:security
        - label: area:docs
        - label: area:meta
  - type: checkboxes
    id: enterprise_close_checklist
    attributes:
      label: "Definition of Done — Enterprise Policy Close Checklist"
      description: >-
        Required before closing this issue if it carries area:governance or area:policy
        (GR-25, guardrails/instructions/enterprise-close-checklist.md). Check each box only
        with a concrete answer recorded in the issue thread, not left blank.
      options:
        - label: "Solution-class tier stated (template/class/pattern/enterprise/faang/elite) — docs/SOLUTION-CLASSES.md"
        - label: "IaC-backed status stated where applicable (cross-cutting mandate) — docs/SOLUTION-CLASSES.md"
        - label: "\"No human needed\" step-reduction impact stated (GR-22)"
        - label: "RCA written and linked if incident-class, else explicitly marked N/A — docs/RCA-TEMPLATE.md"
        - label: "SaaS/multi-tenant applicability noted, or explicitly marked N/A — docs/SAAS-BOUNDARY.md"
