name: Bug
description: Something behaved incorrectly. Per GR-2, file it even if already fixed — the failure mode becomes searchable.
title: "Bug: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        <!-- cmr-refs: {"id":"...","module":"...","links":[{"type":"...","target":"owner/repo#n"}]} -->
        _Fill the `cmr-refs` marker above with this entity's typed links (see `docs/CROSS-REFERENCE-LAYER.md`). It is machine-readable, not prose._

  - type: markdown
    attributes:
      value: |
        File this **even when the fix landed in the same change** (GR-2). The value
        is not the fix — it is that the failure mode becomes searchable. Anchor the
        report to mechanism, not prose. Labels follow `board/LABELS.md`.
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: The wrong behaviour, with the actual output.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered, minimal, runnable. Include the repo and path. Include the commands.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, with the real output/exit code.
    validations:
      required: true
  - type: textarea
    id: mechanism
    attributes:
      label: Why it was wrong
      description: The mechanism, not the symptom. What in the code produced this?
    validations:
      required: false
  - type: textarea
    id: blast
    attributes:
      label: Blast radius
      description: What would have happened had it not been caught. Be concrete.
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority (priority:*)
      description: Board priority.
      options:
        - priority:P0
        - priority:P1
        - priority:P2
        - priority:P3
      default: 2
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How serious the defect is. Each option maps to a triage action in `guardrails/isolation/model.py`. Do not add a rung.
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true
  - type: input
    id: parent_epic
    attributes:
      label: Parent epic
      description: "The epic this defect belongs to. Write a bare reference (e.g. #1510)."
      placeholder: "#1510"
    validations:
      required: true
  - type: dropdown
    id: model_tier
    attributes:
      label: Model tier
      description: The tier this work starts at on the escalation ladder. The options are L0, L1 and L2. This is NOT the FinOps executor tier (`model-tier`). The two vocabularies are separate.
      options:
        - L0
        - L1
        - L2
    validations:
      required: true
  - type: textarea
    id: root_cause
    attributes:
      label: Root cause
      description: The symptom, the mechanism (name the file and the line), the governance gap that let it through, and what would have caught it earlier. Write `RCA required, Step 1` when the cause is not yet known.
      value: |
        **Symptom:**
        **Mechanism:** `<file>:<line>`
        **Governance gap:**
        **Earlier catch:**
      render: text
    validations:
      required: true
  - type: textarea
    id: rca
    attributes:
      label: RCA record
      description: The link to the root-cause record in `governance/lessons/` that this defect feeds. Write the path or the RCA issue number. Write `N/A` only when the defect is not incident-class.
      placeholder: "governance/lessons/<record>.md or #<rca-issue>"
      render: text
    validations:
      required: true
  - type: checkboxes
    id: lifecycle_contract
    attributes:
      label: Lifecycle contract
      description: Acknowledge the closure contract before filing. `governance/lifecycle/cli.py close` drives these invariants.
      options:
        - label: "I will close this only via a merged PR with `Closes #n` plus acceptance and negative-control evidence, own it to closure, and use the escalation protocol for handoff."
          required: true
    validations:
      required: true
  - type: textarea
    id: escalation
    attributes:
      label: Escalation
      description: The sanctioned handoff path. Make 3 attempts at the stated tier. Then write a comment that names the exact failure, add an `escalate:L1` or `escalate:L2` label, and stop. Silent abandonment is not a handoff.
      value: |
        N = 3 attempts at <tier>.
        Then — a comment naming the exact failure, the `escalate:<L1|L2>` label, and stop.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: area
    attributes:
      label: Areas affected (area:*)
      description: Select all that apply.
      options:
        - label: area:governance
        - label: area:template
        - label: area:registry
        - label: area:sync
        - label: area:guardrails
        - label: area:harvest
        - label: area:catalog
        - label: area:observability
        - label: area:security
        - label: area:docs
        - label: area:meta
  - type: checkboxes
    id: enterprise_close_checklist
    attributes:
      label: "Definition of Done — Enterprise Policy Close Checklist"
      description: >-
        Required before closing this issue if it carries area:governance or area:policy
        (GR-25, guardrails/instructions/enterprise-close-checklist.md). Check each box only
        with a concrete answer recorded in the issue thread, not left blank.
      options:
        - label: "Solution-class tier stated (template/class/pattern/enterprise/faang/elite) — docs/SOLUTION-CLASSES.md"
        - label: "IaC-backed status stated where applicable (cross-cutting mandate) — docs/SOLUTION-CLASSES.md"
        - label: "\"No human needed\" step-reduction impact stated (GR-22)"
        - label: "RCA written and linked if incident-class, else explicitly marked N/A — docs/RCA-TEMPLATE.md"
        - label: "SaaS/multi-tenant applicability noted, or explicitly marked N/A — docs/SAAS-BOUNDARY.md"
