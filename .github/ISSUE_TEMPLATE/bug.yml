# .github/ISSUE_TEMPLATE/bug.yml — the bug-report issue form (observed/expected/repro/RCA).
#
# ---knowledge---
# module_id: github.issue-template.bug
# system: governance
# app: board
# solution_class: pattern
# patterns: [issue-first]
# derives_from: null
# owner_sme: pmo-sme
# tier: L0
# interfaces: [the bug issue body fields]
# invariants: "severity and model_tier are closed dropdowns, not freeform"
# gotchas: "rca field points into governance/lessons/, not the PR body"
# related: ["#1913"]
# do_not_duplicate: null
# ---knowledge---
name: Bug report
description: Defect brief — observed vs expected, the reproduction command, the canonical severity, and the RCA that closes the loop back into governance/lessons/.
title: "[bug]"
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        **A defect that cannot be reproduced cannot be fixed.** State what you
        observed, what you expected, and the exact command that shows the
        difference — before any theory of the cause.

        Order the brief **GOAL -> constraints -> context**, then fill every
        required field. A defect is closed by a recorded lesson, not by a
        patch alone: the RCA link below is what stops the same defect from
        returning in another lane.

  - type: textarea
    id: observed
    attributes:
      label: Observed
      description: What actually happened, verbatim — real output pasted, never paraphrased. Name the surface and the commit or branch it was measured on.
      value: |
        <the real command output, pasted>
      render: console
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What the contract says should have happened, and the doc, gate or test that says so. A claim with no citation is an opinion.
      value: |
        <what should have happened, and the file or gate that requires it>
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction command
      description: The exact command(s) that show the defect — copy-pasteable, in order, with the real output they print. A defect that cannot be reproduced is not yet a defect.
      value: |
        ```bash
        <command>
        ```
      render: text
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: The canonical rung. critical and high auto-BLOCK the surface and are never downgraded; medium queues a named SME review before any change; low is recorded for observability. The vocabulary is harvested from the isolation triage model in guardrails/isolation/model.py, so an invented rung cannot be triaged.
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true

  - type: input
    id: rca
    attributes:
      label: RCA link (governance/lessons/)
      description: Where the root-cause analysis lands — governance/lessons/ (its template, its ledger and governance/lessons/rca/). Give the path or the ledger entry id. A defect closes when its lesson is recorded there, not when its patch merges.
      placeholder: governance/lessons/rca/<slug>.md
    validations:
      required: true

  - type: input
    id: parent_epic
    attributes:
      label: Parent epic
      description: "The epic this issue is a child of — the edge the dispatch chain resolves, written as a bare reference (e.g. #1510). The epic form omits this field, because an epic has no parent."
      placeholder: "#1510"
    validations:
      required: true

  - type: dropdown
    id: model_tier
    attributes:
      label: Model tier
      description: The tier this work starts at on the escalation ladder the briefs state as L0/L1/L2 — NOT the FinOps executor tier (`model-tier`, whose options are flash/pro/auditor) that the dispatcher reads. L0 is a mechanical change, L1 holds several constraints at once, L2 is genuinely hard reasoning, and security, secrets, auth or IaC work never starts below L1.
      options:
        - L0
        - L1
        - L2
    validations:
      required: true

  - type: textarea
    id: root_cause
    attributes:
      label: Root cause
      description: The symptom, the mechanism (name the file and the line), the governance gap that let it through, and what would have caught it earlier. Write `RCA required, Step 1` when the cause is not yet known — an honest Step 1 is worth more than an invented theory.
      value: |
        **Symptom:**
        **Mechanism:** `<file>:<line>`
        **Governance gap:**
        **Earlier catch:**
      render: text
    validations:
      required: true

  - type: checkboxes
    id: lifecycle_contract
    attributes:
      label: Lifecycle contract
      description: Acknowledge the closure contract before filing. `governance/lifecycle/cli.py close` drives these invariants, and the issue-template gate fails if this field is dropped from the form.
      options:
        - label: "I will close this only via a merged PR with `Closes #n` + acceptance/negative-control evidence, own it to closure, and use the Escalation protocol for handoff — never silent abandonment."
          required: true
    validations:
      required: true

  - type: textarea
    id: escalation
    attributes:
      label: Escalation
      description: The sanctioned handoff path. N = 3 attempts at the stated tier, then a comment naming the exact failure plus an `escalate:L1` / `escalate:L2` label, and stop. Silent abandonment is not a handoff.
      value: |
        N = 3 attempts at <tier>.
        Then — a comment naming the exact failure, the `escalate:<L1|L2>` label, and stop.
      render: text
    validations:
      required: true
