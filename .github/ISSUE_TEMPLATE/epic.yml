name: Epic
description: Issue brief for an epic — objective, measured landscape, the child lanes and the verification contract the epic closes on.
title: "[epic]"
labels: ["type:epic"]
body:
  - type: markdown
    attributes:
      value: |
        **GOAL first.** State the concrete objective and its success criteria
        before any constraints or context, so a subagent (or a session resuming
        after compaction) can act correctly from the first line alone.

        An epic is a **contract**, not a folder. It declares the landscape it
        measured, the child lanes that will change it, and the command whose
        real output closes it. The `EPIC #616` brief is the reference shape.

        One issue = one lane = one file-surface. Every child named below must
        own files no sibling owns, or the wave is refused before dispatch.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What this epic makes true, in measurable terms, and the gap it closes. Name the measured source of the gap.
      value: |
        Close the **<gap>** measured by issue #<n>: <what becomes true>.
      render: text
    validations:
      required: true

  - type: textarea
    id: measured-landscape
    attributes:
      label: Measured landscape
      description: One row per surface actually measured — the surface, the path that carries it, the enforcement in place today, and the verdict. A verdict without a measurement is a guess.
      value: |
        | Checklist item | Surface (measured) | Verdict |
        |---|---|---|
        | <item> | `<path>` (measured <date>) | **GAP** — <what is missing> |
      render: text
    validations:
      required: true

  - type: textarea
    id: children
    attributes:
      label: Children (one lane per file-surface)
      description: The child issues that close this epic, each with the files it owns and the command that proves it. No two children may share a file.
      value: |
        | # | Issue | Owned files | Verify |
        |---|---|---|---|
        | 1 | **#<n>** <title> | `<path>` | `<command>` |
      render: text
    validations:
      required: true

  - type: textarea
    id: verification-contract
    attributes:
      label: Verification contract
      description: How this epic closes — the evidence each child must carry, and the condition under which the epic itself may close.
      value: |
        Each child ships a `Verify:` command and closes only with its real
        output. This epic closes only when every declared child is closed with
        evidence.
      render: text
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: Purpose (faster / smarter / more accurate / consistent)
      description: Why this epic leaves the system faster, smarter, more accurate and more consistent — one line each, tied to a surface measured above.
      value: |
        - **Faster:**
        - **Smarter:**
        - **More accurate:**
        - **Consistent:**
      render: text
    validations:
      required: false

  # No `parent_epic` here: an epic is a chain head, so the field is the one
  # lifecycle field this form does not carry. The gate asserts that exemption by
  # name rather than accepting any near-shape (scripts/check-issue-template.sh).
  - type: dropdown
    id: model_tier
    attributes:
      label: Model tier
      description: The tier this work starts at on the escalation ladder the briefs state as L0/L1/L2 — NOT the FinOps executor tier (`model-tier`, whose options are flash/pro/auditor) that the dispatcher reads. An epic is planned before it is built, so this is the tier its child lanes start from unless a child states its own.
      options:
        - L0
        - L1
        - L2
    validations:
      required: true

  - type: textarea
    id: root_cause
    attributes:
      label: Root cause
      description: The symptom, the mechanism (name the file and the line), the governance gap that let it through, and what would have caught it earlier. Write `RCA required, Step 1` when the cause is not yet known — an honest Step 1 is worth more than an invented theory.
      value: |
        **Symptom:**
        **Mechanism:** `<file>:<line>`
        **Governance gap:**
        **Earlier catch:**
      render: text
    validations:
      required: true

  - type: checkboxes
    id: lifecycle_contract
    attributes:
      label: Lifecycle contract
      description: Acknowledge the closure contract before filing. `governance/lifecycle/cli.py close` drives these invariants, and the issue-template gate fails if this field is dropped from the form.
      options:
        - label: "I will close this only via a merged PR with `Closes #n` + acceptance/negative-control evidence, own it to closure, and use the Escalation protocol for handoff — never silent abandonment."
          required: true
    validations:
      required: true

  - type: textarea
    id: escalation
    attributes:
      label: Escalation
      description: The sanctioned handoff path. N = 3 attempts at the stated tier, then a comment naming the exact failure plus an `escalate:L1` / `escalate:L2` label, and stop. Silent abandonment is not a handoff.
      value: |
        N = 3 attempts at <tier>.
        Then — a comment naming the exact failure, the `escalate:<L1|L2>` label, and stop.
      render: text
    validations:
      required: true
