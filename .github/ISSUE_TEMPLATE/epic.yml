name: Epic
description: A large roadmap theme on the hub board, spanning many issues. Mirrors one board/epics/EPIC-*.md.
title: "Epic: "
labels: ["type:epic"]
body:
  - type: markdown
    attributes:
      value: |
        <!-- cmr-refs: {"id":"...","module":"...","links":[{"type":"...","target":"owner/repo#n"}]} -->
        _Fill the `cmr-refs` marker above with this entity's typed links (see `docs/CROSS-REFERENCE-LAYER.md`). It is machine-readable, not prose._

  - type: markdown
    attributes:
      value: |
        Epics mirror `board/epics/EPIC-*.md` and materialize to the board via
        `board/materialize.sh`. Use the namespaced labels from `board/LABELS.md`
        so the board stays machine-readable.
  - type: dropdown
    id: solution_class
    attributes:
      label: Target solution class
      description: >-
        Quality bar this epic aims for, per docs/SOLUTION-CLASSES.md (higher =
        more rigor/cost). Mirrored in fleet/MANIFEST.tsv's `class` column;
        `pattern`+ triggers the completion RCA in docs/RCA-TEMPLATE.md.
      options:
        - template
        - class
        - pattern
        - enterprise
        - faang
        - elite
      default: 2
    validations:
      required: true
  - type: textarea
    id: ai_execution_note
    attributes:
      label: AI-agent execution note (edit only if this epic's bar differs)
      description: >-
        Kept in the issue body (not a markdown-only block) so an executing
        agent reads it directly with `gh issue view`, no separate doc lookup.
      value: |
        This epic's issues are executed by AI agents end-to-end — solo, once,
        without follow-up meetings (guardrails/instructions/agent-operating-doctrine.md).
        The "Target solution class" above plus GR-12 "resolved with evidence"
        must together be sufficient for an agent to know it is actually done:
        at `pattern` class or above, "Verify exits 0" is necessary but not
        sufficient — see this class's own bar in docs/SOLUTION-CLASSES.md
        before opening child issues. `board/materialize.sh update-bodies`/`stats`
        is the idempotent roadmap-refresh mechanism — re-run after adding or
        re-scoping issues under this epic so the board stays reconciled.
    validations:
      required: false
  - type: dropdown
    id: epic
    attributes:
      label: Epic (epic:*)
      description: Which epic owns this roadmap theme.
      options:
        - epic:00-blueprint
        - epic:01-hub-bootstrap
        - epic:02-module-contract
        - epic:03-registry
        - epic:04-sync
        - epic:05-ai-guardrails
        - epic:06-harvest
        - epic:07-observability
        - epic:08-consumers
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      description: Target milestone bucket (M0–M8, see board/MILESTONES.md).
      options:
        - M0
        - M1
        - M2
        - M3
        - M4
        - M5
        - M6
        - M7
        - M8
      default: 1
    validations:
      required: true
  - type: input
    id: req
    attributes:
      label: Requirements (req:*)
      description: "R#s this epic closes (see board/INTENT.md). Example: req:R1, req:R13."
      placeholder: "req:R1, req:R13"
    validations:
      required: true
  - type: textarea
    id: vision
    attributes:
      label: Vision
      description: What the fleet gains when this epic is done.
    validations:
      required: true
  - type: textarea
    id: goals
    attributes:
      label: Goals
      description: High-level outcomes.
      placeholder: |
        - [ ] ...
    validations:
      required: false
  - type: textarea
    id: depends
    attributes:
      label: Dependent epics / issues
      description: Links or issue numbers this epic depends on or unblocks.
    validations:
      required: false
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of done
      description: "Checkboxes. Each item objectively verifiable (see GOLDEN-RULES GR-12)."
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority (priority:*)
      description: Board priority.
      options:
        - priority:P0
        - priority:P1
        - priority:P2
        - priority:P3
      default: 1
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: One paragraph. Why this epic exists, in the fleet's terms.
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: The single measurable outcome this epic delivers. State the end state, not the activity.
    validations:
      required: true
  - type: textarea
    id: measured-landscape
    attributes:
      label: Measured landscape
      description: What is true today, measured. Name the files, counts, and gate output that prove the starting point. An unmeasured claim is not a landscape.
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: Children
      description: The child issues that make up this epic, as bare references. One per line.
      placeholder: |
        - #1510
        - #1511
    validations:
      required: true
  - type: textarea
    id: verification-contract
    attributes:
      label: Verification contract
      description: The commands that prove this epic is done, and the evidence each one leaves. An agent must be able to run these and read a verdict.
      value: |
        Verify:
        Evidence:
    validations:
      required: true
  - type: dropdown
    id: model_tier
    attributes:
      label: Model tier
      description: The tier work under this epic starts at on the escalation ladder. The options are L0, L1 and L2. This is NOT the FinOps executor tier (`model-tier`).
      options:
        - L0
        - L1
        - L2
    validations:
      required: true
  - type: textarea
    id: root_cause
    attributes:
      label: Root cause
      description: The gap this epic closes, and the mechanism that produces it today. Name the file and the line. Write `RCA required, Step 1` when the cause is not yet known.
      value: |
        **Symptom:**
        **Mechanism:** `<file>:<line>`
        **Governance gap:**
        **Earlier catch:**
      render: text
    validations:
      required: true
  - type: checkboxes
    id: lifecycle_contract
    attributes:
      label: Lifecycle contract
      description: Acknowledge the closure contract before filing. `governance/lifecycle/cli.py close` drives these invariants.
      options:
        - label: "I will close this only via a merged PR with `Closes #n` plus acceptance and negative-control evidence, own it to closure, and use the escalation protocol for handoff."
          required: true
    validations:
      required: true
  - type: textarea
    id: escalation
    attributes:
      label: Escalation
      description: The sanctioned handoff path. Make 3 attempts at the stated tier. Then write a comment that names the exact failure, add an `escalate:L1` or `escalate:L2` label, and stop. Silent abandonment is not a handoff.
      value: |
        N = 3 attempts at <tier>.
        Then — a comment naming the exact failure, the `escalate:<L1|L2>` label, and stop.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: area
    attributes:
      label: Areas touched (area:*)
      description: Select all that apply.
      options:
        - label: area:governance
        - label: area:template
        - label: area:registry
        - label: area:sync
        - label: area:guardrails
        - label: area:harvest
        - label: area:catalog
        - label: area:observability
        - label: area:security
        - label: area:docs
        - label: area:meta
  - type: checkboxes
    id: enterprise_close_checklist
    attributes:
      label: "Definition of Done — Enterprise Policy Close Checklist"
      description: >-
        Required before closing this issue if it carries area:governance or area:policy
        (GR-25, guardrails/instructions/enterprise-close-checklist.md). Check each box only
        with a concrete answer recorded in the issue thread, not left blank.
      options:
        - label: "Solution-class tier stated (template/class/pattern/enterprise/faang/elite) — docs/SOLUTION-CLASSES.md"
        - label: "IaC-backed status stated where applicable (cross-cutting mandate) — docs/SOLUTION-CLASSES.md"
        - label: "\"No human needed\" step-reduction impact stated (GR-22)"
        - label: "RCA written and linked if incident-class, else explicitly marked N/A — docs/RCA-TEMPLATE.md"
        - label: "SaaS/multi-tenant applicability noted, or explicitly marked N/A — docs/SAAS-BOUNDARY.md"
