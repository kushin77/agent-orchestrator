name: Task
description: A small, well-scoped unit of work. Per GR-2, opened before the work starts; per GR-12 it carries an objectively verifiable Verify command.
title: "Task: "
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: |
        <!-- cmr-refs: {"id":"...","module":"...","links":[{"type":"...","target":"owner/repo#n"}]} -->
        _Fill the `cmr-refs` marker above with this entity's typed links (see `docs/CROSS-REFERENCE-LAYER.md`). It is machine-readable, not prose._

  - type: markdown
    attributes:
      value: |
        Every task is tracked here, opened **before** the work (GR-2). Acceptance
        criteria must be objectively verifiable — a command that exits 0, a file
        that is gone, a number that changed. Prefer `fleet-ready` tasks: they are
        self-contained and carry a `Verify:` command an agent can execute. Labels
        follow `board/LABELS.md`.
  - type: dropdown
    id: solution_class
    attributes:
      label: Target solution class
      description: >-
        Quality bar this task aims for, per docs/SOLUTION-CLASSES.md (higher =
        more rigor/cost). Mirrored in fleet/MANIFEST.tsv's `class` column;
        `pattern`+ triggers the completion RCA in docs/RCA-TEMPLATE.md.
      options:
        - template
        - class
        - pattern
        - enterprise
        - faang
        - elite
      default: 1
    validations:
      required: true
  - type: textarea
    id: ai_execution_note
    attributes:
      label: AI-agent execution note (edit only if this task's bar differs)
      description: >-
        Kept in the issue body (not a markdown-only block) so an executing
        agent reads it directly with `gh issue view`, no separate doc lookup.
      value: |
        This task is executed by an AI agent end-to-end — solo, once, without
        follow-up meetings (guardrails/instructions/agent-operating-doctrine.md).
        Acceptance criteria + Verify must be sufficient on their own for the
        agent to know it's done: at `pattern` class or above, "Verify exits 0"
        is necessary but not sufficient — acceptance criteria must also cover
        the target class's own bar (docs/SOLUTION-CLASSES.md), extending GR-12
        "resolved with evidence" rather than restating it. Closing at `pattern`+
        expects a short completion RCA — see docs/RCA-TEMPLATE.md §
        "Completion RCA". `board/materialize.sh update-bodies`/`stats` is the
        idempotent roadmap-refresh mechanism — no separate action needed here,
        it re-syncs from fleet/MANIFEST.tsv.
    validations:
      required: false
  - type: dropdown
    id: epic
    attributes:
      label: Epic (epic:*)
      description: Which epic owns this work.
      options:
        - epic:00-blueprint
        - epic:01-hub-bootstrap
        - epic:02-module-contract
        - epic:03-registry
        - epic:04-sync
        - epic:05-ai-guardrails
        - epic:06-harvest
        - epic:07-observability
        - epic:08-consumers
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      description: Target milestone bucket (M0–M8).
      options:
        - M0
        - M1
        - M2
        - M3
        - M4
        - M5
        - M6
        - M7
        - M8
      default: 1
    validations:
      required: true
  - type: input
    id: req
    attributes:
      label: Requirements (req:*)
      description: "R#s this task satisfies (see board/INTENT.md). Example: req:R1, req:R2."
      placeholder: "req:R1, req:R2"
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issue numbers that must land first (optional).
      placeholder: "#CMR-000"
    validations:
      required: false
  - type: textarea
    id: story
    attributes:
      label: Story
      description: What and why. The observation or decision that prompted it.
      placeholder: |
        What:
        - ...
        Why:
        - ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "Checkboxes. Each one verifiable without judgement (GR-12)."
      placeholder: |
        - [ ] `make verify` exits 0
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: "Verify: command"
      description: The exact command(s) an agent or reviewer runs to prove done. No formalities.
      placeholder: |
        make verify
        bash -n scripts/foo.sh
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority (priority:*)
      description: Board priority.
      options:
        - priority:P0
        - priority:P1
        - priority:P2
        - priority:P3
      default: 1
    validations:
      required: true
  - type: checkboxes
    id: area
    attributes:
      label: Areas touched (area:*)
      description: Select all that apply.
      options:
        - label: area:governance
        - label: area:template
        - label: area:registry
        - label: area:sync
        - label: area:guardrails
        - label: area:harvest
        - label: area:catalog
        - label: area:observability
        - label: area:security
        - label: area:docs
        - label: area:meta
  - type: checkboxes
    id: enterprise_close_checklist
    attributes:
      label: "Definition of Done — Enterprise Policy Close Checklist"
      description: >-
        Required before closing this issue if it carries area:governance or area:policy
        (GR-25, guardrails/instructions/enterprise-close-checklist.md). Check each box only
        with a concrete answer recorded in the issue thread, not left blank.
      options:
        - label: "Solution-class tier stated (template/class/pattern/enterprise/faang/elite) — docs/SOLUTION-CLASSES.md"
        - label: "IaC-backed status stated where applicable (cross-cutting mandate) — docs/SOLUTION-CLASSES.md"
        - label: "\"No human needed\" step-reduction impact stated (GR-22)"
        - label: "RCA written and linked if incident-class, else explicitly marked N/A — docs/RCA-TEMPLATE.md"
        - label: "SaaS/multi-tenant applicability noted, or explicitly marked N/A — docs/SAAS-BOUNDARY.md"
  - type: checkboxes
    id: qualifiers
    attributes:
      label: Qualifiers
      description: Optional cross-cutting labels.
      options:
        - label: fleet-ready
        - label: pilot
        - label: good first issue
        - label: "status:blocked"
