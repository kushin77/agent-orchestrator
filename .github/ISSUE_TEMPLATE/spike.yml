name: Spike / Decision
description: Research or a decision needed before building (spike:decide). If the decision is architectural, the outcome becomes an ADR.
title: "Spike: "
labels: ["type:spike", "spike:decide"]
body:
  - type: markdown
    attributes:
      value: |
        <!-- cmr-refs: {"id":"...","module":"...","links":[{"type":"...","target":"owner/repo#n"}]} -->
        _Fill the `cmr-refs` marker above with this entity's typed links (see `docs/CROSS-REFERENCE-LAYER.md`). It is machine-readable, not prose._

  - type: markdown
    attributes:
      value: |
        A spike answers a question or makes a decision — it does **not** ship a
        feature. "Done" is a recorded decision with rationale, not code. If the
        outcome changes the architecture, it lands as an ADR in
        `docs/decision-records/`. Labels follow `board/LABELS.md`.
  - type: dropdown
    id: epic
    attributes:
      label: Epic (epic:*)
      description: Which epic owns this decision.
      options:
        - epic:00-blueprint
        - epic:01-hub-bootstrap
        - epic:02-module-contract
        - epic:03-registry
        - epic:04-sync
        - epic:05-ai-guardrails
        - epic:06-harvest
        - epic:07-observability
        - epic:08-consumers
    validations:
      required: true
  - type: input
    id: req
    attributes:
      label: Requirements (req:*)
      description: "R#s this decision touches (see board/INTENT.md). Example: req:R4, req:R15."
      placeholder: "req:R4, req:R15"
    validations:
      required: true
  - type: textarea
    id: decision-needed
    attributes:
      label: Decision needed
      description: The single question to answer. If there is more than one, split the spike.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why now. Constraints, prior art, observations that frame the options.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Each candidate with its tradeoffs. Leave no option unexamined.
      placeholder: |
        Option A — ...
          Pros / cons
        Option B — ...
          Pros / cons
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation & criteria
      description: "Recommended option (if any) and the criteria that decide it. Be concrete."
    validations:
      required: false
  - type: textarea
    id: outcome
    attributes:
      label: "Outcome: ADR?"
      description: "If this changes a recorded architecture decision, note the ADR number to open."
      placeholder: "ADR-000X — <slug>"
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority (priority:*)
      description: Board priority.
      options:
        - priority:P0
        - priority:P1
        - priority:P2
        - priority:P3
      default: 2
    validations:
      required: true
  - type: checkboxes
    id: area
    attributes:
      label: Areas touched (area:*)
      description: Select all that apply.
      options:
        - label: area:governance
        - label: area:template
        - label: area:registry
        - label: area:sync
        - label: area:guardrails
        - label: area:harvest
        - label: area:catalog
        - label: area:observability
        - label: area:security
        - label: area:docs
        - label: area:meta
  - type: checkboxes
    id: enterprise_close_checklist
    attributes:
      label: "Definition of Done — Enterprise Policy Close Checklist"
      description: >-
        Required before closing this issue if it carries area:governance or area:policy
        (GR-25, guardrails/instructions/enterprise-close-checklist.md). Check each box only
        with a concrete answer recorded in the issue thread, not left blank.
      options:
        - label: "Solution-class tier stated (template/class/pattern/enterprise/faang/elite) — docs/SOLUTION-CLASSES.md"
        - label: "IaC-backed status stated where applicable (cross-cutting mandate) — docs/SOLUTION-CLASSES.md"
        - label: "\"No human needed\" step-reduction impact stated (GR-22)"
        - label: "RCA written and linked if incident-class, else explicitly marked N/A — docs/RCA-TEMPLATE.md"
        - label: "SaaS/multi-tenant applicability noted, or explicitly marked N/A — docs/SAAS-BOUNDARY.md"
