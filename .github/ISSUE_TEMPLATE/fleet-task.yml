# .github/ISSUE_TEMPLATE/fleet-task.yml — the brain-directed fleet-task issue form.
#
# ---knowledge---
# module_id: github.issue-template.fleet-task
# system: governance
# app: board
# solution_class: pattern
# patterns: [issue-first]
# derives_from: null
# owner_sme: pmo-sme
# tier: L0
# interfaces: [the fleet-task issue body fields]
# invariants: ""
# gotchas: "model_tier here is the L0/L1/L2 escalation ladder, not the FinOps flash/pro/auditor tier"
# related: ["#1913"]
# do_not_duplicate: null
# ---knowledge---
name: Fleet task
description: Issue brief for a brain-directed fleet task — role, epic, lane, FinOps model tier + thinking effort, Verify command, and chain markers.
title: "[fleet-task]"
labels: ["area:session-fleet"]
body:
  - type: markdown
    attributes:
      value: |
        **GOAL first.** State the concrete objective and its success criteria
        before any constraints or context, so a subagent (or a session resuming
        after compaction) can act correctly from the first line alone. Order the
        brief **GOAL -> constraints -> context**, then fill every required field.

        `governance/dispatch/` reads the chain markers, model tier and thinking
        effort straight out of this brief: an unfilled field is a broken
        directive. The issue-template gate fails if a required field is dropped
        from this form, so edit the form only together with its gate.

        **The clock invariant (issue #506, `RCA-0008`).** A fixture that pins a
        literal date while the code under test resolves its evaluation bucket
        from the live clock is green on the day it is written and red every day
        after — measured, `47 passed` on the day and `2 failed, 45 passed` daily
        thereafter, identically at the very commit that closed that issue. Ask
        the two clock questions in Acceptance criteria while the work is being
        shaped: a detector that reads the fixture cannot stand in for them,
        because at byte-identical seed lines it refuses the defect and its own
        repair alike.

  - type: dropdown
    id: role
    attributes:
      label: Role (executor)
      description: Who executes this brief. The brain issues directives; a sister coordinates an epic; a subagent does the work.
      options:
        - brain
        - sister
        - subagent
    validations:
      required: true

  - type: input
    id: epic
    attributes:
      label: Epic
      description: The epic index this task serves, as a bare issue reference.
      placeholder: "#160"
    validations:
      required: true

  - type: dropdown
    id: pillar
    attributes:
      label: Pillar
      description: The five-pillar surface (or cross-cutting area) this task touches.
      options:
        - agent-registry
        - model-gateway
        - state-machine
        - guardrails-security
        - observability-finops
        - identity-rbac
        - control-plane
        - infra-iac
        - autonomous-ops
    validations:
      required: true

  - type: input
    id: lane
    attributes:
      label: Lane
      description: The single lane that owns this issue. One issue = one lane = one branch; no two lanes share a file in a wave.
      placeholder: autonomous-ops
    validations:
      required: true

  - type: dropdown
    id: model-tier
    attributes:
      label: Model tier (FinOps)
      description: Start cheap. flash is the default; escalate to pro on observed difficulty, never pre-emptively; auditor is the measured audit seat (never below pro for security, secrets, auth or IaC work).
      options:
        - flash
        - pro
        - auditor
    validations:
      required: true

  - type: dropdown
    id: thinking-effort
    attributes:
      label: Thinking effort
      description: Reasoning effort for this task. none is the fleet's thinking-off state; low|medium|high come from the harvested role-effort ladder.
      options:
        - none
        - low
        - medium
        - high
    validations:
      required: true

  - type: dropdown
    id: posture
    attributes:
      label: Posture (delivery)
      description: How this work is delivered — the tag authority's `posture` dimension (AO-GR-28, governance/tagging/taxonomy.yaml). iac means the infrastructure is DECLARED, never clicked, and ships flag-gated ON by default (AO-GR-6); saas puts it behind the identity and boundary gates; no-human-needed means the lane must finish with NO operator input at all; human-gated means an operator gate precedes merge. These are orthogonal — a SaaS surface can also be IaC-declared.
      options:
        - overall
        - saas
        - iac
        - no-human-needed
        - human-gated
    validations:
      required: false

  - type: dropdown
    id: lifecycle
    attributes:
      label: Lifecycle (SDLC stage)
      description: The SDLC stage this work is in — the tag authority's `lifecycle` dimension. It decides which channel's gates apply — `plan` goes to `pr`, `build`/`verify` to `ci`, `release` to `cd`, `operate`/`retire` to `ops`. Ask for the derived plan with `python3 governance/tagging/cli.py plan --tag …`.
      options:
        - plan
        - build
        - verify
        - release
        - operate
        - retire
    validations:
      required: false

  - type: input
    id: verify-command
    attributes:
      label: Verify command
      description: The exact command whose real output is the evidence of done. Never claim done without it.
      placeholder: make verify
    validations:
      required: true

  - type: textarea
    id: chain-markers
    attributes:
      label: Chain markers
      description: The dependency edges the dispatcher reads. Declare the parent, any blocker, and the chain position. Write `Root=none` if this issue is the head of a chain.
      value: |
        Parent: #<n>
        Part-of: #<n>
        Blocked-by: #<n>
      render: text
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Each criterion must be mechanically checkable, with the command or assertion that decides it. A work item that pins any literal date, day or month must answer the two clock questions in this field (#506, RCA-0008) — a fixture whose evaluation bucket comes from the live clock is green only on the day it was written.
      value: |
        - [ ] criterion (how it is checked)
        - [ ] criterion (how it is checked)
        - [ ] clock (#506, RCA-0008) — does this work introduce a time-pinned
          fixture (a literal date/day/month)? <yes — name it, or no>
        - [ ] clock (#506, RCA-0008) — where is the EVALUATION bucket resolved,
          from the entity under test or from the live clock? <name the seam>
      render: text
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste the literal command output proving the Verify command passed. A summary or a claimed count is not evidence.
      render: console
    validations:
      required: false

  - type: input
    id: parent_epic
    attributes:
      label: Parent epic
      description: "The epic this issue is a child of — the edge the dispatch chain resolves, written as a bare reference (e.g. #1510). The epic form omits this field, because an epic has no parent."
      placeholder: "#1510"
    validations:
      required: true

  - type: dropdown
    id: model_tier
    attributes:
      label: Model tier
      description: The tier this work starts at on the escalation ladder the briefs state as L0/L1/L2 — NOT the FinOps executor tier (`model-tier`, whose options are flash/pro/auditor) that the dispatcher reads. The two are separate vocabularies and both are required; this one is the ladder the Escalation field below names.
      options:
        - L0
        - L1
        - L2
    validations:
      required: true

  - type: textarea
    id: root_cause
    attributes:
      label: Root cause
      description: The symptom, the mechanism (name the file and the line), the governance gap that let it through, and what would have caught it earlier. Write `RCA required, Step 1` when the cause is not yet known — an honest Step 1 is worth more than an invented theory.
      value: |
        **Symptom:**
        **Mechanism:** `<file>:<line>`
        **Governance gap:**
        **Earlier catch:**
      render: text
    validations:
      required: true

  - type: checkboxes
    id: lifecycle_contract
    attributes:
      label: Lifecycle contract
      description: Acknowledge the closure contract before filing. `governance/lifecycle/cli.py close` drives these invariants, and the issue-template gate fails if this field is dropped from the form.
      options:
        - label: "I will close this only via a merged PR with `Closes #n` + acceptance/negative-control evidence, own it to closure, and use the Escalation protocol for handoff — never silent abandonment."
          required: true
    validations:
      required: true

  - type: textarea
    id: escalation
    attributes:
      label: Escalation
      description: The sanctioned handoff path. N = 3 attempts at the stated tier, then a comment naming the exact failure plus an `escalate:L1` / `escalate:L2` label, and stop. Silent abandonment is not a handoff.
      value: |
        N = 3 attempts at <tier>.
        Then — a comment naming the exact failure, the `escalate:<L1|L2>` label, and stop.
      render: text
    validations:
      required: true
