# agent-orchestrator pre-commit configuration (issue #5).
#
# Install:   pre-commit install
# Run all:   pre-commit run --all-files
#
# Secrets are caught two ways: the gitleaks hook (default rules, config in
# `.gitleaks.toml`) plus the mechanical `detect-aws-credentials` /
# `detect-private-key` hooks. `make verify` additionally runs a mechanical
# secret scan so the repo gate never depends on optional tooling being
# installed.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-aws-credentials
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
