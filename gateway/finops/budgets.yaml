# gateway/finops/budgets.yaml — per-tenant AND per-role budget configuration.
#
# Two budget axes are enforced before any model call:
#
#   1. per-tenant (issue #17) — the `budgets` mapping below.
#   2. per-role   (issue #633) — the `roles` defaults block at the foot of this
#      file; the caps themselves are CONSUMED from registry/personas.
#
# The runtime per-tenant budget set is provisioned by the control plane
# (tenant identity / billing); this file ships the loader's seed/default shape
# and documents the supported policy vocabulary that the budget enforcer
# (budget.py) understands. Adapted from the leaderboard finops-budget.yaml and
# finops-governor.sh pre-flight exit codes (0 OK / 1 DEGRADED / 2 BLOCKED).
#
# Supported per-tenant policies:
#   stop     - block spend once projected use reaches warnAtPct of the budget
#              (strictest; spend is refused at the soft threshold).
#   warn     - allow spend up to hardCapPct but attach a warning from
#              warnAtPct on.
#   fallback - from warnAtPct on, downgrade the model tier toward the task
#              class's cheapest-capable tier instead of blocking; a hard stop
#              still applies at hardCapPct.
#
# hardCapPct is absolute: projected spend at/above it always stops, whatever
# the policy. Values are in USD per tenant per budget period (calendar month by
# default; period semantics are owned by the metering/telemetry pillar).

schemaVersion: 1

# Default policy applied when a tenant has no explicit budget entry (an
# unprovisioned tenant is allowed but every call is flagged against the
# default policy so unbudgeted spend stays visible to the metering store).
defaultPolicy: warn

# Per-tenant budgets. The chooser consults these through budget.py before any
# model call and records every decision in the metering store.
budgets:
  # purebliss (single-tenant org, CEO/CFO/CTO/PMO offices): fallback to local
  # ollama beyond the soft threshold rather than stopping the org outright,
  # since purebliss always has a free local-inference floor.
  tenant-purebliss:
    monthlyBudgetUsd: 750.00
    policy: fallback
    warnAtPct: 80
    hardCapPct: 100
  tenant-acme:
    monthlyBudgetUsd: 100.00
    policy: fallback
    warnAtPct: 80
    hardCapPct: 100
  tenant-beta:
    monthlyBudgetUsd: 50.00
    policy: stop
    warnAtPct: 80
    hardCapPct: 100
  tenant-gamma:
    monthlyBudgetUsd: 25.00
    policy: warn
    warnAtPct: 85
    hardCapPct: 100

# ---------------------------------------------------------------------------
# Per-role monthly caps (issue #633, workbook-2).
#
# The CAPS THEMSELVES are not declared here. They are consumed from the
# registry org chart, which is the workbook-1 declaration and the single source
# of truth:
#
#   registry/personas/org-chart.yaml   -> roles[].monthlyBudgetCapUsd
#   registry/personas/cards/<role>.yaml -> monthlyBudgetCapUsd  (must agree)
#
# budget.load_role_budgets() reads that declaration and fails closed on drift,
# a missing card, or a non-numeric cap — so this file cannot silently restate a
# number the org chart owns. It documents the vocabulary and the *policy* only.
#
# Enforcement: the chooser checks the role cap for the persona a call is
# dispatched for BEFORE the tenant budget, because the narrower ceiling is the
# one that must not be crossed. The cap path is deterministic arithmetic
# (percentage comparison over the spend ledger) — no model call, no tokens.
# This is the workbook mechanical rule "zero-token arithmetic" (CFO row):
# deciding whether tokens may be spent must never itself spend tokens.
roles:
  # Source of the per-role cap numbers (read-only consumer; never redefined).
  capSource: registry/personas/org-chart.yaml

  # Over-cap policy. `stop` = a role at its cap REFUSES spend (the workbook-2
  # acceptance criterion). `warn` flags and allows, `fallback` downgrades the
  # tier. The default is deliberately the strictest.
  defaultPolicy: stop

  # A role is at cap when projected spend reaches the cap itself, so the warn
  # threshold defaults to 100% (unlike a tenant's soft early-warning line).
  warnAtPct: 100
  hardCapPct: 100

  # Ledger keys are namespaced `role:<tenant>/<role_id>`, so a role's spend is
  # accounted separately from its tenant's budget while sharing one ledger.
