# JSON Schema (draft-07) for the SME-routing policy bundle (issue #149).
#
# Three declared documents, three definitions, one schema:
#   policies/capability-registry.yaml -> #/definitions/capability_registry
#   policies/route-policy.yaml        -> #/definitions/route_policy
#   policies/tier-policy.yaml         -> #/definitions/tier_policy
#
# Validated by gateway/sme-routing/smeroute_config.py through the stdlib-only
# validator in jsonschema_lite.py, and covered by negative tests: every
# keyword used here genuinely rejects a document that violates it.
#
# The schema checks SHAPE. Referential integrity (an agent named in a chain
# must be a declared agent, the escalation ladder must terminate, the
# unknown-task fail-safe must stay "deep") is checked by the loader as a
# semantic layer, because JSON Schema cannot express it.
$schema: "http://json-schema.org/draft-07/schema#"
$id: "urn:kushin77:agent-orchestrator:gateway/sme-routing:schema"
title: "SME routing + capability/route/tier FinOps policy bundle"
description: >-
  Shape contract for the ported capability registry, route policy and tier
  policy. The tier vocabulary is closed at flash/pro/auditor, the same closed
  set gateway/finops/chooser.py pins fleet-wide.
type: object
required: [definitions]
properties:
  $schema: {type: string}
  $id: {type: string}
  title: {type: string}
  description: {type: string}
  definitions: {type: object}
additionalProperties: true
definitions:

  # --- shared building blocks ---------------------------------------------
  version:
    type: string
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'

  updated_at:
    type: string
    minLength: 1

  provenance_source:
    type: string
    minLength: 1

  chain:
    description: An ordered list of agent role ids.
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}

  keywords:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}

  tier_name:
    description: The closed FinOps tier vocabulary (flash/pro/auditor).
    enum: [flash, pro, auditor]

  route_name:
    enum: [fast, deep, strict]

  # --- capability registry -------------------------------------------------
  agent_role:
    type: object
    additionalProperties: false
    required: [id, owner, capabilities, tools_allowed, latency_tier, cost_tier,
               fallback, worker_types]
    properties:
      id: {type: string, minLength: 1}
      owner: {type: string, minLength: 1}
      capabilities: {type: array, minItems: 1, uniqueItems: true,
                     items: {type: string, minLength: 1}}
      tools_allowed: {type: array, minItems: 1, uniqueItems: true,
                      items: {type: string, minLength: 1}}
      latency_tier: {enum: [low, medium, high]}
      cost_tier: {enum: [low, medium, high]}
      fallback: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
      worker_types: {type: array, items: {type: string, minLength: 1}}

  worker_fleet_entry:
    type: object
    additionalProperties: false
    required: [description, access_level, agent_roles, default_model]
    properties:
      description: {type: string, minLength: 1}
      access_level: {enum: [api, shell, full, read, write_docs]}
      agent_roles: {type: array, minItems: 1, uniqueItems: true,
                    items: {type: string, minLength: 1}}
      default_model: {type: string, minLength: 1}

  sme_domain:
    type: object
    additionalProperties: false
    required: [description, labels, sme, module]
    properties:
      description: {type: string, minLength: 1}
      labels: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}
      sme: {type: string, minLength: 1}
      module: {type: string}

  squad:
    type: object
    additionalProperties: false
    required: [lens, keywords]
    properties:
      lens: {type: string, pattern: '^lens:[a-z][a-z-]*$'}
      keywords: {type: array, uniqueItems: true, items: {type: string, minLength: 1}}

  module_authority_entry:
    type: object
    additionalProperties: false
    required: [domain, module, owns, policy]
    properties:
      domain: {type: string, minLength: 1}
      module: {type: string, minLength: 1}
      owns: {type: array, minItems: 1, uniqueItems: true,
             items: {type: string, minLength: 1}}
      policy: {type: string, minLength: 1}

  capability_registry:
    type: object
    additionalProperties: false
    required: [version, updated_at, source, description, agents, worker_fleet,
               dispatch_routing, sme_domains, squads, squad_default, sme_default,
               module_authority]
    properties:
      version: {$ref: "#/definitions/version"}
      updated_at: {$ref: "#/definitions/updated_at"}
      source: {$ref: "#/definitions/provenance_source"}
      description: {type: string, minLength: 1}
      agents:
        type: array
        minItems: 1
        items: {$ref: "#/definitions/agent_role"}
      worker_fleet:
        type: object
        minProperties: 1
        additionalProperties: {$ref: "#/definitions/worker_fleet_entry"}
      dispatch_routing:
        type: object
        minProperties: 1
        required: [default_chain, governance_chain, doc_chain, audit_chain]
        additionalProperties: {$ref: "#/definitions/chain"}
      sme_domains:
        type: object
        minProperties: 1
        required: [general]
        additionalProperties: {$ref: "#/definitions/sme_domain"}
      squads:
        type: object
        minProperties: 1
        additionalProperties: {$ref: "#/definitions/squad"}
      squad_default: {type: string, minLength: 1}
      sme_default: {type: string, minLength: 1}
      module_authority:
        type: array
        items: {$ref: "#/definitions/module_authority_entry"}

  # --- route policy --------------------------------------------------------
  thresholds:
    type: object
    additionalProperties: false
    required: [fast_path_max_tokens, deep_path_min_tokens, risk_high_keywords,
               complexity_keywords]
    properties:
      fast_path_max_tokens: {type: integer, minimum: 1}
      deep_path_min_tokens: {type: integer, minimum: 1}
      risk_high_keywords: {$ref: "#/definitions/keywords"}
      complexity_keywords: {$ref: "#/definitions/keywords"}

  route_spec:
    type: object
    additionalProperties: false
    required: [path_mode, description, agents, model_tier, worker_types]
    properties:
      path_mode: {enum: [fast, deep]}
      description: {type: string, minLength: 1}
      agents: {$ref: "#/definitions/chain"}
      model_tier: {$ref: "#/definitions/tier_name"}
      worker_types: {type: array, minItems: 1, uniqueItems: true,
                     items: {type: string, minLength: 1}}

  route_policy:
    type: object
    additionalProperties: false
    required: [version, updated_at, source, description, thresholds, routes,
               dispatch_defaults]
    properties:
      version: {$ref: "#/definitions/version"}
      updated_at: {$ref: "#/definitions/updated_at"}
      source: {$ref: "#/definitions/provenance_source"}
      description: {type: string, minLength: 1}
      thresholds: {$ref: "#/definitions/thresholds"}
      routes:
        type: object
        minProperties: 1
        required: [fast, deep, strict]
        additionalProperties: {$ref: "#/definitions/route_spec"}
      dispatch_defaults:
        type: object
        required: [unknown_task_type]
        additionalProperties: {$ref: "#/definitions/route_name"}

  # --- tier policy ---------------------------------------------------------
  tier_spec:
    type: object
    additionalProperties: false
    required: [models, timeout_seconds, max_tokens, fallback, description]
    properties:
      models: {type: array, minItems: 1, uniqueItems: true,
               items: {type: string, minLength: 1}}
      timeout_seconds: {type: integer, minimum: 1}
      max_tokens: {type: integer, minimum: 1}
      fallback: {type: [string, "null"]}
      description: {type: string, minLength: 1}

  tier_policy:
    type: object
    additionalProperties: false
    required: [version, updated_at, source, description, tiers,
               complexity_to_tier, task_overrides]
    properties:
      version: {$ref: "#/definitions/version"}
      updated_at: {$ref: "#/definitions/updated_at"}
      source: {$ref: "#/definitions/provenance_source"}
      description: {type: string, minLength: 1}
      tiers:
        type: object
        minProperties: 1
        required: [flash, pro, auditor]
        additionalProperties: {$ref: "#/definitions/tier_spec"}
      complexity_to_tier:
        description: >-
          Declared complexity ranges. Shape is checked here; CONTIGUITY and
          full 0..100 coverage are checked by the loader, so a gap that would
          leave a task unclassifiable cannot be a pass.
        type: object
        minProperties: 1
        propertyNames: {type: string, pattern: '^[0-9]+-[0-9]+$'}
        additionalProperties: {type: string, minLength: 1}
      task_overrides:
        type: object
        additionalProperties: {type: string, minLength: 1}
