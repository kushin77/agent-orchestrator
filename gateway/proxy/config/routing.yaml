# gateway/proxy/config/routing.yaml — proxy routing policy (issue #16).
#
# Declarative routing contract for the model-gateway proxy funnel:
#
#   task-type -> capability -> FinOps ladder tier -> registry tier
#                  -> provider fallback chain (primary -> fallback -> local)
#
# Vocabulary is CONSUMED from the merged sibling contracts, never redefined:
# taskType ids are published prompt modules (registry/prompts, issue #13),
# capability ids come from the registry/profiles catalog (issue #9), and
# taskClass names are the FinOps tier-table task classes (gateway/finops
# tiers.yaml, issue #17).  Registry tier ids are LOW/MED/HIGH/MAX.

schemaVersion: 1

# taskType -> { capability, taskClass }.
# The proxy routes each published prompt-module task type to the platform
# capability it requires and the FinOps task class whose default tier is the
# cheapest capable rung for it.  Adding a route here (with the matching
# registry/prompts module and catalog capability) routes a new task type.
routes:
  classify-route:
    capability: orchestrate
    taskClass: classify-route
  code-review-verdict:
    capability: code-review
    taskClass: code-review
  summarize:
    capability: research
    taskClass: research
  # Capability-holder routes (issue #337): the purebliss-team hermes + ollama
  # personas hold code-author / test-run but no route referenced a capability
  # they hold, so their pins were unreachable. These routes reference only
  # capabilities those personas already declare (no capabilitySet widening).
  test-run:
    capability: test-run
    taskClass: test-run
  code-author:
    capability: code-author
    taskClass: code-author

# FinOps ladder tier (L0/L1/L2) -> registry profile tier (LOW/MED/HIGH/MAX).
# The chooser picks the ladder tier; the proxy maps it onto the registry
# vocabulary the providers and limits layers route on.
tierMap:
  L0: LOW
  L1: MED
  L2: HIGH

# Ordered provider fallback chains per registry tier: primary -> fallback ->
# local (Ollama).  Health filtering (injected signal) picks the first healthy
# provider; local Ollama is the terminal keyless fallback of every chain
# (cloud -> local graceful degradation).
providerChains:
  LOW:
    - deepseek
    - openai
    - ollama
  MED:
    - deepseek
    - anthropic
    - ollama
  HIGH:
    - deepseek
    - anthropic
    - ollama
  MAX:
    - deepseek
    - anthropic
    - ollama

# Agent routing groups: a named team's agent -> provider mapping with an
# ordered fallback chain and a retry budget. An agent that belongs to a group
# is routed by its pinned chain (primary -> fallbacks) instead of the tier
# chain, so a whole team can be pinned to its providers without re-declaring
# the tier vocabulary. The FinOps tier choice still sets cost/budget and the
# model tier within the pinned provider. Consumed from the EPIC #253 frozen
# mapping: ollama -> ollama, paperclip -> paperclip, hermes -> hermes/ollama,
# deepseek -> deepseek, claude -> anthropic. The claude/anthropic module
# entry is the gateway-owned catalog entry at
# gateway/catalog/modules/claude-anthropic/module.json (issue #255).
routingGroups:
  purebliss-team:
    description: >-
      The five-agent team (EPIC #253): local ollama, paperclip, hermes,
      deepseek and claude/anthropic, each pinned to its provider with the local
      Ollama hop as the terminal fallback (cloud -> local graceful degradation).
    retryMaxAttempts: 2
    agents:
      ollama:    { provider: ollama }
      paperclip: { provider: paperclip, fallbacks: [ollama] }
      hermes:    { provider: hermes, fallbacks: [ollama] }
      deepseek:  { provider: deepseek, fallbacks: [ollama] }
      claude:    { provider: anthropic, fallbacks: [ollama] }
