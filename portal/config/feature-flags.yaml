# Portal surface feature flags — the console's OWN declaration (issue #642).
#
# WHY a second declaration exists: `infra/feature-flags/registry.yaml` is the
# *control-plane service* registry — its `surfaces:` map gates a family of
# routes on an endpoint, and it is kept in lock-step with
# `infra/terraform/variables.tf` by `scripts/check-feature-flags.py` (every
# `enable_*` variable must have a matching `services.<name>` entry, and vice
# versa). The surfaces this file governs are **views inside the portal
# service** — they add no service, no terraform variable and no deploy target,
# so declaring them in that registry would either need a fabricated `enable_*`
# variable or break the checker's 1:1 rule. They are declared here instead,
# beside the code that reads them, and read through the same fail-closed
# contract the fleet projection uses.
#
# `portal/server/config_flags.py` is the only reader — a missing file,
# unreadable file, missing `surfaces` section, missing entry, or an entry
# whose `default` is neither `on`/`true` reads as OFF, so a surface can never
# be promoted by accident, only by an explicit `on`/`true`.
#
# `default_policy: off` below is only the fail-closed fallback for an entry
# with no explicit `default` (every surface here declares one). Per-surface
# defaults are independent: org_chart, skill_studio and task_board default
# ON, matching their `infra/feature-flags/registry.yaml` counterparts (GR-5
# reversal, owner decision 2026-09-21). erp_module stays OFF — it has its own
# dedicated promotion gate (scripts/check-erp-portal.sh,
# e2e/erp/golden_path.py) that requires the shipped default stay off.
# fleet_board, sessions and settings default ON — they have no registry.yaml
# `surfaces:` counterpart to promote against (governed here alone) and no
# documented reason to withhold; flipped per GR-5's fleet-wide default-on
# reversal (owner directive 2026-09-22). `scripts/check-feature-flags.py`
# cross-validates every surface declared in both files against drift (issue
# #1941). nous (issue #1561) stays OFF and is governed here alone: its live
# probe reaches a billed external provider, and the operator has not yet
# created the Secret Manager value #1748 declares the boundary for (#1748
# itself only lands the IaC declaration, not the credential) — promoted only
# once that operator step is done.
schema_version: 1

default_policy: off

surfaces:
  org_chart:
    default: on
    phase: 11
    description: >
      Org-chart view (issue #642, workbook-11; EPIC #631 Pillar 2): renders the
      workbook-1 declaration (registry/personas/org-chart.yaml + the bound
      cards/*.yaml) as nodes with reports-to edges, the declared budget cap and
      model tier, joined to the workbook-6 role-health feed
      (telemetry/role_health.RoleHealthReport) for per-role burn and heartbeat
      status. Served read-only at GET /api/orgchart/chart and
      GET /api/orgchart/health. Consumes both declarations verbatim; it
      restates no cap, tier or cadence.
  skill_studio:
    default: on
    phase: 11
    description: >
      Skill-studio UI (issue #642, workbook-11): the author -> test -> publish
      workflow of the workbook-9 API (registry/packs/skills.SkillStudio) over
      the console's HTTP surface — list/search authored skills, read one
      revision's lifecycle and eval evidence, and drive author/test/publish
      through the studio's own gates (a publish without green eval evidence is
      refused by the studio, never by this adapter). Served at
      GET /api/skillstudio/skills, GET /api/skillstudio/skills/<id> and
      POST /api/skillstudio/author|test|publish. Offline (no network egress).
  task_board:
    default: on
    phase: 11
    description: >
      Tenant task board (issue #642, workbook-11): the workbook-3 ticket
      lifecycle (engine/core/tickets.TicketRuntime) projected per tenant —
      every ticket row is a replay of the durable event log, never a second
      store. Served read-only at GET /api/taskboard/tickets and
      GET /api/taskboard/tickets/<id>. A ticket the log does not contain is
      absent, not invented.
  erp_module:
    # NOT part of GR-5's default-on reversal (issue #1941): the ERP module
    # has its own dedicated promotion gate (scripts/check-erp-portal.sh,
    # e2e/erp/golden_path.py, e2e/erp/negative_controls.py) that asserts this
    # surface ships OFF and is promoted only through a scratch config, never
    # the shipped default. Flipping it here would fail that gate's own
    # contract, so it is out of scope for this lane.
    default: off
    phase: 7
    description: >
      ERP module portal surface (ERP-07, issue #652; EPIC #645): the module's
      dashboards, document lists/forms and reports, mounted into the console
      behind the module's own switch — the `features[].id: erp-module` entry in
      integrations/erp/module.yaml, which is also what
      infra/feature-flags/registry.yaml declares as services.erp_module /
      surfaces.erp_module for promotion. Served by `portal/server/erp.py`:
      GET /api/erp/module (the module's own declaration, read through ERP-01's
      loader, plus ERP-06's served contract), GET /api/erp/dashboard,
      GET /api/erp/reports[<id>], the verbatim proxy of ERP-06's own routes
      (/api/erp/documents/... and /api/erp/openapi.json|health), and the
      module's frame at /erp/module.html. The declarations the views render —
      the family vocabulary, each family's states and legal moves, and the
      fields a form offers — are read from the ERP-06 contract at request time,
      so the projection re-derives no knowledge the indexer already carries, and
      every document read and write is ERP-06's own answer carrying ERP-08's
      authorization decision (the module types no role of its own). Offline: the
      ERP-06 surface is transport-free, so the module renders with no socket, no
      network and no deployment.
  fleet_board:
    default: on
    phase: 11
    description: >
      Fleet board (issue #880, EPIC #878 lane L1): the live issue roster the
      fleet CLI/cron already treat as source of truth
      (.board/snapshot.json + .board/claims.jsonl), joined per issue and
      validated row-by-row against portal/schemas/fleet-board-row.schema.json
      by portal.server.livestore.load_board_rows before it is served. Served
      read-only at GET /api/board/rows. A row a malformed source document
      produced is refused by name (issue number + defect) rather than served,
      never a fabricated or best-effort row.
  sessions:
    default: on
    phase: 11
    description: >
      Cross-engine Sessions view (issue #1563): joins .fleet/claims/*,
      .board/claims.jsonl and .deepseek-agent/sessions/* into one operator row
      set (engine, issue, branch, state, agent, lane, age). Served read-only
      at GET /api/sessions/rows. A root that does not exist on this checkout
      is named in the response's missing[] list rather than silently dropped.
  settings:
    default: on
    phase: 11
    description: >
      Settings view (issue #1757): renders portal.server.settings.
      SettingsAggregator's read-only row join (portal_surfaces, fleet_jobs,
      dispatch_tier_policy, gate_skip_budget, provider_flags, nous_secret)
      grouped by domain. Served read-only at GET /api/settings/rows. Every
      row is editable:false — settings here are IaC-declared, never clicked.
  nous:
    default: off
    phase: 11
    description: >
      Nous provider surface (issue #1561): the console's view over the
      gateway's Nous integration, served read-only at GET /api/nous/overview.
      Four sections — provider status/heartbeat, model catalog with per-model
      cost, credits plus burn rate, and tool-gateway usage. The declared
      catalog/rates/plans come from gateway/finops/provider-credits.yaml
      through its own reader; metered debits and per-model usage come from the
      durable usage store. The provider's published contract declares NO
      balance endpoint, so remainingUsd is null unless a plan is pinned and the
      payload says why — never a fabricated balance. The live half is ONE free
      unauthenticated GET {baseUrl}/models (never the billed chat path), gated
      on the credential #1748 declares and cached under both a TTL and a
      minimum probe interval so reloads cannot hammer a billed provider; a
      failed probe serves the last reading labelled stale with its measured
      age, never as a current value.
