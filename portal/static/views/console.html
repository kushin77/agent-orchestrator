<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Console — AgentConsole</title>
  <link rel="stylesheet" href="/design-tokens/tokens.css">
  <link rel="stylesheet" href="/css/console.css">
</head>
<body>
  <header class="view-topbar">
    <a class="mono" href="/views/shell.html">← console</a>
    <h1 style="font-size:var(--os-font-size-lg)">AgentConsole</h1>
    <span class="grow"></span>
    <span class="live-dot"></span>
    <span id="projectionState" class="badge info" data-state="connecting">connecting</span>
  </header>

  <main class="view-main" id="app">

    <section class="card spread" id="fleetStatus">
      <div class="flex" style="gap:var(--os-space-6);flex-wrap:wrap">
        <div>
          <div class="dim" style="font-size:var(--os-font-size-xs)">repo</div>
          <div class="mono" id="statusRepo">-</div>
        </div>
        <div>
          <div class="dim" style="font-size:var(--os-font-size-xs)">head</div>
          <div class="mono" id="statusHead">-</div>
        </div>
        <div>
          <div class="dim" style="font-size:var(--os-font-size-xs)">uptime</div>
          <div class="mono" id="statusUptime">up ?</div>
        </div>
        <div>
          <div class="dim" style="font-size:var(--os-font-size-xs)">now</div>
          <div class="mono" id="statusNow">-</div>
        </div>
      </div>
    </section>

    <div class="grid two">
      <section class="card">
        <div class="spread"><strong>Rungs</strong><span class="hint">heartbeat health</span></div>
        <table class="tbl">
          <thead><tr><th>rung</th><th>state</th><th>detail</th></tr></thead>
          <tbody id="rungsBody"></tbody>
        </table>
      </section>

      <section class="card">
        <div class="spread"><strong>Board / focus / pool</strong><span class="hint">waves, claims</span></div>
        <table class="tbl">
          <thead><tr><th>kind</th><th>key</th><th>state</th></tr></thead>
          <tbody id="boardBody"></tbody>
        </table>
      </section>
    </div>

    <section class="card">
      <div class="spread"><strong>Directives in flight</strong><span class="hint">dispatches</span></div>
      <table class="tbl">
        <thead><tr><th>from</th><th>to</th><th>type</th><th>lane</th></tr></thead>
        <tbody id="dispatchesBody"></tbody>
      </table>
    </section>

    <section class="card" id="steerPanel">
      <div class="spread">
        <strong>Steer</strong>
        <span class="hint">the closed control-verb vocabulary — never an arbitrary command</span>
      </div>
      <div id="steerState" class="hint" style="margin-top:var(--os-space-2)">loading vocabulary…</div>
      <div id="verbsBody" style="margin-top:var(--os-space-2)"></div>
    </section>

  </main>
  <script src="/js/api.js"></script>
  <script src="/js/operator.js"></script>
</body>
</html>
