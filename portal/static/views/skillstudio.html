<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Studio — agent-orchestrator console</title>
  <link rel="stylesheet" href="/design-tokens/tokens.css">
  <link rel="stylesheet" href="/css/console.css">
</head>
<body>
  <header class="view-topbar">
    <a class="mono" href="/views/shell.html">← console</a>
    <h1 style="font-size:var(--os-font-size-lg)">Skill Studio</h1>
    <span class="grow"></span>
    <span class="badge info" id="studioCount" data-count="0">0 skill(s)</span>
  </header>

  <main class="view-main" id="app"><div class="empty">loading…</div></main>
  <script src="/js/api.js"></script>
  <script>
    (async function () {
      var app = document.getElementById("app");
      var countBadge = document.getElementById("studioCount");
      var catalog = { categories: [], skills: [] };

      await refresh();
      render();

      function role() {
        return CP.tenant || "acme";
      }

      async function refresh() {
        try {
          var payload = await CP.get("/api/skillstudio/skills");
          catalog = payload.data || catalog;
          countBadge.textContent = (catalog.skills.length || 0) + " skill(s)";
          countBadge.dataset.count = String(catalog.skills.length || 0);
        } catch (err) {
          if (err.status === 401) { window.location.href = "/auth/login"; return; }
          CP.clear(app).appendChild(CP.el("div", {
            class: "empty error-text",
            text: "Skill Studio unavailable: " + err.message
          }));
          countBadge.textContent = err.code || "error";
          countBadge.className = "badge warn";
        }
      }

      function render() {
        CP.clear(app);
        app.appendChild(authorCard());
        app.appendChild(skillsCard());
      }

      function authorCard() {
        var fields = {
          skillId: CP.el("input", { class: "mono", id: "auth-skillId", placeholder: "skill id" }),
          skillVersion: CP.el("input", { class: "mono", id: "auth-skillVersion", placeholder: "1.0.0" }),
          category: CP.el("select", { id: "auth-category" }),
          description: CP.el("input", { id: "auth-description", placeholder: "one-line description" })
        };
        (catalog.categories || []).forEach(function (c) {
          fields.category.appendChild(CP.el("option", { value: c, text: c }));
        });
        var card = CP.el("div", { class: "card" },
          CP.el("h3", { text: "Author a skill" }),
          CP.el("div", { class: "hint dim", style: "margin:4px 0",
            text: "author → test → publish; the studio refuses a publish without green eval evidence" }),
          CP.el("div", { class: "flex", style: "gap:var(--os-space-3);flex-wrap:wrap;margin-top:8px" },
            CP.el("label", { class: "field", text: "skill id" }, fields.skillId),
            CP.el("label", { class: "field", text: "version" }, fields.skillVersion),
            CP.el("label", { class: "field", text: "category" }, fields.category),
            CP.el("label", { class: "field", text: "description" }, fields.description)),
          CP.el("button", {
            class: "btn primary small", style: "margin-top:8px",
            text: "author", onclick: doAuthor
          }));
        return card;
      }

      function skillsCard() {
        var card = CP.el("div", { class: "card" },
          CP.el("div", { class: "spread" },
            CP.el("strong", { text: "Authored skills" }),
            CP.el("span", { class: "hint", text: "workbook-9 lifecycle" })),
          CP.el("table", { class: "tbl" }));
        var table = card.querySelector("table");
        table.appendChild(CP.el("thead", {},
          CP.el("tr", {},
            CP.el("th", { text: "skill" }),
            CP.el("th", { text: "lifecycle" }),
            CP.el("th", { text: "evidence" }),
            CP.el("th", { text: "actions" }))));
        var tbody = CP.el("tbody");
        (catalog.skills || []).forEach(function (skill) {
          tbody.appendChild(CP.el("tr", {},
            CP.el("td", { class: "mono", text: skill.skillId + "@" + skill.skillVersion }),
            CP.el("td", {},
              CP.el("span", { class: "badge " + lifecycleClass(skill.skillLifecycle),
                text: skill.skillLifecycle })),
            CP.el("td", { class: "hint", text: skill.hasEvalEvidence ? "green" : "none" }),
            CP.el("td", {},
              CP.el("button", { class: "btn ghost small", text: "test",
                onclick: makeAction("test", skill) }),
              CP.el("button", { class: "btn small", style: "margin-left:6px", text: "publish",
                onclick: makeAction("publish", skill) }))));
        });
        table.appendChild(tbody);
        if (!(catalog.skills || []).length) {
          card.appendChild(CP.el("div", { class: "empty", text: "no skills authored yet" }));
        }
        return card;
      }

      function lifecycleClass(lc) {
        return lc === "published" ? "ok" : lc === "tested" ? "blue" :
               lc === "deprecated" ? "warn" : "info";
      }

      function makeAction(action, skill) {
        return function () {
          runAction(action, { skillId: skill.skillId, skillVersion: skill.skillVersion });
        };
      }

      async function doAuthor() {
        var skillId = document.getElementById("auth-skillId").value.trim();
        var skillVersion = document.getElementById("auth-skillVersion").value.trim();
        var category = document.getElementById("auth-category").value;
        var description = document.getElementById("auth-description").value.trim();
        if (!skillId || !skillVersion) { toast("skill id and version are required", true); return; }
        runAction("author", { skillId: skillId, skillVersion: skillVersion,
          category: category, description: description });
      }

      async function runAction(action, body) {
        var endpoints = {
          author: "/api/skillstudio/author",
          test: "/api/skillstudio/test",
          publish: "/api/skillstudio/publish"
        };
        try {
          var res = await CP.post(endpoints[action], body);
          var skill = (res.data && res.data.skill) || {};
          toast(action + " → " + (skill.skillLifecycle || "ok") +
            " (" + (res.data ? res.data.skillId : body.skillId) + ")");
          await refresh();
          render();
        } catch (err) {
          toast(action + " refused: " + err.message, true);
          await refresh();
          render();
        }
      }

      function toast(text, isError) {
        var bar = CP.el("div", {
          style: "position:fixed;bottom:14px;right:14px;z-index:50;padding:10px 14px;" +
                 "border-radius:8px;background:var(--os-color-surface);border:1px solid " +
                 (isError ? "var(--os-color-error)" : "var(--os-color-border)"),
          text: text
        });
        document.body.appendChild(bar);
        setTimeout(function () { bar.remove(); }, 3200);
      }
    })();
  </script>
</body>
</html>
