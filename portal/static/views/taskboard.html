<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Board — tenant</title>
  <link rel="stylesheet" href="/design-tokens/tokens.css">
  <link rel="stylesheet" href="/css/console.css">
</head>
<body>
  <header class="view-topbar">
    <a class="mono" href="/views/shell.html">← console</a>
    <h1 style="font-size:var(--os-font-size-lg)">Task Board</h1>
    <span id="tenantTag" class="mono dim"></span>
    <span class="grow"></span>
    <span id="boardSummary" class="badge" data-tickets="0" data-absent="0">—</span>
  </header>

  <main class="view-main" id="app"><div class="empty">loading…</div></main>

  <script src="/js/api.js"></script>
  <script>
    /* Tenant task board (issue #642 workbook-11, view via #1522).
     *
     * Every row is a REPLAY of the engine's durable event log through the
     * board's own read (`GET /api/taskboard/tickets`), never a second store —
     * so this frame renders the projection verbatim and re-derives nothing:
     *
     *   * the lifecycle vocabulary comes from the served `data.lifecycle`
     *     array (engine/core/tickets' own ``lifecycle_order``), not a list
     *     typed here; the client cannot offer a state the engine would refuse;
     *   * the legal next states come from `GET /api/taskboard/moves/<state>`,
     *     the model's own ``legal_moves`` — the frame hard-codes no state
     *     machine;
     *   * a ticket the log does not contain is served in the board's `absent`
     *     list and is named here, never silently dropped and never invented.
     */
    (async function () {
      "use strict";
      var app = document.getElementById("app");
      var summary = document.getElementById("boardSummary");
      var tenantId = CP.tenant || "acme";
      document.getElementById("tenantTag").textContent =
        tenantId + " · ticket lifecycle (engine event-log replay)";

      var base = "/api/taskboard/tickets?tenant=" + encodeURIComponent(tenantId);
      var lifecycle = [];

      /* Presentation only: a colour per known state. An unknown state renders
       * with the neutral badge — this map never decides which states exist. */
      function stateBadge(state) {
        var cls = {
          created: "blue", decomposed: "info", dispatched: "info",
          executed: "info", reviewed: "warn", closed: "ok"
        }[state] || "";
        return CP.el("span", { class: "badge " + cls, text: state });
      }

      function fail(err) {
        if (err.status === 401) { window.location.href = "/auth/login"; return; }
        var card = CP.el("div", { class: "card" },
          CP.el("div", { class: "empty error-text", text: err.message }));
        if (err.code === "feature_disabled") {
          card.appendChild(CP.el("div", { class: "hint", text:
            "The tenant task board ships feature-flag-gated OFF " +
            "(portal/config/feature-flags.yaml surfaces.task_board)." }));
        }
        CP.clear(app).appendChild(card);
      }

      function lifecycleStrip(reached) {
        var strip = CP.el("div", { class: "flex", style: "gap:var(--os-space-2);flex-wrap:wrap" });
        lifecycle.forEach(function (state) {
          var done = reached.indexOf(state) !== -1;
          strip.appendChild(CP.el("span", {
            class: "chip" + (done ? "" : " dim"),
            "data-state": state,
            "data-reached": done ? "1" : "0",
            text: state
          }));
        });
        return strip;
      }

      function detail(ticket) {
        var card = CP.el("section", { class: "card", id: "ticketDetail" });
        card.appendChild(CP.el("div", { class: "spread" },
          CP.el("div", {},
            CP.el("span", { class: "mono dim", text: "ticket" }),
            CP.el("h3", { class: "mono", text: ticket.ticketId })),
          CP.el("div", { class: "flex" },
            stateBadge(ticket.state),
            ticket.closed ? CP.el("span", { class: "badge ok", text: "closed" }) : null,
            ticket.approved ? CP.el("span", { class: "badge ok", text: "approved" }) : null)));

        card.appendChild(lifecycleStrip(ticket.lifecycle || []));

        var grid = CP.el("div", { class: "grid two", style: "margin-top:var(--os-space-3)" });
        var facts = CP.el("div", { class: "card" });
        facts.appendChild(CP.el("div", { class: "spread" },
          CP.el("strong", { text: "Dispatch" }),
          CP.el("span", { class: "hint", text: "engine lane + queue" })));
        var dispatch = ticket.dispatch;
        facts.appendChild(CP.el("table", { class: "tbl" },
          CP.el("tbody", {},
            CP.el("tr", {},
              CP.el("td", { class: "dim", text: "lane" }),
              CP.el("td", { class: "mono", text: dispatch ? dispatch.lane : "—" })),
            CP.el("tr", {},
              CP.el("td", { class: "dim", text: "queue" }),
              CP.el("td", { class: "mono", text: dispatch ? dispatch.queue : "—" })),
            CP.el("tr", {},
              CP.el("td", { class: "dim", text: "dispatched at" }),
              CP.el("td", { class: "mono", text: dispatch ? dispatch.dispatched_at : "—" })),
            CP.el("tr", {},
              CP.el("td", { class: "dim", text: "correlation" }),
              CP.el("td", { class: "mono", text: ticket.correlationId || "—" })))));
        grid.appendChild(facts);

        var moves = CP.el("div", { class: "card", id: "legalMoves" });
        moves.appendChild(CP.el("div", { class: "spread" },
          CP.el("strong", { text: "Legal next states" }),
          CP.el("span", { class: "hint", text: "the model's own legal_moves" })));
        moves.appendChild(CP.el("div", { class: "empty dim", text: "…" }));
        grid.appendChild(moves);
        card.appendChild(grid);

        var decomp = ticket.decomposition;
        if (decomp) {
          var dc = CP.el("section", { class: "card", style: "margin-top:var(--os-space-3)" });
          dc.appendChild(CP.el("div", { class: "spread" },
            CP.el("strong", { text: "Decomposition" }),
            CP.el("span", { class: "hint mono", text:
              "mission " + decomp.mission_id + " · " + decomp.rounds + " round(s) · " +
              decomp.subtask_count + " subtask(s)" })));
          dc.appendChild(CP.el("div", { class: "hint", text: decomp.summary }));
          var ft = CP.el("table", { class: "tbl" });
          ft.appendChild(CP.el("thead", {},
            CP.el("tr", {},
              CP.el("th", { text: "Subtask" }), CP.el("th", { text: "Lane" }),
              CP.el("th", { text: "Agent" }), CP.el("th", { text: "Confidence" }))));
          var fb = CP.el("tbody");
          (decomp.findings || []).forEach(function (finding) {
            fb.appendChild(CP.el("tr", {},
              CP.el("td", { class: "mono", text: finding.subtask_id }),
              CP.el("td", { class: "mono", text: finding.lane_id }),
              CP.el("td", { class: "mono", text: finding.agent_id }),
              CP.el("td", { class: "mono", text: String(finding.confidence) })));
          });
          ft.appendChild(fb);
          dc.appendChild(ft);
          card.appendChild(dc);
        }

        var execution = ticket.execution;
        if (execution) {
          card.appendChild(CP.el("section", { class: "card", style: "margin-top:var(--os-space-3)" },
            CP.el("div", { class: "spread" },
              CP.el("strong", { text: "Execution" }),
              CP.el("span", { class: execution.resolved ? "badge ok" : "badge warn",
                text: execution.resolved ? "resolved" : "unresolved" })),
            CP.el("div", { class: "hint", text:
              execution.subtask_count + " subtask(s) · " + execution.rounds + " round(s) · " +
              (execution.failures || []).length + " failure(s) · " +
              (execution.escalated || []).length + " escalated · executed " +
              execution.executed_at })));
        }
        return card;
      }

      async function openTicket(ticketId) {
        CP.clear(app);
        app.appendChild(CP.el("div", { class: "empty dim", text: "loading " + ticketId + "…" }));
        var ticket;
        try {
          var one = await CP.get(base + "/" + encodeURIComponent(ticketId));
          ticket = one.data.ticket;
        } catch (err) { fail(err); return; }
        CP.clear(app);
        app.appendChild(CP.el("button", { class: "btn ghost small", text: "← all tickets",
          onclick: function () { load(); } }));
        app.appendChild(detail(ticket));
        try {
          var moves = await CP.get(
            "/api/taskboard/moves/" + encodeURIComponent(ticket.state) +
            "?tenant=" + encodeURIComponent(tenantId));
          var box = document.getElementById("legalMoves");
          var list = moves.data.moves || [];
          CP.clear(box);
          box.appendChild(CP.el("div", { class: "spread" },
            CP.el("strong", { text: "Legal next states" }),
            CP.el("span", { class: "hint", text: "the model's own legal_moves" })));
          box.appendChild(list.length
            ? CP.el("div", { class: "flex", style: "gap:var(--os-space-2)" },
                list.map(function (state) {
                  return CP.el("span", { class: "chip", "data-move": state, text: state });
                }))
            : CP.el("div", { class: "hint", "data-move": "", text:
                "terminal — the model offers no next state from " + ticket.state }));
        } catch (err) {
          if (err.status !== 401) {
            var box2 = document.getElementById("legalMoves");
            if (box2) CP.clear(box2).appendChild(
              CP.el("div", { class: "hint", text: err.message }));
          }
        }
      }

      async function load() {
        var payload;
        try {
          payload = await CP.get(base);
        } catch (err) { fail(err); return; }
        var data = payload.data;
        lifecycle = data.lifecycle || [];
        var tickets = data.tickets || [];
        var absent = data.absent || [];
        summary.textContent = tickets.length + " ticket(s)" +
          (absent.length ? " · " + absent.length + " absent" : "");
        summary.setAttribute("data-tickets", String(tickets.length));
        summary.setAttribute("data-absent", String(absent.length));

        CP.clear(app);
        app.appendChild(CP.el("section", { class: "card" },
          CP.el("div", { class: "spread" },
            CP.el("strong", { text: "Lifecycle" }),
            CP.el("span", { class: "hint mono", text:
              "engine/core/tickets — the vocabulary the board serves" })),
          lifecycleStrip(lifecycle.slice())));

        if (absent.length) {
          app.appendChild(CP.el("section", { class: "card", id: "absentTickets" },
            CP.el("div", { class: "spread" },
              CP.el("strong", { text: "Listed but absent from the log" }),
              CP.el("span", { class: "hint", text: "named, not dropped" })),
            CP.el("div", { class: "chip", text: absent.join(", ") })));
        }

        if (!tickets.length) {
          app.appendChild(CP.el("div", { class: "card empty dim",
            text: "No ticket for tenant " + tenantId + " — an empty board is valid, not broken." }));
          return;
        }

        var card = CP.el("section", { class: "card" });
        var table = CP.el("table", { class: "tbl", id: "ticketTable" });
        table.appendChild(CP.el("thead", {},
          CP.el("tr", {},
            CP.el("th", { text: "Ticket" }), CP.el("th", { text: "State" }),
            CP.el("th", { text: "Reached" }), CP.el("th", { text: "Closed" }),
            CP.el("th", { text: "Approved" }), CP.el("th", {}))));
        var body = CP.el("tbody");
        tickets.forEach(function (ticket) {
          body.appendChild(CP.el("tr", { "data-ticket": ticket.ticketId },
            CP.el("td", { class: "mono", html: "<b>" + CP.esc(ticket.ticketId) + "</b>" }),
            CP.el("td", {}, stateBadge(ticket.state)),
            CP.el("td", { class: "mono dim",
              text: (ticket.lifecycle || []).length + " / " + lifecycle.length }),
            CP.el("td", { class: "mono", text: ticket.closed ? "yes" : "no" }),
            CP.el("td", { class: "mono", text: ticket.approved ? "yes" : "no" }),
            CP.el("td", {}, CP.el("button", { class: "btn small", text: "open",
              onclick: function () { openTicket(ticket.ticketId); } }))));
        });
        table.appendChild(body);
        card.appendChild(table);
        app.appendChild(card);
      }

      await load();
    })();
  </script>
</body>
</html>
