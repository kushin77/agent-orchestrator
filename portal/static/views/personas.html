<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personas — tenant</title>
  <link rel="stylesheet" href="/design-tokens/tokens.css">
  <link rel="stylesheet" href="/css/console.css">
</head>
<body>
  <header class="view-topbar">
    <a class="mono" href="/views/shell.html">← console</a>
    <h1 style="font-size:var(--os-font-size-lg)">Personas</h1>
    <span class="grow"></span>
  </header>
  <main class="view-main" id="app"><div class="empty">loading…</div></main>
  <script src="/js/api.js"></script>
  <script>
    (async function () {
      var app = document.getElementById("app");
      var tenantId = CP.tenant || "acme";
      try {
        var payload = await CP.get("/api/tenants/" + encodeURIComponent(tenantId) + "/personas");
        render(payload.data.personas);
      } catch (err) {
        if (err.status === 401) { window.location.href = "/views/login.html"; return; }
        CP.clear(app).appendChild(CP.el("div", { class: "empty error-text", text: err.message }));
      }
      function render(personas) {
        CP.clear(app);
        app.appendChild(CP.el("div", { class: "hint", style: "margin-bottom:10px",
          text: "Persona catalog (registry/personas cards) visible to tenant " + tenantId + "." }));
        var grid = CP.el("div", { class: "grid two" });
        personas.forEach(function (persona) {
          grid.appendChild(CP.el("div", { class: "card" },
            CP.el("div", { class: "spread" },
              CP.el("h3", { text: persona.name }),
              CP.el("span", { class: "badge blue", text: persona.personaId })),
            CP.el("div", { class: "hint", style: "margin:6px 0",
              text: "owned by " + persona.owner }),
            CP.el("div", {}, (persona.capabilityTags || []).map(function (tag) {
              return CP.el("span", { class: "chip", text: tag });
            }))));
        });
        app.appendChild(grid);
      }
    })();
  </script>
</body>
</html>
