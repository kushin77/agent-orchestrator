<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinOps — tenant</title>
  <link rel="stylesheet" href="/design-tokens/tokens.css">
  <link rel="stylesheet" href="/css/console.css">
</head>
<body>
  <header class="view-topbar">
    <a class="mono" href="/views/shell.html">← console</a>
    <h1 style="font-size:var(--os-font-size-lg)">FinOps</h1>
    <span class="grow"></span>
    <span id="window" class="mono"></span>
  </header>
  <main class="view-main" id="app"><div class="empty">loading…</div></main>
  <script src="/js/api.js"></script>
  <script>
    (async function () {
      var app = document.getElementById("app");
      var tenantId = CP.tenant || "acme";
      try {
        var payload = await CP.get("/api/finops/report?tenant=" + encodeURIComponent(tenantId));
        render(payload.data);
      } catch (err) {
        if (err.status === 401) { window.location.href = "/auth/login"; return; }
        CP.clear(app).appendChild(CP.el("div", { class: "empty error-text", text: err.message }));
      }
      function verdictClass(verdict) {
        if (!verdict) return "info";
        if (verdict === "OK") return "ok";
        if (verdict === "WARNING") return "warn";
        return "err";
      }
      function render(data) {
        CP.clear(app);
        document.getElementById("window").textContent = data.window ? data.window.month : "";
        app.appendChild(costCard(data));
        app.appendChild(budgetCard(data));
        app.appendChild(usageCard(data));
        app.appendChild(groupTable("Agents", data.agents, "agentId"));
        app.appendChild(groupTable("Models", data.models, "model"));
        app.appendChild(alertsCard(data));
      }
      function costCard(data) {
        var cost = data.cost || {};
        var known = cost.costKnown;
        var amount = cost.attributedCostUsd;
        var verdict = data.alerts && data.alerts.verdict;
        return CP.el("div", { class: "card" },
          CP.el("div", { class: "spread" },
            CP.el("h3", { text: "Attributed cost" }),
            CP.el("span", { class: "badge " + verdictClass(verdict), text: verdict || "no data" })),
          CP.el("div", { class: "mono", style: "font-size:20px;margin:6px 0",
            text: known ? CP.money(amount) : "unknown (unmetered)" }),
          CP.el("div", { class: "hint", text: data.mode ? ("enforcement mode: " + data.mode) : "" }));
      }
      function budgetCard(data) {
        var budget = data.budget || {};
        if (!budget.configured) {
          return CP.el("div", { class: "card" },
            CP.el("h3", { text: "Budget" }),
            CP.el("div", { class: "hint", text: budget.reason || "no budget policy declared" }));
        }
        var limit = budget.costLimit ? budget.costLimit.limit : null;
        return CP.el("div", { class: "card" },
          CP.el("h3", { text: "Budget" }),
          CP.el("div", { class: "spread", style: "margin:6px 0" },
            CP.el("span", { class: "mono", text: limit == null ? "no cost limit" : CP.money(limit) }),
            CP.el("span", { class: "hint", text: budget.mode || "" })));
      }
      function usageCard(data) {
        var usage = data.usage || {};
        return CP.el("div", { class: "card" },
          CP.el("h3", { text: "Usage" }),
          CP.el("div", { class: "spread", style: "margin:6px 0" },
            CP.el("span", { class: "mono", text: CP.num(usage.calls) + " calls" }),
            CP.el("span", { class: "mono", text: CP.num(usage.tokens) + " tokens" }),
            CP.el("span", { class: "mono", text: CP.num(usage.cacheHits) + " cache hits" })));
      }
      function groupTable(title, rows, idKey) {
        if (!rows || !rows.length) return CP.el("div");
        var table = CP.el("table", { class: "tbl" });
        table.appendChild(CP.el("thead", {}, CP.el("tr", {},
          CP.el("th", { text: idKey === "model" ? "Provider / model" : "Agent" }),
          CP.el("th", { class: "num", text: "Calls" }),
          CP.el("th", { class: "num", text: "Tokens" }),
          CP.el("th", { class: "num", text: "Cost" }),
          CP.el("th", { class: "num", text: "Share" }))));
        var tbody = CP.el("tbody");
        rows.forEach(function (row) {
          tbody.appendChild(CP.el("tr", {},
            CP.el("td", { text: row[idKey] || "(unknown)" }),
            CP.el("td", { class: "num", text: CP.num(row.calls) }),
            CP.el("td", { class: "num", text: CP.num(row.tokens) }),
            CP.el("td", { class: "num", text: row.costKnown ? CP.money(row.costUsd) : "unknown" }),
            CP.el("td", { class: "num", text: row.shareOfTenantCostPct == null ? "—" : row.shareOfTenantCostPct + "%" })));
        });
        table.appendChild(tbody);
        return CP.el("div", { class: "card" }, CP.el("h3", { text: title }), table);
      }
      function alertsCard(data) {
        var alerts = data.alerts || {};
        var fired = alerts.fired || [];
        if (!fired.length) return CP.el("div");
        var card = CP.el("div", { class: "card" }, CP.el("h3", { text: "Spend alerts" }));
        fired.forEach(function (alert) {
          card.appendChild(CP.el("div", { class: "feed-item" },
            CP.el("span", { class: "feed-dot " + (alert.blocks ? "err" : "warn") }),
            CP.el("div", { style: "flex:1" },
              CP.el("div", {}, CP.el("span", { class: "mono", text: alert.code || alert.kind })),
              CP.el("div", { class: "hint", text: alert.message || "" }))));
        });
        return card;
      }
    })();
  </script>
</body>
</html>
