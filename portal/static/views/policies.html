<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Policies — tenant</title>
  <link rel="stylesheet" href="/design-tokens/tokens.css">
  <link rel="stylesheet" href="/css/console.css">
</head>
<body>
  <header class="view-topbar">
    <a class="mono" href="/views/shell.html">← console</a>
    <h1 style="font-size:var(--os-font-size-lg)">Policies / Controls</h1>
    <span class="grow"></span>
    <span class="badge warn">default OFF</span>
  </header>
  <main class="view-main" id="app"><div class="empty">loading…</div></main>
  <script src="/js/api.js"></script>
  <script>
    (async function () {
      var app = document.getElementById("app");
      var tenantId = CP.tenant || "acme";
      var me = (await CP.get("/api/console/me")).data;
      var role = roleIn(tenantId, me);
      var mayManage = me.superAdmin || role === "owner";
      try {
        var payload = await CP.get("/api/tenants/" + encodeURIComponent(tenantId) + "/controls");
        render(payload.data);
      } catch (err) {
        if (err.status === 401) { window.location.href = "/views/login.html"; return; }
        CP.clear(app).appendChild(CP.el("div", { class: "empty error-text", text: err.message }));
      }
      function roleIn(tenantId, me) {
        var binding = (me.bindings || []).find(function (b) { return b.tenantId === tenantId; });
        return binding ? binding.role : "";
      }
      function toggle(control) {
        return async function () {
          var on = this.checked;
          try {
            var res = await CP.post(
              "/api/tenants/" + encodeURIComponent(tenantId) + "/controls/" +
              encodeURIComponent(control.id), { enabled: on });
            var decision = (res.data.gatedDecisions || [])
              .map(function (d) { return d.action + "=" + d.decision; })
              .join(", ");
            toast((on ? "Enabled " : "Disabled ") + control.id +
              (decision ? " → " + decision : ""));
          } catch (err) {
            this.checked = !on;
            toast("Failed: " + err.message, true);
          }
        };
      }
      function render(data) {
        CP.clear(app);
        if (!mayManage) {
          app.appendChild(CP.el("div", { class: "card hint", text:
            "Your role (" + (role || "none") + ") can read controls but cannot flip them — " +
            "policy:manage is refused server-side (owner/super-admin only)." }));
        }
        data.controls.forEach(function (control) {
          var card = CP.el("div", { class: "card spread" },
            CP.el("div", { style: "flex:1" },
              CP.el("div", { class: "spread" },
                CP.el("h3", { text: control.name }),
                CP.el("span", { class: "badge " + (control.source === "guardrails" ? "blue" : "info"),
                  text: control.source })),
              CP.el("div", { class: "dim", style: "margin:4px 0", text: control.description }),
              CP.el("div", { class: "hint mono",
                text: "id=" + control.id + " · mode=" + control.mode +
                      " · gates [" + (control.gatedActions || []).join(", ") + "]" })),
            CP.el("label", { class: "switch", title: control.id },
              CP.el("input", {
                type: "checkbox",
                checked: control.enabled,
                disabled: !mayManage,
                onchange: toggle(control)
              }),
              CP.el("span", { class: "slider" })));
          app.appendChild(card);
        });
        app.appendChild(CP.el("div", { class: "card" },
          CP.el("h3", { text: "Control → policy mapping (server-side)" }),
          CP.el("div", { class: "hint", style: "margin-bottom:8px",
            text: "Every toggle maps to a server-side policy control. Flipping one writes " +
                  "PolicyStateStore (default OFF) and the gated action's enforcement decision changes." }),
          CP.el("div", { class: "mono", style: "font-size:12px", html: JSON.stringify(data.policyMap, null, 1) })));
      }
      function toast(text, isError) {
        var bar = CP.el("div", {
          style: "position:fixed;bottom:14px;right:14px;z-index:50;padding:10px 14px;" +
                 "border-radius:8px;background:var(--os-color-surface);border:1px solid " +
                 (isError ? "var(--os-color-error)" : "var(--os-color-border)");
          text: text
        });
        document.body.appendChild(bar);
        setTimeout(function () { bar.remove(); }, 3200);
      }
    })();
  </script>
</body>
</html>
