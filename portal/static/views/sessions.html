<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sessions — agent-orchestrator console</title>
  <link rel="stylesheet" href="/design-tokens/tokens.css">
  <link rel="stylesheet" href="/css/console.css">
</head>
<body>
  <header class="view-topbar">
    <a class="mono" href="/views/shell.html">← console</a>
    <h1 style="font-size:var(--os-font-size-lg)">Sessions</h1>
    <span class="hint" style="font-size:var(--os-font-size-xs)">cross-engine session roster</span>
    <span class="grow"></span>
    <span id="sessionCounts" class="badge" data-rows="0" data-missing="0">—</span>
  </header>

  <main class="view-main" id="app"><div class="empty">loading…</div></main>

  <script src="/js/api.js"></script>
  <script>
    /* The cross-engine Sessions view (issue #1563, spog v1).
     *
     * Joins .fleet/claims/*, .board/claims.jsonl and .deepseek-agent/sessions/*
     * — every session GET /api/sessions/rows serves is one of those files, read
     * fresh, never a second store. A root absent from this checkout is named in
     * data.missing rather than silently dropped: that engine's column renders
     * "not reporting" instead of vanishing from the page.
     */
    (async function () {
      "use strict";
      var app = document.getElementById("app");
      var counts = document.getElementById("sessionCounts");

      function fail(err) {
        if (err.status === 401) { window.location.href = "/auth/login"; return; }
        var card = CP.el("div", { class: "card" },
          CP.el("div", { class: "empty error-text", text: err.message }));
        if (err.code === "feature_disabled") {
          card.appendChild(CP.el("div", { class: "hint", text:
            "The sessions view ships feature-flag-gated OFF " +
            "(portal/config/feature-flags.yaml surfaces.sessions)." }));
        }
        CP.clear(app).appendChild(card);
      }

      function table(rows) {
        var tbl = CP.el("table", { class: "tbl", id: "sessionsTable" });
        tbl.appendChild(CP.el("thead", {},
          CP.el("tr", {},
            CP.el("th", { text: "Engine" }), CP.el("th", { text: "Issue" }),
            CP.el("th", { text: "Branch" }), CP.el("th", { text: "State" }),
            CP.el("th", { text: "Agent" }), CP.el("th", { text: "Lane" }),
            CP.el("th", { text: "Age" }))));
        var body = CP.el("tbody");
        rows.forEach(function (row) {
          body.appendChild(CP.el("tr", { "data-engine": row.engine },
            CP.el("td", { class: "mono", text: row.engine }),
            CP.el("td", { class: "mono", text: row.issue != null ? "#" + row.issue : "—" }),
            CP.el("td", { class: "mono", text: row.branch || "—" }),
            CP.el("td", {}, CP.el("span", { class: "badge info", text: row.state || "—" })),
            CP.el("td", { class: "mono", text: row.agent || "—" }),
            CP.el("td", { class: "mono", text: row.lane || "—" }),
            CP.el("td", { class: "mono dim", text: row.age || "—" })));
        });
        tbl.appendChild(body);
        return tbl;
      }

      var payload;
      try {
        payload = await CP.get("/api/sessions/rows");
      } catch (err) { fail(err); return; }

      var data = payload.data || {};
      var rows = data.sessions || [];
      var missing = data.missing || [];
      counts.textContent = rows.length + " session(s)" +
        (missing.length ? " · " + missing.length + " not reporting" : "");
      counts.setAttribute("data-rows", String(rows.length));
      counts.setAttribute("data-missing", String(missing.length));

      CP.clear(app);

      var schemaCard = CP.el("section", { class: "card" },
        CP.el("div", { class: "spread" },
          CP.el("strong", { text: "Source of truth" }),
          CP.el("span", { class: "hint mono", text:
            ".fleet/claims + .board/claims.jsonl + .deepseek-agent/sessions · " + data.schema })));
      app.appendChild(schemaCard);

      if (missing.length) {
        var mc = CP.el("section", { class: "card", id: "notReporting" });
        mc.appendChild(CP.el("div", { class: "spread" },
          CP.el("strong", { text: "Not reporting" }),
          CP.el("span", { class: "hint", text: "a root absent from this checkout is named, never omitted" })));
        var chips = CP.el("div", { style: "display:flex;gap:var(--os-space-2);flex-wrap:wrap" });
        missing.forEach(function (engine) {
          chips.appendChild(CP.el("span", { class: "chip", "data-not-reporting": engine, text: engine }));
        });
        mc.appendChild(chips);
        app.appendChild(mc);
      }

      var card = CP.el("section", { class: "card" });
      if (rows.length) {
        card.appendChild(table(rows));
      } else {
        card.appendChild(CP.el("div", { class: "empty dim", text: "No live session." }));
      }
      app.appendChild(card);
    })();
  </script>
</body>
</html>
