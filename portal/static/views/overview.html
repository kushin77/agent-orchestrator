<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overview — tenant</title>
  <link rel="stylesheet" href="/design-tokens/tokens.css">
  <link rel="stylesheet" href="/css/console.css">
</head>
<body>
  <header class="view-topbar">
    <a class="mono" href="/views/shell.html">← console</a>
    <h1 style="font-size:var(--os-font-size-lg)">Tenant overview</h1>
    <span id="tenantTag" class="mono dim"></span>
    <span class="grow"></span>
    <span id="statusBadge"></span>
  </header>
  <main class="view-main" id="app"><div class="empty">loading…</div></main>
  <script src="/js/api.js"></script>
  <script>
    (async function () {
      var app = document.getElementById("app");
      var tenantId = CP.tenant || "acme";
      document.getElementById("tenantTag").textContent = tenantId;
      try {
        var payload = await CP.get("/api/tenants/" + encodeURIComponent(tenantId) + "/overview");
        render(payload.data);
      } catch (err) {
        if (err.status === 401) { window.location.href = "/views/login.html"; return; }
        CP.clear(app).appendChild(CP.el("div", { class: "empty error-text", text: err.message }));
      }
      function render(data) {
        CP.clear(app);
        document.getElementById("statusBadge").innerHTML = "";
        document.getElementById("statusBadge").appendChild(
          CP.el("span", {
            class: "badge " + (data.paused ? "warn" : "ok"),
            text: data.paused ? "paused" : data.subscriptionStatus
          }));
        var stats = data.stats;
        var card = CP.el("div", { class: "card" },
          CP.el("div", { class: "grid stats" },
            stat("Agents", stats.agents, stats.teams.join(" · ")),
            stat("Active", stats.active, "of " + stats.agents + " agents"),
            stat("Registered", stats.registered, "awaiting activation"),
            stat("Paused", stats.paused, "paused agents"),
            stat("Audit events", stats.auditEvents, "tamper-evident chain"),
            stat("Budget", stats.budgetUtilizationPct + "%", "of monthly cap"),
            stat("Pending approvals", stats.pendingApprovals, "destructive ops")));
        app.appendChild(card);
        app.appendChild(CP.el("div", { class: "card" },
          CP.el("h3", { text: "Organization tree" }),
          CP.el("div", { class: "hint", style: "margin-bottom:8px",
            text: "Org → teams → agents (identity/rbac Org-as-tenant, issue #12)." }),
          CP.el("div", { class: "tree", html: treeHtml(stats.teams) })));
      }
      function stat(k, v, s) {
        return CP.el("div", { class: "stat" },
          CP.el("div", { class: "k", text: k }),
          CP.el("div", { class: "v", text: v }),
          CP.el("div", { class: "s", text: s }));
      }
      function treeHtml(teams) {
        return "<ul>" + teams.map(function (team) {
          return "<li><span class='team-label'>" + CP.esc(team) + "</span></li>";
        }).join("") + "</ul>";
      }
    })();
  </script>
</body>
</html>
