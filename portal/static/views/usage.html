<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usage — tenant</title>
  <link rel="stylesheet" href="/design-tokens/tokens.css">
  <link rel="stylesheet" href="/css/console.css">
</head>
<body>
  <header class="view-topbar">
    <a class="mono" href="/views/shell.html">← console</a>
    <h1 style="font-size:var(--os-font-size-lg)">Usage</h1>
    <span class="grow"></span>
    <span class="badge info">metered</span>
  </header>
  <main class="view-main" id="app"><div class="empty">loading…</div></main>
  <script src="/js/api.js"></script>
  <script>
    (async function () {
      var app = document.getElementById("app");
      var tenantId = CP.tenant || "acme";
      try {
        var payload = await CP.get("/api/tenants/" + encodeURIComponent(tenantId) + "/usage");
        render(payload.data);
      } catch (err) {
        if (err.status === 401) { window.location.href = "/views/login.html"; return; }
        CP.clear(app).appendChild(CP.el("div", { class: "empty error-text", text: err.message }));
      }
      function render(data) {
        CP.clear(app);
        var totals = data.totals;
        app.appendChild(CP.el("div", { class: "grid stats" },
          CP.el("div", { class: "stat" }, CP.el("div", { class: "k", text: "Model calls" }),
            CP.el("div", { class: "v", text: CP.num(totals.calls) })),
          CP.el("div", { class: "stat" }, CP.el("div", { class: "k", text: "Tokens" }),
            CP.el("div", { class: "v", text: CP.num(totals.tokens) })),
          CP.el("div", { class: "stat" }, CP.el("div", { class: "k", text: "Cost" }),
            CP.el("div", { class: "v", text: CP.money(totals.costUsd) }))));
        app.appendChild(CP.el("div", { class: "card" },
          CP.el("h3", { text: "Daily series" }),
          CP.el("table", { class: "tbl" })));
        var table = app.querySelectorAll("table")[app.querySelectorAll("table").length - 1];
        table.appendChild(CP.el("thead", {},
          CP.el("tr", {}, CP.el("th", { text: "Day" }),
            CP.el("th", { text: "Vendor / model" }),
            CP.el("th", { class: "num", text: "Calls" }),
            CP.el("th", { class: "num", text: "Tokens" }),
            CP.el("th", { class: "num", text: "Cost" }))));
        var tbody = CP.el("tbody");
        data.series.forEach(function (point) {
          tbody.appendChild(CP.el("tr", {},
            CP.el("td", { class: "mono", text: point.day }),
            CP.el("td", { class: "mono", text: point.vendor + " / " + point.model }),
            CP.el("td", { class: "num", text: CP.num(point.calls) }),
            CP.el("td", { class: "num", text: CP.num(point.tokens) }),
            CP.el("td", { class: "num", text: CP.money(point.costUsd) })));
        });
        table.appendChild(tbody);
      }
    })();
  </script>
</body>
</html>
