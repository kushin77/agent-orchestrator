<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ops / SLO — tenant</title>
  <link rel="stylesheet" href="/design-tokens/tokens.css">
  <link rel="stylesheet" href="/css/console.css">
</head>
<body>
  <header class="view-topbar">
    <a class="mono" href="/views/shell.html">← console</a>
    <h1 style="font-size:var(--os-font-size-lg)">Ops / SLO</h1>
    <span class="grow"></span>
    <span id="window" class="mono"></span>
  </header>
  <main class="view-main" id="app"><div class="empty">loading…</div></main>
  <script src="/js/api.js"></script>
  <script>
    (async function () {
      var app = document.getElementById("app");
      var tenantId = CP.tenant || "acme";
      try {
        var payload = await CP.get("/api/ops/dashboard?tenant=" + encodeURIComponent(tenantId));
        render(payload.data);
      } catch (err) {
        if (err.status === 401) { window.location.href = "/auth/login"; return; }
        CP.clear(app).appendChild(CP.el("div", { class: "empty error-text", text: err.message }));
      }
      function verdictClass(verdict) {
        if (verdict === "OK") return "ok";
        if (verdict === "WARNING") return "warn";
        if (verdict === "BREACHED" || verdict === "ALERT") return "err";
        return "info";
      }
      function render(data) {
        CP.clear(app);
        document.getElementById("window").textContent = data.generatedAt ? data.generatedAt.slice(0, 16).replace("T", " ") : "";
        app.appendChild(tenantCard(data));
        app.appendChild(sloTable(data));
        app.appendChild(burnCard(data));
        app.appendChild(alertsCard(data));
      }
      function tenantCard(data) {
        var row = (data.tenants || []).filter(function (t) { return t.tenantId === tenantId; })[0];
        if (!row) {
          return CP.el("div", { class: "card" },
            CP.el("h3", { text: "Health" }),
            CP.el("div", { class: "hint", text: "no telemetry for this tenant" }));
        }
        var p95 = row.latencyP95Ms;
        return CP.el("div", { class: "card" },
          CP.el("h3", { text: "Health" }),
          CP.el("div", { class: "spread", style: "margin:6px 0" },
            CP.el("span", { class: "mono", text: CP.num(row.calls) + " calls" }),
            CP.el("span", { class: "mono", text: CP.num(row.served) + " served" }),
            CP.el("span", { class: "mono", text: CP.num(row.failed) + " failed" })),
          CP.el("div", { class: "spread", style: "margin:6px 0" },
            CP.el("span", { class: "mono", text: CP.num(row.tokens) + " tokens" }),
            CP.el("span", { class: "mono", text: p95 == null ? "p95 —" : "p95 " + p95 + " ms" }),
            CP.el("span", { class: "mono", text: CP.money(row.estimatedCostUsd) })));
      }
      function sloTable(data) {
        var results = data.sloResults || [];
        if (!results.length) return CP.el("div");
        var table = CP.el("table", { class: "tbl" });
        table.appendChild(CP.el("thead", {}, CP.el("tr", {},
          CP.el("th", { text: "SLO" }),
          CP.el("th", { text: "Kind" }),
          CP.el("th", { class: "num", text: "Attempts" }),
          CP.el("th", { class: "num", text: "Bad" }),
          CP.el("th", { text: "Verdict" }))));
        var tbody = CP.el("tbody");
        results.forEach(function (r) {
          tbody.appendChild(CP.el("tr", {},
            CP.el("td", { text: r.slo }),
            CP.el("td", { text: r.kind || "" }),
            CP.el("td", { class: "num", text: CP.num(r.attempts) }),
            CP.el("td", { class: "num", text: CP.num(r.badCount) }),
            CP.el("td", {}, CP.el("span", { class: "badge " + verdictClass(r.verdict), text: r.verdict }))));
        });
        table.appendChild(tbody);
        return CP.el("div", { class: "card" }, CP.el("h3", { text: "SLO verdicts" }), table);
      }
      function burnCard(data) {
        var rows = data.burnRate || [];
        if (!rows.length) return CP.el("div");
        var table = CP.el("table", { class: "tbl" });
        table.appendChild(CP.el("thead", {}, CP.el("tr", {},
          CP.el("th", { text: "SLO" }),
          CP.el("th", { class: "num", text: "Budget consumed" }),
          CP.el("th", { text: "Verdict" }))));
        var tbody = CP.el("tbody");
        rows.forEach(function (b) {
          var ratio = b.budgetConsumedRatio;
          tbody.appendChild(CP.el("tr", {},
            CP.el("td", { text: b.slo }),
            CP.el("td", { class: "num", text: ratio == null ? "—" : Math.round(ratio * 100) + "%" }),
            CP.el("td", {}, CP.el("span", { class: "badge " + verdictClass(b.verdict), text: b.verdict }))));
        });
        table.appendChild(tbody);
        return CP.el("div", { class: "card" }, CP.el("h3", { text: "Error-budget burn" }), table);
      }
      function alertsCard(data) {
        var alerts = data.alerts || [];
        if (!alerts.length) return CP.el("div");
        var card = CP.el("div", { class: "card" }, CP.el("h3", { text: "Breach alerts" }));
        alerts.forEach(function (alert) {
          card.appendChild(CP.el("div", { class: "feed-item" },
            CP.el("span", { class: "feed-dot " + (alert.severity === "critical" ? "err" : "warn") }),
            CP.el("div", { style: "flex:1" },
              CP.el("div", {}, CP.el("span", { class: "mono", text: alert.slo })),
              CP.el("div", { class: "hint", text: alert.reason || "" }))));
        });
        return card;
      }
    })();
  </script>
</body>
</html>
