# Purchase receipt lifecycle — ERP-02 core document model (issue #647).
#
# Goods arriving: the receipt commits stock on submit and is complete once the
# delivery is booked in. Cancellation remains reachable from both live states so
# a mis-keyed receipt is reversible rather than stuck.
schema: erp.workflow/v1
workflow: purchase-receipt-lifecycle
document: purchase-receipt
version: 1
initial: draft

states:
  - name: draft
    docstatus: 0
    label: Draft
    terminal: false
  - name: submitted
    docstatus: 1
    label: Submitted
    terminal: false
  - name: completed
    docstatus: 1
    label: Booked In
    terminal: true
  - name: cancelled
    docstatus: 2
    label: Cancelled
    terminal: true

transitions:
  - action: submit
    from: draft
    to: submitted
    label: Submit
  - action: complete
    from: submitted
    to: completed
    label: Mark Booked In
  - action: cancel
    from: draft
    to: cancelled
    label: Cancel
  - action: cancel
    from: submitted
    to: cancelled
    label: Cancel
