# Sales order lifecycle — ERP-02 core document model (issue #647).
#
# The order is a commitment, so its terminal state is reached by fulfilling it,
# not by submitting it. Every action is named: an order moves only by `submit`,
# `complete` or `cancel`, which is what makes an unlisted move a refusal rather
# than an implicit transition.
schema: erp.workflow/v1
workflow: sales-order-lifecycle
document: sales-order
version: 1
initial: draft

states:
  - name: draft
    docstatus: 0
    label: Draft
    terminal: false
  - name: submitted
    docstatus: 1
    label: Submitted
    terminal: false
  - name: completed
    docstatus: 1
    label: Completed
    terminal: true
  - name: cancelled
    docstatus: 2
    label: Cancelled
    terminal: true

transitions:
  - action: submit
    from: draft
    to: submitted
    label: Submit
  - action: complete
    from: submitted
    to: completed
    label: Complete
  - action: cancel
    from: draft
    to: cancelled
    label: Cancel
  - action: cancel
    from: submitted
    to: cancelled
    label: Cancel
