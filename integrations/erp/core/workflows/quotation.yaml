# Quotation lifecycle — ERP-02 core document model (issue #647).
#
# Data, not engine code: the durable execution engine consumes this file and
# never owns it. `states` names the lifecycle, `docstatus` carries the closed
# upstream document status each state corresponds to (0 draft / 1 submitted /
# 2 cancelled), and `transitions` names the action that moves a document.
#
# The state set here is parity-locked to schemas/quotation.schema.json's `state`
# enum by the asset gate: changing one without the other fails by name.
schema: erp.workflow/v1
workflow: quotation-lifecycle
document: quotation
version: 1
initial: draft

states:
  - name: draft
    docstatus: 0
    label: Draft
    terminal: false
  - name: submitted
    docstatus: 1
    label: Submitted
    terminal: false
  - name: completed
    docstatus: 1
    label: Accepted
    terminal: true
  - name: cancelled
    docstatus: 2
    label: Cancelled
    terminal: true

transitions:
  - action: submit
    from: draft
    to: submitted
    label: Submit
  - action: complete
    from: submitted
    to: completed
    label: Mark Accepted
  - action: cancel
    from: draft
    to: cancelled
    label: Cancel
  - action: cancel
    from: submitted
    to: cancelled
    label: Cancel
