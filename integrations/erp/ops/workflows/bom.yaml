# BOM lifecycle — ERP-04 manufacturing (issue #649).
#
# A BOM has three states and no completion, because a bill of materials does not
# finish: it is either being written, in force, or withdrawn. `submitted` is what
# an explosion requires and what a work order cites; `cancel` is the only way out
# of it, and docstatus only ever rises (draft 0 -> submitted 1 -> cancelled 2),
# so a withdrawn bill cannot quietly return to force.
schema: erp.workflow/v1
workflow: bom-lifecycle
document: bom
version: 1
initial: draft

states:
  - name: draft
    docstatus: 0
    label: Draft
    terminal: false
  - name: submitted
    docstatus: 1
    label: Active
    terminal: false
  - name: cancelled
    docstatus: 2
    label: Withdrawn
    terminal: true

transitions:
  - action: submit
    from: draft
    to: submitted
    label: Activate
  - action: cancel
    from: draft
    to: cancelled
    label: Withdraw
  - action: cancel
    from: submitted
    to: cancelled
    label: Withdraw
