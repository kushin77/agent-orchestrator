# RFQ lifecycle — ERP-04 procurement (issue #649).
#
# Price discovery closes in one of two ways: the invitation is Closed once the
# order is raised from it, or Cancelled when no order follows. Both are
# terminal, so an RFQ cannot be reopened into a second order by a transition —
# which is what makes `already-converted` a rule (one conversion, recorded on
# the document) rather than a convention.
schema: erp.workflow/v1
workflow: rfq-lifecycle
document: rfq
version: 1
initial: draft

states:
  - name: draft
    docstatus: 0
    label: Draft
    terminal: false
  - name: submitted
    docstatus: 1
    label: Sent
    terminal: false
  - name: completed
    docstatus: 1
    label: Closed
    terminal: true
  - name: cancelled
    docstatus: 2
    label: Cancelled
    terminal: true

transitions:
  - action: submit
    from: draft
    to: submitted
    label: Send
  - action: complete
    from: submitted
    to: completed
    label: Close
  - action: cancel
    from: draft
    to: cancelled
    label: Cancel
  - action: cancel
    from: submitted
    to: cancelled
    label: Cancel
