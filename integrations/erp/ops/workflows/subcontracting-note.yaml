# Subcontracting note lifecycle — ERP-04 procurement (issue #649).
#
# `complete` is labelled Returned: the note is settled when the worked material
# comes back, which is the second half of the subcontracting movement. The
# issue itself posts on `submit`, like every other stock-committing document in
# the module — the state machine records the dealing, the posting records the
# stock.
schema: erp.workflow/v1
workflow: subcontracting-note-lifecycle
document: subcontracting-note
version: 1
initial: draft

states:
  - name: draft
    docstatus: 0
    label: Draft
    terminal: false
  - name: submitted
    docstatus: 1
    label: Issued
    terminal: false
  - name: completed
    docstatus: 1
    label: Returned
    terminal: true
  - name: cancelled
    docstatus: 2
    label: Cancelled
    terminal: true

transitions:
  - action: submit
    from: draft
    to: submitted
    label: Issue
  - action: complete
    from: submitted
    to: completed
    label: Mark Returned
  - action: cancel
    from: draft
    to: cancelled
    label: Cancel
  - action: cancel
    from: submitted
    to: cancelled
    label: Cancel
